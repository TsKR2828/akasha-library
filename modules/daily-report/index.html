<!doctype html>
<html lang="zh-Hant" data-mode="dark">
<head>
  <script>/* 防閃色：首繪前同步殼的深淺模式（同源共用 localStorage） */(function(){try{var m=localStorage.getItem('akasha-mode');if(!m&&window.parent!==window)m=window.parent.document.documentElement.getAttribute('data-mode');if(m)document.documentElement.setAttribute('data-mode',m);}catch(e){}})();</script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>每日館報 — 阿卡夏圖書館</title>
  <link rel="stylesheet" href="../../assets/styles/shared.css">
  <style>
    /* shared.css 已載入全域字體（含 Sorts Mill Goudy／JetBrains Mono／Noto Serif TC／
       Cormorant Garamond），本檔不重複 <link> Google Fonts。 */
    * { box-sizing: border-box; margin: 0; }
    html, body {
      height: 100%;
    }
    body {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      /* 廳墨色：本模組全域套用，供 shared.css 內所有 var(--zone-ink, …) 元件自動取色 */
      --zone-ink: var(--ink-gazette);
    }

    /* ===== Deskbar date chip（今日／選日期）===== */
    .desk-date-chip {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: none;
    }
    .desk-date-chip input[type="date"] {
      height: 24px;
      background: var(--navy-deep);
      border: 1px solid var(--navy-line);
      border-radius: var(--r-sharp);
      color: var(--text-secondary);
      font-family: var(--font-mono);
      font-size: 10.5px;
      padding: 0 6px;
      outline: none;
      color-scheme: dark;
    }
    :root[data-mode="light"] .desk-date-chip input[type="date"] { color-scheme: light; }
    .desk-date-chip input[type="date"]:focus { border-color: var(--gold-dim); }
    .desk-feed-status {
      max-width: 220px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--text-tertiary);
    }
    .desk-feed-status.is-error { color: var(--danger); }

    /* ===== Drawers（來源網址設定／貼上→AI整理／歷史清單，收合預設關閉）===== */
    .gz-drawer {
      background: var(--navy);
      border-bottom: 1px solid var(--navy-line);
      padding: 14px 28px;
      flex-shrink: 0;
      max-height: 42vh;
      overflow-y: auto;
    }
    .gz-drawer[hidden] { display: none; }
    .gz-drawer-title {
      font-family: var(--font-mono);
      font-size: 9px;
      letter-spacing: 0.16em;
      color: var(--gold-dim);
      text-transform: uppercase;
      margin-bottom: 10px;
    }
    .gz-drawer-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .gz-drawer input[type="text"] {
      flex: 1;
      min-width: 0;
      height: 28px;
      background: var(--navy-deep);
      border: 1px solid var(--navy-line);
      border-radius: var(--r-soft);
      color: var(--text-primary);
      font-family: inherit;
      font-size: 11px;
      padding: 0 10px;
      outline: none;
    }
    .gz-drawer input[type="text"]:focus { border-color: var(--gold-dim); }
    .gz-drawer textarea {
      width: 100%;
      min-height: 140px;
      background: var(--navy-deep);
      border: 1px solid var(--navy-line);
      border-radius: var(--r-card);
      color: var(--text-primary);
      font-family: inherit;
      font-size: 13px;
      padding: 10px 12px;
      resize: vertical;
      outline: none;
      line-height: 1.7;
    }
    .gz-drawer textarea:focus { border-color: var(--gold-dim); }
    .gz-drawer textarea::placeholder { color: var(--text-tertiary); }
    .gz-drawer-hint {
      font-size: 11px;
      color: var(--text-tertiary);
      line-height: 1.5;
      margin-top: 8px;
    }
    #manualPanel summary { display: none; } /* 抽屜已提供標題，summary 只保留給 CSS/DOM 相容 */
    .manual-panel-body { display: flex; flex-direction: column; }

    .gz-history-list {
      display: flex;
      flex-direction: column;
      gap: 1px;
      max-height: 220px;
      overflow-y: auto;
    }
    .history-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 8px;
      cursor: pointer;
      border-radius: var(--r-sharp);
      transition: background 0.15s;
    }
    .history-item:hover { background: var(--navy-light); }
    .history-item-date {
      font-size: 11px;
      color: var(--ink-gazette);
      white-space: nowrap;
      font-family: var(--font-mono);
    }
    .history-item-title {
      font-size: 12px;
      color: var(--text-secondary);
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .history-empty {
      padding: 12px 4px;
      font-size: 11px;
      color: var(--text-tertiary);
      text-align: center;
    }
    /* shared.css 未定義 .btn--sm，本檔僅用於歷史清單的小型「刪除」鈕 */
    .btn--sm {
      height: 22px;
      min-height: 22px;
      padding: 0 8px;
      font-size: 10.5px;
      border-radius: var(--r-sharp);
    }

    /* ===== Voice Playback Bar ===== */
    .voice-bar {
      display: none;
      align-items: center;
      gap: 8px;
      padding: 6px 28px;
      border-bottom: 1px solid var(--navy-line);
      background: var(--gold-glow);
      font-size: 11px;
      color: var(--text-secondary);
      flex-shrink: 0;
    }
    .voice-bar.active { display: flex; }
    .voice-bar-text {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--text-tertiary);
      font-style: italic;
    }
    .voice-bar-progress {
      color: var(--gold);
      font-family: var(--font-display);
      white-space: nowrap;
    }
    .bgm-select {
      appearance: none;
      background: var(--navy-light);
      border: 1px solid var(--navy-line);
      border-radius: var(--r-sharp);
      color: var(--text-secondary);
      font-family: inherit;
      font-size: 10px;
      height: 24px;
      padding: 0 6px;
      outline: none;
      cursor: pointer;
    }
    .bgm-select:focus { border-color: var(--gold-dim); }

    /* ===== Content: 真報紙 ===== */
    .gazette-layout {
      max-width: 1080px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr 250px;
      gap: 26px;
      align-items: start;
    }
    .gazette-card {
      background: var(--page-card);
      border: 1px solid var(--page-border);
      box-shadow: var(--page-shadow);
      padding: 34px 42px 44px;
    }
    .gazette-card--empty {
      padding: 70px 42px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      text-align: center;
    }

    /* 刊頭：三線 double-rule masthead */
    .gz-masthead {
      text-align: center;
      border-top: 3px double var(--page-ink);
      border-bottom: 3px double var(--page-ink);
      padding: 16px 0 14px;
    }
    .gz-masthead__cn {
      font-family: var(--font-serif-tc);
      font-size: 34px;
      font-weight: 900;
      letter-spacing: 0.18em;
      color: var(--page-ink);
      line-height: 1.1;
    }
    .gz-masthead__la {
      font-family: var(--font-serif-en);
      font-style: italic;
      font-size: 14px;
      color: var(--ink-gazette);
      margin-top: 4px;
    }
    .gz-issue-line {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 2px;
      border-bottom: 1px solid var(--page-border);
      font-family: var(--font-mono);
      font-size: 9px;
      letter-spacing: 0.12em;
      color: var(--page-pencil);
    }
    .gz-issue-line span:nth-child(2) { flex: 1; text-align: center; }

    .gz-notice {
      margin-top: 18px;
      padding: 8px 12px;
      border: 1px dashed var(--ink-gazette);
      color: var(--page-ink-mid);
      font-family: var(--font-mono);
      font-size: 10.5px;
      line-height: 1.7;
    }
    .gz-notice b { color: var(--ink-gazette); }

    .gz-section { margin-top: 22px; }
    .gz-section:first-of-type { margin-top: 22px; }
    .gz-section-head {
      display: flex;
      align-items: baseline;
      gap: 10px;
      margin-bottom: 10px;
    }
    .gz-emoji { font-size: 16px; line-height: 1; }
    .gz-section-title {
      font-family: var(--font-serif-tc);
      font-size: 16px;
      font-weight: 700;
      color: var(--page-ink);
    }
    .gz-eyebrow {
      font-family: var(--font-mono);
      font-size: 8.5px;
      letter-spacing: 0.18em;
      color: var(--ink-gazette);
    }
    .gz-section-body {
      font-family: var(--font-serif-tc);
      font-size: 13.5px;
      line-height: 2;
      color: var(--page-ink-mid);
    }
    .gz-item-title { font-weight: 700; color: var(--page-ink); }
    .gz-source {
      font-family: var(--font-mono);
      font-size: 9px;
      color: var(--ink-gazette);
      text-decoration: none;
      margin-left: 4px;
      white-space: nowrap;
    }
    .gz-source:hover { text-decoration: underline; }
    .gz-source-text {
      font-family: var(--font-mono);
      font-size: 9px;
      color: var(--page-pencil);
      margin-left: 4px;
      white-space: nowrap;
    }

    .gz-footer {
      margin-top: 30px;
      padding-top: 12px;
      border-top: 1px solid var(--page-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .gz-footer__hand {
      font-family: var(--font-hand);
      font-style: italic;
      font-size: 12px;
      color: var(--page-pencil);
    }
    .gz-footer__file {
      font-family: var(--font-mono);
      font-size: 8.5px;
      color: var(--page-pencil);
    }

    .report-loading {
      text-align: center;
      color: var(--page-pencil);
      font-size: 13px;
      font-family: var(--font-body);
    }
    .report-loading::after {
      content: '';
      display: inline-block;
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--ink-gazette);
      margin-left: 8px;
      animation: pulse-dot 1s ease-in-out infinite;
    }
    @keyframes pulse-dot { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }

    /* 404／未付印章：三行文字（GAZETTE / 未付印 / 日期） */
    .gz-stamp {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      border: 2px dashed var(--ink-gazette);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      transform: rotate(-8deg);
      opacity: 0.85;
    }
    .gz-stamp__eyebrow {
      font-family: var(--font-mono);
      font-size: 7px;
      letter-spacing: 0.2em;
      color: var(--ink-gazette);
    }
    .gz-stamp__word {
      font-family: var(--font-serif-tc);
      font-size: 15px;
      font-weight: 700;
      color: var(--ink-gazette);
    }
    .gz-stamp__date {
      font-family: var(--font-mono);
      font-size: 7.5px;
      color: var(--ink-gazette);
    }
    .gazette-card--empty .empty-state__line { color: var(--page-ink); font-family: var(--font-serif-tc); font-size: 16px; font-weight: 600; }
    .gazette-card--empty .empty-state__sub { color: var(--page-pencil); font-family: var(--font-serif-tc); font-size: 13px; line-height: 1.9; max-width: 340px; }
    .gazette-card--empty .empty-state__actions { display: flex; gap: 10px; margin-top: 2px; }
    .gz-stamp-footnote {
      font-family: var(--font-hand);
      font-style: italic;
      font-size: 11.5px;
      color: var(--page-pencil);
      margin-top: 2px;
    }

    /* 右軌 */
    .gazette-rail {
      display: flex;
      flex-direction: column;
      gap: 14px;
      position: sticky;
      top: 20px;
    }
    .gz-voice-postit { display: flex; align-items: center; gap: 9px; }
    .gz-voice-play {
      width: 26px; height: 26px;
      border-radius: 50%;
      background: var(--page-card);
      border: 1px solid var(--ink-gazette);
      color: var(--ink-gazette);
      font-size: 10px;
      line-height: 1;
      flex: none;
      cursor: pointer;
    }
    .gz-voice-meta {
      font-family: var(--font-mono);
      font-size: 9.5px;
      color: var(--page-ink-mid);
      line-height: 1.5;
    }
    .gz-voice-meta small { color: var(--page-pencil); }
    .gz-coin-body {
      font-family: var(--font-mono);
      font-size: 10.5px;
      line-height: 1.9;
      color: var(--page-ink-mid);
    }
    .gz-rail-archive-item {
      display: flex;
      justify-content: space-between;
      cursor: pointer;
      padding: 2px 0;
    }
    .gz-rail-archive-item:hover { opacity: 0.7; }
    .gz-rail-archive-item span:first-child { font-size: 12px; color: var(--page-ink); }
    .gz-rail-archive-item span:last-child {
      font-family: var(--font-mono);
      font-size: 9px;
      color: var(--ink-gazette);
    }
    .gz-rail-more {
      margin-top: 8px;
      width: 100%;
      justify-content: center;
    }

    /* ===== Responsive ===== */
    @media (max-width: 768px) {
      .gazette-layout { grid-template-columns: 1fr; }
      .gazette-rail { position: static; }
      .gazette-card { padding: 24px 20px 30px; }
      .gz-masthead__cn { font-size: 26px; }
    }
  </style>
</head>
<body>

<!-- Deskbar — 模組唯一 chrome 列；殼負責標題，這裡不放模組名字 -->
<header class="deskbar">
  <span class="desk-status">
    <span class="desk-dot zone-ink"></span>
    <span class="desk-date-chip">
      <button class="btn btn--ghost" id="btnToday" title="回到今天">今日</button>
      <input type="date" id="reportDate" title="選日期">
    </span>
    <button class="btn" id="btnLoadFeed">載入館報</button>
    <span class="desk-feed-status" id="feedStatus"></span>
  </span>
  <span class="desk-spacer"></span>
  <div class="desk-actions">
    <select class="bgm-select" id="bgmSelect" style="display:none" title="伴讀 BGM">
      <option value="">無 BGM</option>
      <option value="quiet_archive_piano">靜謐書庫</option>
      <option value="gentle_yangqin">柔風揚琴</option>
      <option value="meditative_drum">冥想空靈鼓</option>
      <option value="flowing_chime">流水水鐘</option>
    </select>
    <button class="btn btn--gold" id="btnRead" style="display:none" title="朗讀館報">▶ 朗讀</button>
    <button class="btn" id="btnPause" style="display:none">暫停</button>
    <button class="btn btn--danger" id="btnVoiceStop" style="display:none">停止</button>
    <div class="mh-sep"></div>
    <div class="mh-more" id="exportMoreWrap" style="display:none">
      <button class="btn" id="btnExportToggle" aria-haspopup="true" aria-expanded="false">匯出 ▾</button>
      <div class="mh-menu" id="exportMenu">
        <button class="btn" id="btnExportMd">匯出 MD</button>
        <button class="btn" id="btnExportJson">匯出 JSON</button>
      </div>
    </div>
    <button class="btn btn--gold" id="btnSave" style="display:none">存書庫</button>
    <div class="mh-more">
      <button class="btn" id="btnMore" aria-haspopup="true" aria-expanded="false">更多 ▾</button>
      <div class="mh-menu" id="mhMenu">
        <div class="mh-menu-label">來源</div>
        <button class="btn" id="btnOpenFile">開啟本地檔案</button>
        <button class="btn" id="btnToggleSourceSettings">來源網址設定</button>
        <hr class="mh-menu-hr">
        <div class="mh-menu-label">整理</div>
        <button class="btn" id="btnToggleManualPanel">貼上→AI 整理</button>
        <hr class="mh-menu-hr">
        <div class="mh-menu-label">歷史</div>
        <button class="btn" id="btnToggleHistory">歷史清單</button>
      </div>
    </div>
    <input type="file" id="feedFileInput" accept=".json,.md" hidden>
  </div>
</header>

<!-- 抽屜：來源網址設定 -->
<div class="gz-drawer" id="sourceSettingsDrawer" hidden>
  <div class="gz-drawer-title">來源網址設定</div>
  <div class="gz-drawer-row">
    <input type="text" id="feedBaseInput" placeholder="館報來源 base URL">
    <button class="btn btn--gold" id="btnSaveFeedBase">儲存</button>
  </div>
  <div class="gz-drawer-hint">館報管線會抓取 <code>base URL + daily_YYYYMMDD.json</code>。留空並儲存可還原預設來源。</div>
</div>

<!-- 抽屜：貼上→AI 整理（<details> 流程保留，僅收合開關改由更多▾ 觸發） -->
<div class="gz-drawer" id="manualDrawer" hidden>
  <div class="gz-drawer-title">貼上→AI 整理</div>
  <details id="manualPanel" open>
    <summary>手動貼上素材（AI 整理）</summary>
    <div class="manual-panel-body">
      <textarea id="sourceInput" placeholder="將文章、新聞片段或筆記貼在這裡，零韻會幫你整理成結構化的每日館報。&#10;&#10;可以一次貼入多段，會自動分類歸組。"></textarea>
      <div style="display:flex;gap:8px;align-items:center;margin-top:10px">
        <div style="flex:1"></div>
        <button class="btn btn--gold" id="btnGenerate">整理成館報</button>
      </div>
      <div class="gz-drawer-hint">貼上文字後點「整理成館報」，零韻會分類、摘要，產出 §12.3 格式的結構化報告。</div>
    </div>
  </details>
</div>

<!-- 抽屜：歷史清單 -->
<div class="gz-drawer" id="historyDrawer" hidden>
  <div class="gz-drawer-title">過往館報（歷史清單）</div>
  <div class="gz-history-list" id="historyScroll">
    <div class="history-empty" id="historyEmpty">尚無歷史館報</div>
  </div>
</div>

<!-- Voice Playback Bar -->
<div class="voice-bar" id="voiceBar">
  <span class="voice-bar-progress" id="voiceProgress"></span>
  <span class="voice-bar-text" id="voiceText"></span>
</div>

<!-- Main: 真報紙 -->
<div class="page-room" style="flex:1;overflow-y:auto">
  <div class="gazette-layout">
    <div class="gazette-card gazette-card--empty" id="reportScroll"></div>

    <aside class="gazette-rail">
      <div class="postit postit--yellow gz-voice-postit">
        <div>
          <div class="postit__title">語音稿</div>
          <div style="display:flex;align-items:center;gap:9px">
            <button class="gz-voice-play" id="btnRailVoicePlay" title="播放語音稿" style="display:none">▶</button>
            <span class="gz-voice-meta" id="railVoiceMeta">尚無可播放的語音稿</span>
          </div>
        </div>
      </div>
      <div class="postit postit--blue">
        <div class="postit__title">月幣</div>
        <div class="gz-coin-body" id="railCoinBody">餘額－枚<br>本篇整理花費－枚</div>
      </div>
      <div class="index-card" id="railArchive">
        <div class="index-card__label">ARCHIVE · 過刊</div>
        <div id="railArchiveList">
          <div class="history-empty">尚無過刊</div>
        </div>
        <button class="btn btn--ghost btn gz-rail-more" id="btnRailMoreHistory">查看全部過刊</button>
      </div>
    </aside>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast" style="display:none"></div>

<script type="module">
// postMessage type 對照表（本檔為零 import 的 inline module script；加相對 import 會使 file:// 情境整檔失效，
// 故維持字面值，禁止改為 import；改字串值時必須同步 core/export/bridge.js 的 MSG_TYPES）：
//   'akasha-mode-change'(632)                    = MSG_TYPES.MODE_CHANGE
//   'akasha-report-response'(643)                = MSG_TYPES.REPORT_RESPONSE
//   'akasha-ai-get-context'(651)                 = MSG_TYPES.AI_GET_CONTEXT
//   'akasha-ai-context-response'(656)            = MSG_TYPES.AI_CONTEXT_RESPONSE
//   'akasha-report-generate'(672)                = MSG_TYPES.REPORT_GENERATE
//   'akasha-reading-room-memory'(695)            = MSG_TYPES.READING_ROOM_MEMORY
//   'akasha-reading-room-memory-response'(711)   = MSG_TYPES.READING_ROOM_MEMORY_RESPONSE
//   'akasha-voice-play-report'(1236)             = MSG_TYPES.VOICE_PLAY_REPORT
//   'akasha-bgm-play'(1241)                      = MSG_TYPES.BGM_PLAY
//   'akasha-voice-resume'(1249)                  = MSG_TYPES.VOICE_RESUME
//   'akasha-voice-pause'(1252)                   = MSG_TYPES.VOICE_PAUSE
//   'akasha-voice-stop'(1258)                    = MSG_TYPES.VOICE_STOP
//   'akasha-bgm-stop'(1259,1270)                 = MSG_TYPES.BGM_STOP
//   'akasha-voice-state-update'(1265)            = MSG_TYPES.VOICE_STATE_UPDATE
const MODULE_NAME = 'daily-report';

// ===== State =====

// Set default date to today (local time, not UTC)
function localDateStr(date) {
  var d = date || new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

// ===== Toast =====
let toastTimer = null;
function showToast(msg, ms = 2200) {
  toastEl.textContent = msg;
  toastEl.style.display = '';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { toastEl.style.display = 'none'; }, ms);
}

// ===== Escape =====
function escapeHtml(str) {
  return String(str ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

// ===== Theme Sync =====
(function syncMode() {
  try {
    const parentMode = window.parent?.document?.documentElement?.getAttribute('data-mode');
    if (parentMode) document.documentElement.setAttribute('data-mode', parentMode);
  } catch {}
})();
window.addEventListener('message', (e) => {
  if (e.origin !== location.origin) return;
  if (e.data?.type === 'akasha-mode-change') {
    document.documentElement.setAttribute('data-mode', e.data.mode);
  }
});

// ===== AI Bridge =====
var pendingResolvers = new Map();
var reportRequestId = 0;

window.addEventListener('message', (e) => {
  if (e.origin !== location.origin) return;
  if (e.data?.type === 'akasha-report-response') {
    var id = e.data.requestId;
    var resolver = pendingResolvers.get(id);
    if (resolver) {
      resolver(e.data);
      pendingResolvers.delete(id);
    }
  }
  if (e.data?.type === 'akasha-ai-get-context') {
    const summary = state.currentReport
      ? `館報 ${state.currentReport.date}：${state.currentReport.sections?.length || 0} 個主題`
      : '(每日館報已開啟，尚無報告)';
    window.parent.postMessage({
      type: 'akasha-ai-context-response',
      content: summary,
      fileName: '每日館報',
      fileType: 'report',
    }, location.origin);
  }
});

function generateReport(text, date) {
  return new Promise((resolve, reject) => {
    var id = ++reportRequestId;
    pendingResolvers.set(id, (data) => {
      if (data.error) reject(new Error(data.error));
      else resolve(data.report);
    });
    window.parent.postMessage({
      type: 'akasha-report-generate',
      text,
      date,
      requestId: id,
    }, location.origin);
    setTimeout(() => {
      if (pendingResolvers.has(id)) {
        pendingResolvers.delete(id);
        reject(new Error('報告生成逾時'));
      }
    }, 90000);
  });
}

// ===== Memory Bridge (reuse reading-room protocol) =====
let memoryReqId = 0;
const memoryCallbacks = new Map();

function callParentMemory(action, ...args) {
  return new Promise((resolve, reject) => {
    const id = ++memoryReqId;
    memoryCallbacks.set(id, { resolve, reject });
    window.parent.postMessage({
      type: 'akasha-reading-room-memory',
      action,
      args,
      reqId: id,
    }, location.origin);
    setTimeout(() => {
      if (memoryCallbacks.has(id)) {
        memoryCallbacks.delete(id);
        reject(new Error('Memory call timeout'));
      }
    }, 5000);
  });
}

window.addEventListener('message', (e) => {
  if (e.origin !== location.origin) return;
  if (e.data?.type === 'akasha-reading-room-memory-response') {
    const cb = memoryCallbacks.get(e.data.reqId);
    if (cb) {
      memoryCallbacks.delete(e.data.reqId);
      if (e.data.error) cb.reject(new Error(e.data.error));
      else cb.resolve(e.data.result);
    }
  }
});

function openDrawer(name) {
  for (const key in drawers) {
    if (key === name) {
      drawers[key].hidden = false;
    } else {
      drawers[key].hidden = true;
    }

  if (name === 'manual') {

}

  const isOpen = !drawers[name].hidden;
  // 全部先關閉
  for (const key in drawers) drawers[key].hidden = true;
  if (!isOpen) openDrawer(name);
}

// ===== 解析標題前導 emoji（分節：emoji + 節名 + mono 眉字） =====
function splitEmojiTitle(title) {
  const str = String(title || '').trim();
  const m = str.match(/^(\p{Extended_Pictographic}(?:️)?)\s*(.*)$/u);
  if (m && m[2]) return { emoji: m[1], text: m[2] };
  return { emoji: '📰', text: str || '（未命名段落）' };
}
function sectionEyebrow(section, idx) {
  if (section.beat) return String(section.beat).replace(/[_-]+/g, ' ').toUpperCase();
  return `SECTION ${String(idx + 1).padStart(2, '0')}`;
}

// ===== 近似節氣（裝飾用途，非精確天文計算） =====
const SOLAR_TERMS = [
  [1,5,'小寒'],[1,20,'大寒'],[2,4,'立春'],[2,19,'雨水'],[3,5,'驚蟄'],[3,20,'春分'],
  [4,5,'清明'],[4,20,'穀雨'],[5,5,'立夏'],[5,21,'小滿'],[6,5,'芒種'],[6,21,'夏至'],
  [7,7,'小暑'],[7,22,'大暑'],[8,7,'立秋'],[8,23,'處暑'],[9,7,'白露'],[9,23,'秋分'],
  [10,8,'寒露'],[10,23,'霜降'],[11,7,'立冬'],[11,22,'小雪'],[12,7,'大雪'],[12,22,'冬至'],
];
function approxSolarTerm(d) {
  const val = (d.getMonth() + 1) * 100 + d.getDate();
  let chosen = SOLAR_TERMS[SOLAR_TERMS.length - 1][2];
  for (const [mm, dd, name] of SOLAR_TERMS) {
    if (val >= mm * 100 + dd) chosen = name;
  }
  return chosen;
}
const WEEKDAY_ZH = ['日', '一', '二', '三', '四', '五', '六'];
function issueLineParts(report) {
  const d = new Date((report.date || localDateStr()) + 'T00:00:00');
  const valid = !isNaN(d);
  const dateText = valid
    ? `${d.getFullYear()} 年 ${d.getMonth() + 1} 月 ${d.getDate()} 日 · 星期${WEEKDAY_ZH[d.getDay()]} · ${approxSolarTerm(d)}`
    : (report.date || '');
  let issueNo = report.reportId;
  if (!issueNo && valid) {
    const epoch = new Date('2026-01-01T00:00:00');
    issueNo = Math.max(1, Math.round((d - epoch) / 86400000) + 1);
  }
  let printedAt = '晨六時付印';
  if (report.generated_at) {
    const g = new Date(report.generated_at);
    if (!isNaN(g)) printedAt = `${g.getHours()} 時 ${String(g.getMinutes()).padStart(2, '0')} 分付印`;
  }
  return { no: issueNo ? `NO. ${escapeHtml(issueNo)}` : 'NO. —', dateText, printedAt };
}

// ===== RSS 館報 Adapter：外部 daily_YYYYMMDD.json → 內部 renderReport 形狀 =====
function adaptRssReport(raw, fallbackDate) {
  if (!raw || typeof raw !== 'object') {
    return { date: fallbackDate, sections: [] };
  }

  const report = {
    date: String(raw.date || fallbackDate || ''),
  };
  if (raw.reportId != null) report.reportId = String(raw.reportId);
  if (raw.generated_at != null) report.generated_at = String(raw.generated_at);
  if (raw.timezone != null) report.timezone = String(raw.timezone);
  if (raw.status != null) report.status = String(raw.status);
  if (Array.isArray(raw.warnings)) report.warnings = raw.warnings.map(w => String(w));

  const rawSections = Array.isArray(raw.sections) ? raw.sections : [];
  report.sections = rawSections.map(section => adaptRssSection(section));

  return report;
}

function adaptRssSection(section) {
  section = section && typeof section === 'object' ? section : {};

  const beat = section.beat != null ? String(section.beat) : '';
  const baseTitle = section.title != null ? String(section.title)
    : (beat || '（未命名段落）');
  const title = section.emoji != null ? `${String(section.emoji)} ${baseTitle}` : baseTitle;

  let rawItems = section.items || section.entries || section.articles;
  if (!Array.isArray(rawItems)) {
    const text = section.summary != null ? section.summary : section.text;
    rawItems = text != null ? [{ title: baseTitle, summary: text }] : [];
  }

  const out = {
    title,
    items: rawItems.map(item => adaptRssItem(item)),
  };
  if (beat) out.beat = beat;
  return out;
}

function adaptRssItem(item) {
  item = item && typeof item === 'object' ? item : {};

  const title = String(item.title || item.headline || item.name || '（無標題）');
  // rss-news 實際 schema：內文在 context，TTS 稿在 voice_text
  const summary = String(item.summary || item.context || item.description || item.excerpt || item.text || '');
  const voice = typeof item.voice_text === 'string' ? item.voice_text.trim() : '';

  // rss-news 實際 schema：來源是 sources[]（{name, publisher, url}），舊單數欄位保留為 fallback
  let source = String(item.source || item.source_name || item.feed || item.site || '');
  const rawSources = Array.isArray(item.sources) ? item.sources : [];
  if (!source && rawSources.length) {
    const names = rawSources
      .map(s => (s && typeof s === 'object') ? String(s.name || s.publisher || '') : '')
      .filter(Boolean);
    source = [...new Set(names)].join(' · ');
  }

  const isHttp = (u) => typeof u === 'string' && /^https?:\/\//i.test(u);
  let url = [item.url, item.link, item.href].find(isHttp) || '';
  if (!url) {
    const src = rawSources.find(s => s && typeof s === 'object' && isHttp(s.url));
    if (src) url = src.url;
  }

  const out = { title };
  if (summary) out.summary = summary;
  if (voice) out.voice = voice;
  if (source) out.source = source;
  if (url) out.url = url;
  return out;
}

// ===== Markdown 館報 Parser（本機 .md 檔案降級路徑） =====
function parseMdReport(text, fallbackDate) {
  text = String(text || '');
  const lines = text.split(/\r?\n/);

  let date = fallbackDate;
  const dateMatch = text.match(/\d{4}-\d{2}-\d{2}/);
  if (dateMatch) date = dateMatch[0];

  const sections = [];
  let currentSection = null;
  let currentItem = null;

  function ensureDefaultSection() {
    if (!currentSection) {
      currentSection = { title: '內容', items: [] };
      sections.push(currentSection);
    }
    return currentSection;
  }

  for (const rawLine of lines) {
    const line = rawLine.trim();
    if (!line) continue;
    if (/^#\s+/.test(line)) continue; // 主標題已用於抽日期，略過

    const h2 = line.match(/^##\s+(.*)$/);
    if (h2) {
      currentSection = { title: h2[1].trim() || '（未命名段落）', items: [] };
      sections.push(currentSection);
      currentItem = null;
      continue;
    }

    const li = line.match(/^-\s+(.*)$/);
    if (li) {
      const body = li[1];
      const sec = ensureDefaultSection();
      const bold = body.match(/^\*\*(.+?)\*\*\s*(?:—\s*(.*?))?(?:(?:（|\()來源[：:]\s*(.*?)(?:）|\)))?$/);
      if (bold) {
        currentItem = { title: bold[1].trim() };
        if (bold[2]) currentItem.summary = bold[2].trim();
        if (bold[3]) currentItem.source = bold[3].trim();
      } else {
        currentItem = { title: body };
      }
      sec.items.push(currentItem);
      continue;
    }

    // 其他非空行：併入目前 item 的 summary，若無目前 item 則整行當一個新 item 的 title
    const sec = ensureDefaultSection();
    if (currentItem) {
      currentItem.summary = currentItem.summary ? `${currentItem.summary} ${line}` : line;
    } else {
      currentItem = { title: line };
      sec.items.push(currentItem);
    }
  }

  return { date, sections };
}

// ===== Render Report（真報紙排版） =====
function renderReport(report) {
  if (!report?.sections?.length) {
    showErrorState('報告內容為空');
    return;
  }
  reportScroll.classList.remove('gazette-card--empty');

  $('reportHeaderTitle') && ($('reportHeaderTitle').textContent = `館報 — ${report.date || ''}`);

  const issue = issueLineParts(report);
  let html = `
    <div class="gz-masthead">
      <div class="gz-masthead__cn">每日館報</div>
      <div class="gz-masthead__la">The Akasha Gazette</div>
    </div>
    <div class="gz-issue-line">
      <span>${issue.no}</span><span>${escapeHtml(issue.dateText)}</span><span>${escapeHtml(issue.printedAt)}</span>
    </div>
  `;

  if ((report.status && report.status !== 'ok') || (report.warnings && report.warnings.length)) {
    html += `<div class="gz-notice">`;
    if (report.status && report.status !== 'ok') {
      html += `<b>來源標記狀態：</b>${escapeHtml(report.status)}`;
    }
    if (report.warnings && report.warnings.length) {
      html += `${report.status && report.status !== 'ok' ? '　' : ''}<b>警告 ${report.warnings.length} 則：</b>`;
      html += report.warnings.map(w => `・${escapeHtml(w)}`).join('<br>');
    }
    html += `</div>`;
  }

  report.sections.forEach((section, idx) => {
    const { emoji, text } = splitEmojiTitle(section.title);
    const eyebrow = sectionEyebrow(section, idx);
    html += `<div class="gz-section">`;
    html += `<div class="gz-section-head"><span class="gz-emoji">${escapeHtml(emoji)}</span><span class="gz-section-title">${escapeHtml(text)}</span><span class="gz-eyebrow">${escapeHtml(eyebrow)}</span></div>`;
    html += `<div class="gz-section-body">`;
    for (const item of (section.items || [])) {
      html += `・<span class="gz-item-title">${escapeHtml(item.title)}</span>`;
      if (item.summary) html += ` — ${escapeHtml(item.summary)}`;
      if (item.url) {
        html += `<a href="${escapeHtml(item.url)}" class="gz-source" target="_blank" rel="noopener">SOURCE ↗</a>`;
      } else if (item.source) {
        html += `<span class="gz-source-text">來源：${escapeHtml(item.source)}</span>`;
      }
      html += `<br>`;
    }
    html += `</div></div>`;
    if (idx < report.sections.length - 1) {
      html += `<div class="washi"><span></span><span></span></div>`;
    }
  });

  const ymd = (report.date || '').replace(/-/g, '');
  html += `
    <div class="gz-footer">
      <span class="gz-footer__hand">printed at the midnight press</span>
      <span class="gz-footer__file">daily_${escapeHtml(ymd)}.json</span>
    </div>
  `;

  reportScroll.innerHTML = html;
  updateVoiceRail(report);
}

    railVoiceMeta.textContent = '尚無可播放的語音稿';

// ===== 載入館報：URL fetch =====
async function loadFeedByDate() {
  if (state.loadingFeed) return;

  const dateValue = reportDate.value || localDateStr();
  const ymd = dateValue.replace(/-/g, '');
  const url = getFeedBase() + 'daily_' + ymd + '.json';

  state.loadingFeed = true;
  btnLoadFeed.disabled = true;
  feedStatus.classList.remove('is-error');
  feedStatus.textContent = '載入中…';
  showLoadingState('報童正在路上');

  const controller = new AbortController();
  const timeoutId = setTimeout(() => controller.abort(), 15000);

  try {
    const res = await fetch(url, { cache: 'no-store', signal: controller.signal });
    clearTimeout(timeoutId);

    if (res.status === 404) {
      feedStatus.classList.add('is-error');
      feedStatus.textContent = '這一天的館報尚未發佈';
      show404State(dateValue);
      return;
    }
    if (!res.ok) {
      feedStatus.classList.add('is-error');
      feedStatus.textContent = `館報伺服器回應異常（HTTP ${res.status}）`;
      showErrorState(`館報伺服器回應異常（HTTP ${res.status}）`);
      return;
    }

    let json;
    try {
      json = await res.json();
    } catch {
      feedStatus.classList.add('is-error');
      feedStatus.textContent = '館報檔案格式無法解析';
      showErrorState('館報檔案格式無法解析');
      return;
    }

    const report = adaptRssReport(json, dateValue);
    state.currentReport = report;
    state.currentReportId = null;
    renderReport(report);
    toggleReportActions(true);
    feedStatus.classList.remove('is-error');
    feedStatus.textContent = '';
    showToast('館報已載入');
  } catch (err) {
    clearTimeout(timeoutId);
    feedStatus.classList.add('is-error');
    feedStatus.textContent = '無法連線館報來源，請檢查網路或來源設定';
    showErrorState('無法連線館報來源，請檢查網路或來源設定');
  } finally {
    state.loadingFeed = false;
    btnLoadFeed.disabled = false;
  }
}

btnLoadFeed.addEventListener('click', loadFeedByDate);

// ===== 載入館報：本機檔案 =====
btnOpenFile.addEventListener('click', () => { closeAllMenus(); feedFileInput.click(); });

feedFileInput.addEventListener('change', async () => {
  const file = feedFileInput.files && feedFileInput.files[0];
  if (!file) return;

  const dateValue = reportDate.value || localDateStr();

  try {
    const text = await file.text();
    let report;

    if (/\.md$/i.test(file.name)) {
      report = parseMdReport(text, dateValue);
    } else {
      let json;
      try {
        json = JSON.parse(text);
      } catch {
        feedStatus.classList.add('is-error');
        feedStatus.textContent = '館報檔案格式無法解析';
        showErrorState('館報檔案格式無法解析');
        return;
      }
      report = adaptRssReport(json, dateValue);
    }

    state.currentReport = report;
    state.currentReportId = null;
    renderReport(report);
    toggleReportActions(true);
    feedStatus.classList.remove('is-error');
    feedStatus.textContent = '';
    showToast('館報已載入');
  } catch (err) {
    feedStatus.classList.add('is-error');
    feedStatus.textContent = '館報檔案格式無法解析';
    showErrorState('館報檔案格式無法解析');
  } finally {
    feedFileInput.value = '';
  }
});

// ===== Save =====
btnSave.addEventListener('click', async () => {
  if (!state.currentReport) return;

  const report = state.currentReport;
  const sectionCount = report.sections?.length || 0;
  const title = `館報 ${report.date}（${sectionCount} 主題）`;

  try {
    const saved = await callParentMemory('save', {
      id: state.currentReportId || undefined,
      module: MODULE_NAME,
      scope: 'report',
      title,
      content: JSON.stringify(report),
      tags: ['館報', report.date],
      source: 'daily-report',
    });
    state.currentReportId = saved?.id || state.currentReportId;
    showToast('館報已儲存');
    await loadHistory();
  } catch (err) {
    showToast('儲存失敗：' + err.message);
  }
});

// ===== Export =====
function exportReport(fmt) {
  if (!state.currentReport) return;
  const report = state.currentReport;
  const date = report.date || localDateStr();
  let blob, filename;

  if (fmt === 'md') {
    const lines = [`# 每日館報 — ${date}`, ''];
    for (const section of (report.sections || [])) {
      lines.push(`## ${section.title}`, '');
      for (const item of (section.items || [])) {
        let line = `- **${item.title}**`;
        if (item.summary) line += ` — ${item.summary}`;
        if (item.source) line += `（來源：${item.source}）`;
        lines.push(line);
      }
      lines.push('');
    }
    blob = new Blob([lines.join('\n')], { type: 'text/markdown;charset=utf-8' });
    filename = `館報_${date}.md`;
  } else {
    blob = new Blob([JSON.stringify(report, null, 2)], { type: 'application/json;charset=utf-8' });
    filename = `館報_${date}.json`;
  }

  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.click();
  URL.revokeObjectURL(url);
  showToast('已匯出 ' + filename);
}

btnExportMd.addEventListener('click', () => { closeAllMenus(); exportReport('md'); });
btnExportJson.addEventListener('click', () => { closeAllMenus(); exportReport('json'); });

// ===== History =====
async function loadHistory() {
  try {
    const all = await callParentMemory('getAll', MODULE_NAME);
    state.history = (all || [])
      .filter(r => r.scope === 'report')
      .sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
    renderHistory();
  } catch {
    state.history = [];
    renderHistory();
  }
}

function historyDateLabel(h) {
  const tags = (h.tags || []).filter(t => t !== '館報');
  return tags[0] || formatDate(h.createdAt);
}

function renderHistory() {
  // 抽屜內完整清單（含刪除）
  const empty = $('historyEmpty');
  if (state.history.length === 0) {
    historyScroll.innerHTML = '';
    historyScroll.appendChild(empty);
    empty.style.display = '';
  } else {
    empty.style.display = 'none';
    historyScroll.innerHTML = state.history.map(h => `
      <div class="history-item" data-id="${escapeHtml(h.id)}">
        <span class="history-item-date">${escapeHtml(historyDateLabel(h))}</span>
        <span class="history-item-title">${escapeHtml(h.title)}</span>
        <button class="btn btn--sm btn--danger" data-delete="${escapeHtml(h.id)}">刪除</button>
      </div>
    `).join('');
  }

  // 右軌過刊索引卡（精簡版，前 5 筆）
  if (state.history.length === 0) {
    railArchiveList.innerHTML = '<div class="history-empty">尚無過刊</div>';
  } else {
    railArchiveList.innerHTML = state.history.slice(0, 5).map((h, i) => {
      const label = historyDateLabel(h);
      const d = /^\d{4}-\d{2}-\d{2}$/.test(label) ? new Date(label + 'T00:00:00') : null;
      const shown = d ? `${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')} · 週${WEEKDAY_ZH[d.getDay()]}刊` : label;
      const no = d ? issueLineParts({ date: label }).no.replace('NO. ', 'NO.') : '';
      return `<div class="gz-rail-archive-item" data-id="${escapeHtml(h.id)}"><span>${escapeHtml(shown)}</span><span>${escapeHtml(no)}</span></div>`;
    }).join('');
  }
}

function formatDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return `${d.getMonth() + 1}/${d.getDate()} ${d.getHours()}:${String(d.getMinutes()).padStart(2, '0')}`;
}

async function loadHistoryRecordById(id) {
  const record = state.history.find(h => h.id === id);
  if (!record) return;
  try {
    const report = JSON.parse(record.content);
    state.currentReport = report;
    state.currentReportId = id;
    renderReport(report);
    toggleReportActions(true);
  } catch {
    showToast('無法解析該館報');
  }
}

historyScroll.addEventListener('click', async (e) => {
  // Delete
  const delBtn = e.target.closest('[data-delete]');
  if (delBtn) {
    e.stopPropagation();
    if (!confirm('確定要刪除這筆館報嗎？')) return;
    try {
      await callParentMemory('delete', delBtn.dataset.delete);
      showToast('已刪除');
      if (state.currentReportId === delBtn.dataset.delete) {
        state.currentReport = null;
        state.currentReportId = null;
        showEmptyState();
        toggleReportActions(false);
        $('reportHeaderTitle') && ($('reportHeaderTitle').textContent = '報告預覽');
      }
      await loadHistory();
    } catch (err) {
      showToast('刪除失敗：' + err.message);
    }
    return;
  }

  // Load
  const item = e.target.closest('.history-item');
  if (!item) return;
  await loadHistoryRecordById(item.dataset.id);
});

railArchiveList.addEventListener('click', (e) => {
  const item = e.target.closest('.gz-rail-archive-item');
  if (!item) return;
  loadHistoryRecordById(item.dataset.id);
});

// ===== Voice Playback =====
let voicePlaying = false;
let voicePaused = false;

function setVoiceUI(playing, paused) {
  voicePlaying = playing;
  voicePaused = paused;
  btnRead.style.display = state.currentReport && !playing ? '' : 'none';
  btnPause.style.display = playing ? '' : 'none';
  btnPause.textContent = paused ? '繼續' : '暫停';
  btnVoiceStop.style.display = playing || paused ? '' : 'none';
  voiceBar.classList.toggle('active', playing || paused);
  if (!playing && !paused) {
    voiceProgress.textContent = '';
    voiceText.textContent = '';
  }
}

btnRead.addEventListener('click', () => {
  if (!state.currentReport) return;
  window.parent.postMessage({
    type: 'akasha-voice-play-report',
    report: state.currentReport,
  }, location.origin);
  const preset = bgmSelect.value;
  if (preset) {
    window.parent.postMessage({ type: 'akasha-bgm-play', presetId: preset }, location.origin);
  }
  setVoiceUI(true, false);
  showToast('開始朗讀');
});

btnPause.addEventListener('click', () => {
  if (voicePaused) {
    window.parent.postMessage({ type: 'akasha-voice-resume' }, location.origin);
    setVoiceUI(true, false);
  } else {
    window.parent.postMessage({ type: 'akasha-voice-pause' }, location.origin);
    setVoiceUI(true, true);
  }
});

btnVoiceStop.addEventListener('click', () => {
  window.parent.postMessage({ type: 'akasha-voice-stop' }, location.origin);
  window.parent.postMessage({ type: 'akasha-bgm-stop' }, location.origin);
  setVoiceUI(false, false);
});

window.addEventListener('message', (e) => {
  if (e.origin !== location.origin) return;
  if (e.data?.type === 'akasha-voice-state-update') {
    const d = e.data;
    if (!d.speaking && !d.paused) {
      setVoiceUI(false, false);
      if (voicePlaying) {
        window.parent.postMessage({ type: 'akasha-bgm-stop' }, location.origin);
      }
    } else {
      setVoiceUI(d.speaking || d.paused, d.paused);
      if (d.total > 0) {
        voiceProgress.textContent = `${(d.index || 0) + 1}/${d.total}`;
      }
      if (d.text) {
        voiceText.textContent = d.text.length > 60 ? d.text.slice(0, 60) + '…' : d.text;
      }
    }
  }
});

// ===== Init =====
// reportHeaderTitle：內部書帳用（AI context 摘要等曾參照），不在畫面上顯示，避免違反「模組內不放標題」鐵則
if (!$('reportHeaderTitle')) {
  const hiddenTitle = document.createElement('span');
  hiddenTitle.id = 'reportHeaderTitle';
  hiddenTitle.hidden = true;
  hiddenTitle.textContent = '報告預覽';
  document.body.appendChild(hiddenTitle);
}
showEmptyState();
updateVoiceRail(null);
loadHistory();
</script>
