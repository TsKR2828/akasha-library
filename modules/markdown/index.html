<!doctype html>
<html lang="zh-Hant" data-mode="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Code & Data Reader — 阿卡夏圖書館</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Noto+Serif+TC:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/styles/shared.css">
  <style>
    body {
      margin: 0;
      font-family: var(--font-body);
      color: var(--text-primary);
      background: var(--navy-deep);
      min-height: 100vh;
    }

    /* Header bar */
    header {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      padding: 10px 14px;
      border-bottom: 1px solid var(--navy-line);
      background: rgba(24,29,40,0.96);
      backdrop-filter: blur(8px);
    }

    :root[data-mode="light"] header {
      background: rgba(245,239,225,0.96);
    }

    h1 {
      margin: 0 8px 0 0;
      font-family: var(--font-display);
      font-size: 17px;
      font-weight: 500;
      color: var(--gold);
      letter-spacing: 0.04em;
      white-space: nowrap;
    }

    /* Buttons */
    .btn {
      appearance: none;
      border: 1px solid var(--navy-line);
      background: var(--navy-light);
      color: var(--text-primary);
      padding: 7px 10px;
      border-radius: var(--r-card);
      font-size: 12px;
      font-family: inherit;
      line-height: 1;
      min-height: 30px;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }

    .btn:hover {
      border-color: var(--gold-dim);
      background: var(--navy-hover);
    }

    .btn--gold {
      background: var(--gold-glow);
      border-color: var(--gold-dim);
      color: var(--gold);
    }

    .btn--gold:hover {
      background: rgba(201,168,106,0.22);
      border-color: var(--gold);
    }

    .btn--sheets {
      background: rgba(106,174,127,0.12);
      border-color: rgba(106,174,127,0.4);
      color: var(--success);
    }

    .btn--sheets:hover {
      background: rgba(106,174,127,0.22);
      border-color: var(--success);
    }

    .btn--danger {
      background: rgba(196,96,79,0.1);
      border-color: rgba(196,96,79,0.3);
      color: var(--danger);
    }

    #editError {
      color: var(--danger);
      font-size: 12px;
      max-width: 320px;
      line-height: 1.4;
    }

    label.file-label {
      appearance: none;
      border: 1px solid var(--gold-dim);
      background: var(--gold-glow);
      color: var(--gold);
      padding: 7px 10px;
      border-radius: var(--r-card);
      font-size: 12px;
      font-family: inherit;
      line-height: 1;
      min-height: 30px;
      cursor: pointer;
      transition: all 0.15s;
    }

    label.file-label:hover {
      background: rgba(201,168,106,0.22);
      border-color: var(--gold);
    }

    input[type="file"] { display: none; }

    input[type="search"] {
      appearance: none;
      border: 1px solid var(--navy-line);
      background: var(--navy-light);
      color: var(--text-primary);
      padding: 7px 10px;
      border-radius: var(--r-card);
      font-size: 12px;
      font-family: inherit;
      min-width: 180px;
      min-height: 30px;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="search"]:focus {
      border-color: var(--gold-dim);
    }

    input[type="search"]::placeholder {
      color: var(--text-tertiary);
    }

    #status {
      flex: 1 1 200px;
      color: var(--text-secondary);
      font-size: 11px;
      min-width: 160px;
    }

    .sheets-group {
      display: none;
      gap: 6px;
      flex-wrap: wrap;
    }

    .sheets-group.visible {
      display: flex;
    }

    .separator {
      width: 1px;
      height: 20px;
      background: var(--navy-line);
      margin: 0 4px;
    }

    /* Layout */
    .app {
      display: grid;
      grid-template-columns: 300px minmax(0, 1fr);
      gap: 10px;
      padding: 10px;
      min-height: calc(100vh - 56px);
    }

    /* Cards */
    .card {
      background: var(--navy-light);
      border: 1px solid var(--navy-line);
      border-radius: var(--r-card);
      box-shadow: var(--shadow-card);
      overflow: hidden;
    }

    .card + .card { margin-top: 10px; }

    .card-title {
      padding: 8px 12px;
      border-bottom: 1px solid var(--navy-line);
      background: var(--navy);
      font-size: 11px;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .card-body { padding: 10px 12px; }

    .kv {
      display: grid;
      grid-template-columns: 70px 1fr;
      gap: 5px 8px;
      font-size: 12px;
      line-height: 1.5;
      word-break: break-word;
    }

    .kv .key { color: var(--text-tertiary); }

    .hint-box {
      font-size: 12px;
      line-height: 1.7;
      color: var(--text-secondary);
    }

    .hint-box h3 {
      margin: 0 0 6px;
      font-size: 13px;
      color: var(--text-primary);
    }

    .hint-box ul { margin: 6px 0 0; padding-left: 1.25em; }
    .hint-box li { margin: 3px 0; }

    /* HINTS 聯動系統 — upper/lower split */
    .hints-divider {
      border: none;
      border-top: 1px dashed var(--navy-line);
      margin: 8px 0;
    }
    .hints-lower {
      min-height: 0;
      transition: opacity 200ms;
    }
    .hints-op-record {
      font-size: 11.5px;
      line-height: 1.6;
      color: var(--gold);
    }
    .hints-op-record .op-check {
      color: #6fcf97;
      margin-right: 2px;
    }
    .hints-op-record .op-time {
      color: var(--text-tertiary);
      font-size: 10.5px;
      margin-left: 4px;
    }
    .hints-hover-desc {
      font-size: 11.5px;
      line-height: 1.6;
      color: var(--text-secondary);
      margin-top: 4px;
    }
    .hints-hover-desc .hover-label {
      color: var(--text-primary);
      font-weight: 600;
    }
    .hints-hover-desc .hover-label::before {
      content: '▸ ';
      color: var(--gold);
    }

    /* Toast */
    .toast-container {
      position: fixed;
      top: 12px;
      right: 12px;
      z-index: 9999;
      pointer-events: none;
    }
    .toast {
      background: var(--navy-light);
      border: 1px solid var(--gold-line);
      border-radius: var(--r-card);
      padding: 8px 16px;
      font-size: 12px;
      color: var(--gold);
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
      opacity: 0;
      transform: translateY(-8px);
      transition: opacity 300ms, transform 300ms;
      margin-bottom: 6px;
    }
    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }
    .toast .toast-check {
      color: #6fcf97;
      margin-right: 4px;
    }

    /* Mobile popover (long press) */
    .mobile-popover {
      position: fixed;
      z-index: 9999;
      background: var(--navy-light);
      border: 1px solid var(--gold-line);
      border-radius: var(--r-card);
      padding: 8px 14px;
      font-size: 12px;
      line-height: 1.6;
      color: var(--text-secondary);
      max-width: 220px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.5);
      pointer-events: none;
      opacity: 0;
      transform: translateY(4px);
      transition: opacity 150ms, transform 150ms;
    }
    .mobile-popover.show {
      opacity: 1;
      transform: translateY(0);
    }
    .mobile-popover .pop-label {
      color: var(--gold);
      font-weight: 600;
      display: block;
      margin-bottom: 2px;
    }

    .badge-row {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 6px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      border: 1px solid var(--navy-line);
      border-radius: 999px;
      padding: 2px 7px;
      font-size: 10px;
      color: var(--text-secondary);
      background: var(--navy);
    }

    .badge.warn { background: rgba(180,83,9,0.1); color: #e8a54b; border-color: rgba(180,83,9,0.3); }
    .badge.danger { background: rgba(196,96,79,0.1); color: var(--danger); border-color: rgba(196,96,79,0.3); }
    .badge.ok { background: rgba(106,174,127,0.1); color: var(--success); border-color: rgba(106,174,127,0.3); }

    /* Reader panel */
    .reader {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      min-height: calc(100vh - 76px);
    }

    .tabs {
      display: flex;
      gap: 6px;
      padding: 8px 10px;
      border-bottom: 1px solid var(--navy-line);
      background: var(--navy);
      flex-wrap: wrap;
    }

    .tab {
      padding: 5px 10px;
      border-radius: 999px;
      border: 1px solid var(--navy-line);
      background: var(--navy-light);
      cursor: pointer;
      font-size: 11px;
      font-family: inherit;
      color: var(--text-secondary);
      transition: all 0.15s;
    }

    .tab:hover {
      border-color: var(--gold-dim);
      color: var(--text-primary);
    }

    .tab.active {
      background: var(--gold-glow);
      border-color: var(--gold-dim);
      color: var(--gold);
      font-weight: 600;
    }

    .view-wrap {
      min-height: 0;
      overflow: auto;
      background: var(--navy-light);
    }

    .view {
      display: none;
      padding: 18px;
      min-height: 100%;
    }

    .view.active { display: block; }

    textarea#rawEditor {
      width: 100%;
      min-height: calc(100vh - 160px);
      border: 1px solid var(--navy-line);
      border-radius: var(--r-card);
      resize: vertical;
      padding: 14px;
      font: 13px/1.65 var(--font-mono);
      outline: none;
      color: var(--text-primary);
      background: var(--navy);
    }

    textarea#rawEditor:focus {
      border-color: var(--gold-dim);
    }

    .drop-zone {
      border: 2px dashed var(--gold-dim) !important;
      background: var(--gold-glow) !important;
    }

    /* Markdown body */
    .markdown-body {
      max-width: 980px;
      line-height: 1.82;
      font-size: 15px;
      color: var(--text-primary);
    }

    .markdown-body h1 { font-size: 26px; margin: 0 0 18px; line-height: 1.35; color: var(--gold-bright); font-family: var(--font-display); }
    .markdown-body h2 { font-size: 21px; margin: 30px 0 10px; line-height: 1.4; border-bottom: 1px solid var(--navy-line); padding-bottom: 6px; color: var(--gold); }
    .markdown-body h3 { font-size: 17px; margin: 24px 0 8px; line-height: 1.4; color: var(--gold-dim); }
    .markdown-body p { margin: 0 0 12px; }
    .markdown-body ul, .markdown-body ol { padding-left: 1.4em; margin: 0 0 14px; }
    .markdown-body li { margin: 3px 0; }
    .markdown-body a { color: var(--gold); text-decoration: underline; text-decoration-color: var(--gold-dim); }
    .markdown-body code, .inline-code { background: var(--navy); padding: 2px 5px; border-radius: 4px; font-family: var(--font-mono); font-size: 0.9em; color: var(--gold-bright); border: 1px solid var(--navy-line); }
    .markdown-body pre, pre.code-block {
      background: var(--navy);
      padding: 12px;
      overflow: auto;
      border-radius: var(--r-card);
      border: 1px solid var(--navy-line);
      font: 12px/1.65 var(--font-mono);
      color: var(--text-primary);
    }
    .markdown-body table { border-collapse: collapse; width: 100%; margin: 14px 0; font-size: 13px; }
    .markdown-body th, .markdown-body td { border: 1px solid var(--navy-line); padding: 7px 9px; vertical-align: top; }
    .markdown-body th { background: var(--navy); color: var(--gold); font-weight: 600; }

    /* JSON tree */
    .json-tree {
      font: 13px/1.65 var(--font-mono);
      white-space: nowrap;
    }

    .tree-node { margin-left: 18px; }
    .tree-line { cursor: default; padding: 1px 0; }
    .tree-toggle { cursor: pointer; user-select: none; color: var(--gold); display: inline-block; width: 16px; }
    .tree-key { color: #b89aff; }
    .tree-string { color: #6aae7f; }
    .tree-number { color: #6ba5e8; }
    .tree-bool { color: #e8a54b; }
    .tree-null { color: var(--text-tertiary); }
    .tree-hidden { display: none; }

    /* Score cards */
    .score-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 10px;
      margin-bottom: 14px;
    }

    .score-card {
      border: 1px solid var(--navy-line);
      border-radius: var(--r-card);
      background: var(--navy);
      overflow: hidden;
    }

    .score-card h2 {
      margin: 0;
      padding: 8px 12px;
      background: var(--navy-deep);
      border-bottom: 1px solid var(--navy-line);
      font-size: 13px;
      color: var(--gold);
    }

    .score-card .inner { padding: 10px 12px; }

    table.data-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
      margin: 8px 0 14px;
    }

    table.data-table th, table.data-table td {
      border: 1px solid var(--navy-line);
      padding: 6px 8px;
      text-align: left;
      vertical-align: top;
    }

    table.data-table th { background: var(--navy); color: var(--gold-dim); }

    /* Python view */
    .py-layout {
      display: grid;
      grid-template-columns: 260px minmax(0, 1fr);
      gap: 10px;
    }

    .outline-box {
      border: 1px solid var(--navy-line);
      border-radius: var(--r-card);
      background: var(--navy);
      overflow: hidden;
      align-self: start;
      position: sticky;
      top: 70px;
    }

    .outline-box h2 {
      margin: 0;
      padding: 8px 12px;
      font-size: 13px;
      background: var(--navy-deep);
      border-bottom: 1px solid var(--navy-line);
      color: var(--gold);
    }

    .outline-list { padding: 10px 12px; font-size: 12px; line-height: 1.7; color: var(--text-secondary); }
    .outline-list code { background: var(--navy-light); padding: 1px 4px; border-radius: 3px; font-family: var(--font-mono); color: var(--gold-bright); border: 1px solid var(--navy-line); }

    .code-table {
      width: 100%;
      border-collapse: collapse;
      font: 12px/1.6 var(--font-mono);
      background: var(--navy);
      border: 1px solid var(--navy-line);
      border-radius: var(--r-card);
      overflow: hidden;
    }

    .code-table td { vertical-align: top; }
    .line-no {
      width: 48px;
      text-align: right;
      color: var(--text-tertiary);
      background: var(--navy-deep);
      border-right: 1px solid var(--navy-line);
      padding: 0 8px;
      user-select: none;
    }
    .line-code { padding: 0 10px; white-space: pre; }

    .tok-comment { color: var(--text-tertiary); }
    .tok-keyword { color: #b89aff; font-weight: 700; }
    .tok-string { color: #6aae7f; }
    .tok-number { color: #6ba5e8; }
    .tok-func { color: var(--danger); }

    .error-box {
      border: 1px solid rgba(196,96,79,0.3);
      background: rgba(196,96,79,0.08);
      color: var(--danger);
      border-radius: var(--r-card);
      padding: 10px;
      line-height: 1.65;
      margin-bottom: 10px;
      font-size: 13px;
    }

    .search-hit {
      background: rgba(201,168,106,0.3);
      padding: 0 2px;
      border-radius: 3px;
      color: var(--gold-bright);
    }

    .empty-state {
      max-width: 600px;
      margin: 40px auto;
      text-align: center;
      color: var(--text-secondary);
      line-height: 1.8;
      border: 2px dashed var(--navy-line);
      border-radius: var(--r-card);
      padding: 32px 20px;
      background: var(--navy);
    }

    .empty-state h2 {
      color: var(--gold);
      font-family: var(--font-display);
      font-size: 18px;
      margin: 0 0 10px;
    }

    .empty-state p {
      font-size: 13px;
    }

    @media (max-width: 980px) {
      .app { grid-template-columns: 1fr; }
      .py-layout { grid-template-columns: 1fr; }
      .outline-box { position: static; }
    }

    /* Disabled button */
    .btn[disabled] {
      opacity: 0.35;
      cursor: not-allowed;
      pointer-events: none;
    }

    /* Edit group (undo/redo + diff) */
    .edit-group {
      display: none;
      gap: 4px;
      align-items: center;
    }
    .edit-group.visible { display: flex; }

    /* Diff highlight in raw editor */
    .diff-bar {
      display: none;
      gap: 6px;
      align-items: center;
      font-size: 11px;
      color: var(--text-secondary);
    }
    .diff-bar.visible { display: flex; }
    .diff-count { color: var(--gold); font-family: var(--font-mono); }

    /* Diff overlay (shown in pretty view after edit) */
    .diff-line-added {
      background: rgba(106,174,127,0.12);
      border-left: 3px solid var(--success);
      padding-left: 8px;
      margin: 0 -12px;
      padding-right: 12px;
    }
    .diff-line-removed {
      background: rgba(196,96,79,0.08);
      border-left: 3px solid var(--danger);
      padding-left: 8px;
      margin: 0 -12px;
      padding-right: 12px;
      text-decoration: line-through;
      opacity: 0.6;
    }

    /* History panel */
    .history-panel {
      display: none;
      max-height: 260px;
      overflow-y: auto;
    }
    .history-panel.visible { display: block; }
    .history-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 8px;
      border-bottom: 1px solid var(--navy-line);
      font-size: 11px;
      cursor: pointer;
      transition: background 0.12s;
    }
    .history-item:hover { background: var(--navy-hover); }
    .history-item-time {
      color: var(--text-tertiary);
      font-family: var(--font-mono);
    }
    .history-item-label { color: var(--text-secondary); }
    .history-item-active { color: var(--gold); font-weight: 600; }

    /* Light mode overrides */
    :root[data-mode="light"] .markdown-body code,
    :root[data-mode="light"] .inline-code {
      color: var(--gold-deep);
    }
  </style>
</head>
<body>
  <header>
    <h1>Code & Data Reader</h1>
    <label class="file-label" title="從電腦選一個檔案打開">
      開啟檔案
      <input id="fileInput" type="file" accept=".py,.json,.jsonl,.md,.markdown,.txt,.score.json,.docx,.doc,text/plain,application/json,text/markdown,application/vnd.openxmlformats-officedocument.wordprocessingml.document">
    </label>
    <button class="btn" id="btnEditToggle" style="display:none" title="直接修改檔案內容（支援 md / txt / json）">編輯模式</button>
    <button class="btn--gold btn" id="btnDownloadEdited" style="display:none" title="把編輯後的檔案存到你的電腦">下載新檔</button>
    <button class="btn--gold btn" id="btnSaveToLibrary" style="display:none" title="把編輯後的檔案存進圖書館，下次不用重新上傳">存檔至書庫</button>

    <!-- Edit tools: undo/redo + diff -->
    <div class="edit-group" id="editGroup">
      <button class="btn" id="btnUndo" title="復原上一步操作">↩ 復原</button>
      <button class="btn" id="btnRedo" title="重做剛才復原的操作">↪ 重做</button>
      <span class="separator"></span>
      <button class="btn" id="btnShowDiff" title="標記你改過的地方">變更標示</button>
      <button class="btn" id="btnClearDiff" style="display:none" title="清除所有變更標記">清除標示</button>
    </div>

    <span id="editError" style="display:none"></span>
    <button class="btn" id="copyRaw" title="複製你實際打的文字，包含 ### 這些符號">複製原始內容</button>
    <button class="btn--gold btn" id="copyView" title="複製畫面上看到的樣子，符號會變成標題粗體等">複製目前視圖</button>
    <button class="btn" id="downloadText" title="把檔案存到你的電腦">下載目前內容</button>
    <button class="btn--gold btn" id="exportDocx" style="display:none" title="把 Markdown 內容轉成 Word 文件(.docx)下載">匯出 DOCX</button>
    <button class="btn--gold btn" id="exportScriptDocx" style="display:none" title="把劇本內容轉成 Word 文件(.docx)下載">劇本 DOCX</button>
    <button class="btn--gold btn" id="exportScriptPdf" style="display:none" title="開啟劇本排版頁面，可直接列印或存成 PDF">劇本 PDF 預覽</button>
    <button class="btn--gold btn" id="exportSummary" title="自動幫你整理這個檔案的重點大綱">匯出摘要 .md</button>
    <button class="btn" id="btnSaveSummaryToLibrary" style="display:none" title="把摘要存進圖書館，與原始檔案建立關聯">摘要存入書庫</button>

    <span class="separator"></span>

    <!-- Sheets export group — visible only in MD mode -->
    <div class="sheets-group" id="sheetsGroup">

  </header>

  <div class="app" id="appRoot">
    <aside>
      <section class="card">
        <div class="card-title">File Info</div>

    <main class="card reader">
      <nav class="tabs" id="tabs"></nav>

            <p>支援 .py、.json、.score.json、.md、.txt<br>閱讀、整理、提示、複製與匯出至 Google Sheets</p>
          </div>

  <div class="toast-container" id="toastContainer"></div>

  <script>
    // ═══════════════════════════════════════════
    //  STATE
    // ═══════════════════════════════════════════
    const state = {
      filename: "",
      extension: "",
      content: "",
      parsedJson: null,
      jsonError: null,
      mode: "empty",
      activeTab: "pretty",
      searchTerm: "",
      editMode: false,
      dirty: false,
      _scriptBlocks: null,
      _isPlainScript: false
    };

    const appRoot = document.getElementById("appRoot");
    const fileInput = document.getElementById("fileInput");
    const statusEl = document.getElementById("status");
    const fileInfo = document.getElementById("fileInfo");
    const fileHint = document.getElementById("fileHint");
    const checkPanel = document.getElementById("checkPanel");
    const tabsEl = document.getElementById("tabs");
    const rawEditor = document.getElementById("rawEditor");
    const sheetsGroup = document.getElementById("sheetsGroup");

    // HINTS 聯動
    const hintsDivider = document.getElementById("hintsDivider");
    const hintsOpRecord = document.getElementById("hintsOpRecord");
    const hintsHoverDesc = document.getElementById("hintsHoverDesc");
    const toastContainer = document.getElementById("toastContainer");
    let lastOpTime = null;
    let lastOpText = "";
    let opTimerInterval = null;

    const views = {
      empty: document.getElementById("emptyView"),
      pretty: document.getElementById("prettyView"),
      tree: document.getElementById("treeView"),
      score: document.getElementById("scoreView"),
      python: document.getElementById("pythonView"),
      raw: document.getElementById("rawView")
    };

    // ═══════════════════════════════════════════
    //  UTILITIES
    // ═══════════════════════════════════════════
    function escapeHtml(str) {
      return String(str ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/\"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function stripMarkdown(text) {
      return String(text)
        .replace(/<a\s+[^>]*href=["']([^"']+)["'][^>]*>([\s\S]*?)<\/a>/gi, "$2 ($1)")
        .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, "$1 ($2)")
        .replace(/\*\*(.*?)\*\*/g, "$1")
        .replace(/`([^`]+)`/g, "$1")
        .replace(/<br\s*\/?>/gi, " ")
        .replace(/<[^>]+>/g, "")
        .replace(/\\\|/g, "|")
        .trim();
    }

    function sanitizeAnchor(html) {
      const hrefMatch = html.match(/href\s*=\s*["']([^"']*)["']/i);
      const href = hrefMatch ? hrefMatch[1] : '';
      if (!/^https?:\/\//i.test(href)) return escapeHtml(html);
      const textMatch = html.match(/>([^<]*)<\/a>/i);
      const text = textMatch ? escapeHtml(textMatch[1]) : escapeHtml(href);
      return `<a href="${escapeHtml(href)}" target="_blank" rel="noopener noreferrer">${text}</a>`;
    }

    function inlineMarkdownToHtml(text) {
      const rawAnchors = [];
      let s = String(text ?? "");
      s = s.replace(/<a\s+[^>]*>[\s\S]*?<\/a>/gi, match => {
        rawAnchors.push(match);
        return `@@RAWHTML${rawAnchors.length - 1}@@`;
      });
      s = escapeHtml(s);
      s = s.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
      s = s.replace(/`([^`]+)`/g, '<code class="inline-code">$1</code>');
      s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
      rawAnchors.forEach((html, i) => {
        s = s.replace(`@@RAWHTML${i}@@`, sanitizeAnchor(html));
      });
      return s;
    }

    // ═══════════════════════════════════════════
    //  HINTS 聯動 + TOAST
    // ═══════════════════════════════════════════
    function relativeTime(ts) {
      const diff = Math.floor((Date.now() - ts) / 1000);
      if (diff < 5) return '剛剛';
      if (diff < 60) return diff + ' 秒前';
      if (diff < 3600) return Math.floor(diff / 60) + ' 分鐘前';
      return Math.floor(diff / 3600) + ' 小時前';
    }

    function recordOperation(text) {
      lastOpText = text;
      lastOpTime = Date.now();
      updateOpRecord();
      hintsDivider.style.display = '';
      if (opTimerInterval) clearInterval(opTimerInterval);
      opTimerInterval = setInterval(updateOpRecord, 10000);
      showToast(text);
    }

    function updateOpRecord() {
      if (!lastOpTime) { hintsOpRecord.innerHTML = ''; return; }
      hintsOpRecord.innerHTML =
        '<span class="op-check">✓</span> ' +
        escapeHtml(lastOpText) +
        '<span class="op-time">（' + relativeTime(lastOpTime) + '）</span>';
    }

    function showHoverHint(label, desc) {
      if (!label) { hintsHoverDesc.innerHTML = ''; return; }
      if (lastOpTime || label) hintsDivider.style.display = '';
      hintsHoverDesc.innerHTML =
        '<span class="hover-label">' + escapeHtml(label) + '</span><br>' +
        escapeHtml(desc);
    }

    function hideHoverHint() {
      hintsHoverDesc.innerHTML = '';
    }

    function showToast(text, duration) {
      duration = duration || 2500;
      const el = document.createElement('div');
      el.className = 'toast';
      el.innerHTML = '<span class="toast-check">✓</span> ' + escapeHtml(text);
      toastContainer.appendChild(el);
      requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('show')));
      setTimeout(() => {
        el.classList.remove('show');
        setTimeout(() => el.remove(), 350);
      }, duration);
    }

    // Mobile popover
    let popoverEl = null;
    let longPressTimer = null;

    function showPopover(btn) {
      const title = btn.getAttribute('title');
      if (!title) return;
      if (!popoverEl) {
        popoverEl = document.createElement('div');
        popoverEl.className = 'mobile-popover';
        document.body.appendChild(popoverEl);
      }
      const label = btn.textContent.trim();
      popoverEl.innerHTML = '<span class="pop-label">' + escapeHtml(label) + '</span>' + escapeHtml(title);
      const rect = btn.getBoundingClientRect();
      popoverEl.style.left = Math.max(8, Math.min(rect.left, window.innerWidth - 240)) + 'px';
      popoverEl.style.top = (rect.bottom + 6) + 'px';
      requestAnimationFrame(() => popoverEl.classList.add('show'));
    }

    function hidePopover() {
      if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }
      if (popoverEl) popoverEl.classList.remove('show');
    }

    function initHoverHints() {
      const buttons = document.querySelectorAll('header .btn, header .btn--gold, header .btn--sheets, header .file-label');
      buttons.forEach(btn => {
        const title = btn.getAttribute('title');
        if (!title) return;
        const label = btn.textContent.trim();
        // Desktop hover → HINTS lower section
        btn.addEventListener('mouseenter', () => showHoverHint(label, title));
        btn.addEventListener('mouseleave', hideHoverHint);
        // Mobile long press → popover
        btn.addEventListener('touchstart', (e) => {
          longPressTimer = setTimeout(() => {
            e.preventDefault();
            showPopover(btn);
          }, 500);
        }, { passive: false });
        btn.addEventListener('touchend', hidePopover);
        btn.addEventListener('touchcancel', hidePopover);
        btn.addEventListener('touchmove', hidePopover);
      });
    }

    // ═══════════════════════════════════════════
    //  MARKDOWN TABLE PARSING
    // ═══════════════════════════════════════════
    function splitMarkdownTableRow(row) {
      let line = row.trim();
      if (line.startsWith("|")) line = line.slice(1);
      if (line.endsWith("|")) line = line.slice(0, -1);
      const cells = [];
      let current = "";
      let escaped = false;
      let inBacktick = false;
      for (let i = 0; i < line.length; i++) {
        const ch = line[i];
        if (escaped) { current += ch; escaped = false; continue; }
        if (ch === "\\") { escaped = true; current += ch; continue; }
        if (ch === "`") { inBacktick = !inBacktick; current += ch; continue; }
        if (ch === "|" && !inBacktick) { cells.push(current.trim()); current = ""; continue; }
        current += ch;
      }
      cells.push(current.trim());
      return cells;
    }

    function isTableRow(line) {
      const trimmed = line.trim();
      return trimmed.startsWith("|") && trimmed.endsWith("|") && trimmed.includes("|");
    }

    function isSeparatorRow(row) {
      const cells = splitMarkdownTableRow(row);
      return cells.length > 0 && cells.every(cell => /^:?-{3,}:?$/.test(cell.replace(/\s/g, "")));
    }

    function parseTable(lines, startIndex) {
      const rows = [];
      let i = startIndex;
      while (i < lines.length && isTableRow(lines[i])) { rows.push(lines[i]); i++; }
      if (rows.length < 2 || !isSeparatorRow(rows[1])) return null;
      const head = splitMarkdownTableRow(rows[0]);
      const body = rows.slice(2).map(splitMarkdownTableRow);
      let html = "<table><thead><tr>";
      head.forEach(c => html += `<th>${inlineMarkdownToHtml(c)}</th>`);
      html += "</tr></thead><tbody>";
      body.forEach(row => {
        html += "<tr>";
        row.forEach(c => html += `<td>${inlineMarkdownToHtml(c)}</td>`);
        html += "</tr>";
      });
      html += "</tbody></table>";
      return { html, head, body, nextIndex: i };
    }

    // ═══════════════════════════════════════════
    //  MARKDOWN → HTML
    // ═══════════════════════════════════════════
    function markdownToHtml(md) {
      const lines = md.replace(/\r\n/g, "\n").split("\n");
      let html = "";
      let paragraph = [];
      let listType = null;
      let inCode = false;
      let codeBuffer = [];

      function flushParagraph() {
        if (paragraph.length) {
          html += `<p>${inlineMarkdownToHtml(paragraph.join(" "))}</p>\n`;
          paragraph = [];
        }
      }
      function closeList() {
        if (listType) { html += `</${listType}>\n`; listType = null; }
      }

      for (let i = 0; i < lines.length; i++) {
        const line = lines[i];
        if (/^```/.test(line.trim())) {
          if (!inCode) { flushParagraph(); closeList(); inCode = true; codeBuffer = []; }
          else { html += `<pre><code>${escapeHtml(codeBuffer.join("\n"))}</code></pre>\n`; inCode = false; }
          continue;
        }
        if (inCode) { codeBuffer.push(line); continue; }
        if (line.trim() === "") { flushParagraph(); closeList(); continue; }

        const table = parseTable(lines, i);
        if (table) { flushParagraph(); closeList(); html += table.html + "\n"; i = table.nextIndex - 1; continue; }

        const heading = line.match(/^(#{1,6})\s+(.+)$/);
        if (heading) {
          flushParagraph(); closeList();
          const level = heading[1].length;
          html += `<h${level}>${inlineMarkdownToHtml(heading[2].trim())}</h${level}>\n`;
          continue;
        }

        const unordered = line.match(/^\s*[-*]\s+(.+)$/);
        if (unordered) {
          flushParagraph();
          if (listType !== "ul") { closeList(); html += "<ul>\n"; listType = "ul"; }
          html += `<li>${inlineMarkdownToHtml(unordered[1])}</li>\n`;
          continue;
        }

        const ordered = line.match(/^\s*\d+\.\s+(.+)$/);
        if (ordered) {
          flushParagraph();
          if (listType !== "ol") { closeList(); html += "<ol>\n"; listType = "ol"; }
          html += `<li>${inlineMarkdownToHtml(ordered[1])}</li>\n`;
          continue;
        }

        paragraph.push(line.trim());
      }
      flushParagraph();
      closeList();
      if (inCode) html += `<pre><code>${escapeHtml(codeBuffer.join("\n"))}</code></pre>\n`;
      return html;
    }

    // ═══════════════════════════════════════════
    //  GOOGLE SHEETS EXPORT FUNCTIONS
    // ═══════════════════════════════════════════
    function markdownTablesToRows(md) {
      const lines = md.replace(/\r\n/g, "\n").split("\n");
      const allRows = [];
      let lastHeading = "";

      for (let i = 0; i < lines.length; i++) {
        const line = lines[i].trim();
        const heading = line.match(/^(#{1,6})\s+(.+)$/);
        if (heading) { lastHeading = stripMarkdown(heading[2]); continue; }
        if (!isTableRow(lines[i])) continue;

        const tableLines = [];
        let j = i;
        while (j < lines.length && isTableRow(lines[j])) { tableLines.push(lines[j]); j++; }

        if (tableLines.length >= 2 && isSeparatorRow(tableLines[1])) {
          if (allRows.length > 0) allRows.push([]);
          if (lastHeading) allRows.push([lastHeading]);
          allRows.push(splitMarkdownTableRow(tableLines[0]).map(stripMarkdown));
          tableLines.slice(2).forEach(row => {
            allRows.push(splitMarkdownTableRow(row).map(stripMarkdown));
          });
        }
        i = j - 1;
      }
      return allRows;
    }

    function getMaxTableCols(lines) {
      let max = 1;
      lines.forEach(line => {
        if (isTableRow(line)) max = Math.max(max, splitMarkdownTableRow(line).length);
      });
      return max;
    }

    function markdownToRichSheetHtml(md) {
      const lines = md.replace(/\r\n/g, "\n").split("\n");
      const maxCols = Math.max(6, getMaxTableCols(lines));
      let html = `<table style="border-collapse:collapse;font-family:Arial,'Noto Sans TC','Microsoft JhengHei',sans-serif;font-size:11pt;">`;
      let paragraph = [];

      function emptyCells(count) {
        let s = "";
        for (let i = 0; i < count; i++) s += `<td style="border:1px solid #d7dce2;"></td>`;
        return s;
      }

      function row(cells, options = {}) {
        const bg = options.bg || "#ffffff";
        const color = options.color || "#202124";
        const weight = options.weight || "400";
        const size = options.size || "11pt";
        const border = options.border || "1px solid #d7dce2";
        const type = options.type || "normal";

        html += `<tr style="background:${bg};color:${color};font-weight:${weight};font-size:${size};">`;
        if (type === "heading") {
          html += `<td style="border:${border};padding:8px 10px;font-weight:${weight};font-size:${size};color:${color};background:${bg};">${inlineMarkdownToHtml(cells[0] ?? "")}</td>`;
          html += emptyCells(maxCols - 1);
        } else {
          for (let i = 0; i < maxCols; i++) {
            const value = cells[i] ?? "";
            html += `<td style="border:${border};padding:6px 8px;vertical-align:top;background:${bg};color:${color};font-weight:${weight};font-size:${size};">${inlineMarkdownToHtml(value)}</td>`;
          }
        }
        html += `</tr>`;
      }

      function flushParagraph() {
        if (paragraph.length) {
          row([paragraph.join(" ")], { type: "heading", bg: "#ffffff", weight: "400", size: "11pt" });
          paragraph = [];
        }
      }

      for (let i = 0; i < lines.length; i++) {
        const line = lines[i].trim();
        if (!line) { flushParagraph(); continue; }

        const table = parseTable(lines, i);
        if (table) {
          flushParagraph();
          row(table.head, { bg: "#eef1f8", weight: "700" });
          table.body.forEach(bodyRow => row(bodyRow));
          i = table.nextIndex - 1;
          continue;
        }

        const heading = line.match(/^(#{1,6})\s+(.+)$/);
        if (heading) {
          flushParagraph();
          const level = heading[1].length;
          const text = heading[2].trim();
          if (level === 1) row([text], { type: "heading", bg: "#dfe6ff", weight: "700", size: "16pt" });
          else if (level === 2) row([text], { type: "heading", bg: "#edf1ff", weight: "700", size: "14pt" });
          else if (level === 3) row([text], { type: "heading", bg: "#f4f6fb", weight: "700", size: "12pt" });
          else row([text], { type: "heading", bg: "#ffffff", weight: "700", size: "11pt" });
          continue;
        }

        const unordered = line.match(/^\s*[-*]\s+(.+)$/);
        if (unordered) { flushParagraph(); row(["• " + unordered[1]], { type: "heading" }); continue; }

        const ordered = line.match(/^\s*\d+\.\s+(.+)$/);
        if (ordered) { flushParagraph(); row([stripMarkdown(line)], { type: "heading" }); continue; }

        paragraph.push(line);
      }
      flushParagraph();
      html += `</table>`;
      return html;
    }

    function htmlToPlainTextTable(html) {
      const temp = document.createElement("div");
      temp.innerHTML = html;
      const rows = Array.from(temp.querySelectorAll("tr"));
      return rows.map(tr => Array.from(tr.children).map(td => td.innerText.trim()).join("\t")).join("\n");
    }

    function toTSV(rows) {
      return rows.map(row => row.map(cell => {
        return String(cell ?? "").replace(/\r?\n/g, " ").replace(/\t/g, " ").trim();
      }).join("\t")).join("\n");
    }

    // ═══════════════════════════════════════════
    //  CLIPBOARD HELPERS
    // ═══════════════════════════════════════════
    function copyPlain(text) {
      const temp = document.createElement("textarea");
      temp.value = text;
      temp.style.position = "fixed";
      temp.style.left = "-9999px";
      document.body.appendChild(temp);
      temp.focus();
      temp.select();
      const ok = document.execCommand("copy");
      document.body.removeChild(temp);
      return ok;
    }

    async function copyRichHtml(html) {
      const plain = htmlToPlainTextTable(html);
      if (navigator.clipboard && window.ClipboardItem && window.isSecureContext) {
        const item = new ClipboardItem({
          "text/html": new Blob([html], { type: "text/html" }),
          "text/plain": new Blob([plain], { type: "text/plain" })
        });
        await navigator.clipboard.write([item]);
        return true;
      }
      const container = document.createElement("div");
      container.innerHTML = html;
      container.contentEditable = "true";
      container.style.position = "fixed";
      container.style.left = "-9999px";
      document.body.appendChild(container);
      const range = document.createRange();
      range.selectNodeContents(container);
      const selection = window.getSelection();
      selection.removeAllRanges();
      selection.addRange(range);
      const ok = document.execCommand("copy");
      selection.removeAllRanges();
      document.body.removeChild(container);
      return ok;
    }

    // ═══════════════════════════════════════════
    //  JSON FUNCTIONS
    // ═══════════════════════════════════════════
    function getExtension(filename) {
      const lower = filename.toLowerCase();
      if (lower.endsWith(".blocks.jsonl")) return ".blocks.jsonl";
      if (lower.endsWith(".score.json")) return ".score.json";
      const match = lower.match(/\.[^.]+$/);
      return match ? match[0] : ".txt";
    }

    function detectMode(filename) {
      const ext = getExtension(filename);
      if (ext === ".md" || ext === ".markdown") return "md";
      if (ext === ".docx" || ext === ".doc") return "md";
      if (ext === ".py") return "py";
      if (ext === ".json" || ext === ".score.json") return "json";
      if (ext === ".jsonl" || ext === ".blocks.jsonl") return "jsonl";
      return "txt";
    }

    function isPlainScriptContent(content) {
      const lines = content.trim().split('\n').filter(l => l.trim() && !l.trim().startsWith('//'));
      if (lines.length < 2) return false;
      const dlg = /^[^\s#].{0,20}[：:].+/;
      const cmd = /^#\w+:\s/;
      let hits = 0;
      for (const l of lines.slice(0, 20)) { if (dlg.test(l.trim()) || cmd.test(l.trim())) hits++; }
      return hits / Math.min(lines.length, 20) >= 0.5;
    }

    function parseBlocksJsonl(content) {
      const blocks = [];
      for (const line of content.trim().split('\n')) {
        const tr = line.trim();
        if (!tr) continue;
        try {
          const obj = JSON.parse(tr);
          if (obj.type === 'dialogue' || obj.type === 'narration' || obj.type === 'command') blocks.push(obj);
        } catch {}
      }
      return blocks.length > 0 ? blocks : null;
    }

    function parseJsonWithInfo(text) {
      try {
        return { data: JSON.parse(text), error: null };
      } catch (error) {
        const message = String(error.message || error);
        const posMatch = message.match(/position\s+(\d+)/i);
        let line = null, col = null;
        if (posMatch) {
          const pos = Number(posMatch[1]);
          const before = text.slice(0, pos);
          const parts = before.split(/\r?\n/);
          line = parts.length;
          col = parts[parts.length - 1].length + 1;
        }
        return { data: null, error: { message, line, col } };
      }
    }

    function isScoreJson(data) {
      if (!data || typeof data !== "object") return false;
      const schema = String(data.$schema || "").toLowerCase();
      return schema.includes("tsukisynth score") || (data.meta && data.global && Array.isArray(data.events) && data.export);
    }

    function formatBytes(bytes) {
      if (!bytes && bytes !== 0) return "—";
      if (bytes < 1024) return `${bytes} B`;
      if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
      return `${(bytes / 1024 / 1024).toFixed(2)} MB`;
    }

    // ═══════════════════════════════════════════
    //  CORE — SET FILE & RENDER
    // ═══════════════════════════════════════════
    function setFile(filename, content, size) {
      state.filename = filename || "untitled.txt";
      state.extension = getExtension(state.filename);
      state.content = String(content ?? "");
      state.parsedJson = null;
      state.jsonError = null;
      state.editMode = false;
      state._scriptBlocks = null;
      state.mode = detectMode(state.filename);

      if (state.mode === "json") {
        const parsed = parseJsonWithInfo(state.content);
        state.parsedJson = parsed.data;
        state.jsonError = parsed.error;
      }

      if (state.mode === "jsonl") {
        state._scriptBlocks = parseBlocksJsonl(state.content);
      } else if (state.mode === "txt" && isPlainScriptContent(state.content)) {
        state._isPlainScript = true;
      } else {
        state._isPlainScript = false;
      }

      rawEditor.value = state.content;
      updateAll(size ?? new Blob([state.content]).size);
      localStorage.setItem("akasha-reader-draft", state.content);
      localStorage.setItem("akasha-reader-filename", state.filename);
    }

    function updateAll(size) {
      renderFileInfo(size);
      renderHint();
      renderChecks();
      renderViews();
      renderTabs();
      updateSheetsVisibility();
      updateEditUI();
      updateSummaryButton();
      statusEl.textContent = `已載入：${state.filename}（${state.extension || "文字"}）`;
      if (hasTableContent()) {
        showToast("偵測到表格資料，可送到 Table Forge 操作", 4000);
      }
    }

    function updateSheetsVisibility() {
      sheetsGroup.classList.toggle("visible", state.mode === "md");
      document.getElementById("exportDocx").style.display = state.mode === "md" ? "" : "none";
      const hasScript = !!(state._scriptBlocks || state._isPlainScript);
      document.getElementById("exportScriptDocx").style.display = hasScript ? "" : "none";
      document.getElementById("exportScriptPdf").style.display = hasScript ? "" : "none";
    }

    function updateSummaryButton() {
      const btn = document.getElementById("exportSummary");
      const btnSaveSum = document.getElementById("btnSaveSummaryToLibrary");
      if (state.mode === "txt") {
        btn.disabled = true;
        btn.title = "純文字檔不適用匯出摘要";
        btnSaveSum.style.display = "none";
      } else if (state.content) {
        btn.disabled = false;
        btn.title = "自動幫你整理這個檔案的重點大綱";
        btnSaveSum.style.display = "";
      } else {
        btn.disabled = true;
        btnSaveSum.style.display = "none";
      }
    }

    function renderFileInfo(size) {
      const jsonValid = state.mode === "json" ? (state.jsonError ? "格式錯誤" : "有效") : "—";
      const score = state.parsedJson && isScoreJson(state.parsedJson) ? "是" : "—";
      const text = state.content || "";
      const charCount = text.replace(/[\s\n]/g, "").length;
      const lineCount = text ? text.split("\n").length : 0;
      const readingMin = Math.max(1, Math.round(charCount / 400));
      fileInfo.innerHTML = `
        <div class="key">檔名</div><div>${escapeHtml(state.filename || "尚未開啟")}</div>
        <div class="key">類型</div><div>${escapeHtml(state.extension || "—")}</div>
        <div class="key">大小</div><div>${formatBytes(size ?? state.content.length)}</div>
        <div class="key">字數</div><div>${charCount.toLocaleString()} 字 · ${lineCount} 行 · ≈${readingMin} 分鐘</div>
        <div class="key">JSON</div><div>${jsonValid}</div>
        <div class="key">Score</div><div>${score}</div>
      `;
    }

    function hintForFile() {
      const name = state.filename.toLowerCase();
      if (state.extension === ".py") return {
        title: ".py — Python 程式碼",
        body: `Python 程式碼。左側摘要會自動列出 imports、functions、classes。系統會掃描是否有刪檔、連網等風險操作。本工具只閱讀不執行。`
      };
      if (state.extension === ".score.json") return {
        title: ".score.json — TsukiSynth 樂譜配方",
        body: `TsukiSynth 專用格式，使用「Score 儀表板」查看音色設定、事件編排和渲染參數。也可用「樹狀 JSON」展開結構細節。`
      };
      if (state.extension === ".json") return {
        title: ".json — 結構化資料",
        body: `JSON 資料格式。可用「Pretty JSON」看排版後的版本，或用「樹狀 JSON」展開結構。編輯時會自動檢查格式是否正確。`
      };
      if (state.extension === ".md" || state.extension === ".markdown") return {
        title: ".md — Markdown 文件",
        body: `Markdown 格式，支援標題、粗體、表格等語法。切換「Markdown 預覽」可看到渲染後的效果，「原始碼」可看到原始語法。支援匯出至 Google Sheets。`
      };
      if (state.extension === ".jsonl" || state.extension === ".blocks.jsonl") return {
        title: ".jsonl — 劇本 Blocks",
        body: `JSONL 格式的劇本段落資料。每行一個 block（dialogue / narration / command）。可匯出為劇本 DOCX 或 PDF 預覽。`
      };
      if (state._isPlainScript) return {
        title: ".txt — Plain Script 劇本",
        body: `偵測到「角色：台詞」格式的劇本內容。可直接匯出為劇本 DOCX 或 PDF 預覽，系統會自動解析角色與台詞。`
      };
      return {
        title: ".txt — 純文字",
        body: `簡單筆記、log、暫存文字。直接閱讀即可，「文字閱讀」和「原始碼」顯示的內容會完全一樣，這是正常的！匯出摘要不適用這個格式。`
      };
    }

    function renderHint() {
      const hint = hintForFile();
      fileHint.innerHTML = `<h3>${hint.title}</h3><p>${hint.body}</p>`;
    }

    function hasTableContent() {
      if (!state.content) return false;
      if (state.mode === "md") {
        const lines = state.content.replace(/\r\n/g, "\n").split("\n");
        for (let i = 0; i < lines.length - 1; i++) {
          if (isTableRow(lines[i]) && isSeparatorRow(lines[i + 1])) return true;
        }
        return false;
      }
      if (state.mode === "json" && state.parsedJson && !state.jsonError) {
        const d = state.parsedJson;
        if (Array.isArray(d) && d.length > 0 && typeof d[0] === "object" && d[0] !== null) return true;
      }
      return false;
    }

    function renderChecks() {
      const badges = [];
      if (!state.content) {
        checkPanel.innerHTML = `<span class="badge">尚未載入檔案</span>`;
        return;
      }
      if (state.mode === "json") {
        if (state.jsonError) badges.push(`<span class="badge danger">JSON 格式錯誤</span>`);
        else badges.push(`<span class="badge ok">JSON 格式有效</span>`);
        if (state.parsedJson && isScoreJson(state.parsedJson)) badges.push(`<span class="badge ok">TsukiSynth Score</span>`);
      }
      if (state.mode === "py") {
        const risks = scanPythonRisks(state.content);
        badges.push(`<span class="badge ok">Python 閱讀模式</span>`);
        if (risks.length) risks.forEach(r => badges.push(`<span class="badge warn">${escapeHtml(r.label)}</span>`));
      }
      if (state.mode === "md") {
        badges.push(`<span class="badge ok">Markdown 預覽</span>`, `<span class="badge ok">Sheets 匯出可用</span>`);
        if (state._docxSourceName) badges.push(`<span class="badge ok">DOCX 匯入</span>`);
        badges.push(`<span class="badge ok">DOCX 匯出可用</span>`);
      }
      if (state.mode === "txt" && state._isPlainScript) {
        badges.push(`<span class="badge ok">Plain Script 偵測</span>`);
        badges.push(`<span class="badge ok">劇本 DOCX 匯出可用</span>`);
        badges.push(`<span class="badge ok">劇本 PDF 預覽可用</span>`);
      } else if (state.mode === "txt") {
        badges.push(`<span class="badge">純文字閱讀</span>`);
      }
      if (state.mode === "jsonl" && state._scriptBlocks) {
        badges.push(`<span class="badge ok">blocks.jsonl（${state._scriptBlocks.length} blocks）</span>`);
        badges.push(`<span class="badge ok">劇本 DOCX 匯出可用</span>`);
        badges.push(`<span class="badge ok">劇本 PDF 預覽可用</span>`);
      } else if (state.mode === "jsonl") {
        badges.push(`<span class="badge">JSONL 閱讀</span>`);
      }

      if (hasTableContent()) {
        badges.push(`<span class="badge ok table-detect-badge" style="cursor:pointer" title="點擊送到 Table Forge">⚙ 偵測到表格</span>`);
      }

      checkPanel.innerHTML = `<div class="badge-row">${badges.join("")}</div>`;

      const tableBtn = checkPanel.querySelector(".table-detect-badge");
      if (tableBtn) {
        tableBtn.addEventListener("click", () => {
          document.getElementById("exportToSpreadsheet").click();
        });
      }

      if (state.jsonError) {
        const lineText = state.jsonError.line ? `第 ${state.jsonError.line} 行，第 ${state.jsonError.col} 欄` : "瀏覽器未回傳位置";
        checkPanel.innerHTML += `<div class="error-box" style="margin-top:8px;"><strong>錯誤：</strong>${escapeHtml(state.jsonError.message)}<br>${lineText}</div>`;
      }
    }

    // ═══════════════════════════════════════════
    //  EDIT MODE
    // ═══════════════════════════════════════════
    const EDITABLE_MODES = new Set(["md", "txt", "json"]);

    // --- Diff tracking ---
    let originalContent = "";
    let diffActive = false;

    // --- Edit history ---
    const MAX_HISTORY = 10;
    function getHistoryKey() { return "akasha-history-" + state.filename; }
    function getHistory() {
      try { return JSON.parse(localStorage.getItem(getHistoryKey()) || "[]"); }
      catch { return []; }
    }
    function pushHistory(content, label) {
      const hist = getHistory();
      hist.unshift({ time: Date.now(), label: label || "手動存檔", content });
      if (hist.length > MAX_HISTORY) hist.length = MAX_HISTORY;
      localStorage.setItem(getHistoryKey(), JSON.stringify(hist));
      renderHistory();
    }
    function renderHistory() {
      const panel = document.getElementById("historyPanel");
      const hist = getHistory();
      if (!hist.length) {
        panel.innerHTML = '<div style="font-size:11px;color:var(--text-tertiary);padding:8px 0;">尚無編輯紀錄</div>';
        return;
      }
      panel.innerHTML = hist.map((h, i) => {
        const d = new Date(h.time);
        const ts = `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
        return `<div class="history-item" data-idx="${i}">
          <span class="history-item-label">${escapeHtml(h.label)}</span>
          <span class="history-item-time">${ts}</span>
        </div>`;
      }).join("");
      panel.querySelectorAll(".history-item").forEach(el => {
        el.addEventListener("click", () => {
          const idx = parseInt(el.dataset.idx);
          const h = hist[idx];
          if (h && confirm("載入此版本？目前未存的編輯會遺失。")) {
            setFile(state.filename, h.content);
            statusEl.textContent = "已還原版本：" + new Date(h.time).toLocaleString();
          }
        });
      });
    }

    function confirmDiscardEdits() {
      if (!state.editMode || !state.dirty) return true;
      return confirm("編輯中的變更尚未儲存，確定要捨棄嗎？");
    }

    window.addEventListener("beforeunload", (e) => {
      if (state.editMode && state.dirty) {
        e.preventDefault();
        e.returnValue = "";
      }
    });

    function updateEditUI() {
      const btnToggle = document.getElementById("btnEditToggle");
      const btnDownload = document.getElementById("btnDownloadEdited");
      const btnSave = document.getElementById("btnSaveToLibrary");
      const editGroup = document.getElementById("editGroup");
      const editError = document.getElementById("editError");
      const canEdit = state.content && EDITABLE_MODES.has(state.mode);
      btnToggle.style.display = canEdit ? "" : "none";
      if (state.editMode) {
        btnToggle.textContent = "閱讀模式";
        btnToggle.className = "btn btn--gold";
        btnDownload.style.display = "";
        btnSave.style.display = "";
        editGroup.classList.add("visible");
      } else {
        btnToggle.textContent = "編輯模式";
        btnToggle.className = "btn";
        btnDownload.style.display = "none";
        btnSave.style.display = "none";
        editGroup.classList.remove("visible");
        editError.style.display = "none";
        editError.textContent = "";
        hideDiff();
      }
      renderHistory();
    }

    function toggleEditMode() {
      if (state.editMode) {
        if (!confirmDiscardEdits()) return;
        state.dirty = false;
        state.content = rawEditor.value;
        state.editMode = false;
        setFile(state.filename, state.content);
      } else {
        originalContent = state.content;
        state.editMode = true;
        state.dirty = false;
        rawEditor.value = state.content;
        state.activeTab = "raw";
        updateEditUI();
        renderTabs();
      }
    }

    function downloadEdited() {
      const content = rawEditor.value;
      const editError = document.getElementById("editError");
      if (state.mode === "json") {
        try {
          JSON.parse(content);
        } catch (e) {
          editError.textContent = "JSON 格式錯誤：" + e.message;
          editError.style.display = "";
          return;
        }
      }
      editError.style.display = "none";
      editError.textContent = "";
      download(state.filename || "edited.txt", content);
      pushHistory(content, "下載新檔");
      state.dirty = false;
      statusEl.textContent = "已下載新檔：" + state.filename;
      recordOperation("已下載新檔：" + state.filename);
    }

    // --- Save to library ---
    async function saveEditedToLibrary() {
      const content = rawEditor.value;
      const editError = document.getElementById("editError");
      if (state.mode === "json") {
        try { JSON.parse(content); }
        catch (e) {
          editError.textContent = "JSON 格式錯誤：" + e.message;
          editError.style.display = "";
          return;
        }
      }
      editError.style.display = "none";
      try {
        const { saveFileEntry, saveFileBlob } = await import("../../core/storage.js");
        const blob = new Blob([content], { type: "text/plain;charset=utf-8" });
        const entry = await saveFileEntry({
          name: state.filename,
          type: state.extension.replace(".", ""),
          size: blob.size,
        });
        await saveFileBlob(entry.id, blob);
        pushHistory(content, "存入書庫");
        state.dirty = false;
        state.content = content;
        statusEl.textContent = "已存入書庫：" + state.filename;
        recordOperation("已存入書庫：" + state.filename);
        if (window.parent !== window) {
          window.parent.postMessage({ type: "akasha-file-opened", entry }, location.origin);
        }
      } catch (e) {
        statusEl.textContent = "儲存失敗：" + e.message;
      }
    }

    // --- Save summary to library ---
    async function saveSummaryToLibrary() {
      if (state.mode === "txt") return;
      const summary = makeSummary();
      const baseName = (state.filename || "summary").replace(/\.[^.]+$/g, "");
      const summaryName = baseName + "_summary.md";
      try {
        const { saveFileEntry, saveFileBlob } = await import("../../core/storage.js");
        const blob = new Blob([summary], { type: "text/markdown;charset=utf-8" });
        const entry = await saveFileEntry({
          name: summaryName,
          type: "md",
          size: blob.size,
        });
        await saveFileBlob(entry.id, blob);
        statusEl.textContent = "摘要已存入書庫：" + summaryName;
        recordOperation("摘要已存入書庫");
        if (window.parent !== window) {
          window.parent.postMessage({ type: "akasha-file-opened", entry }, location.origin);
        }
      } catch (e) {
        statusEl.textContent = "儲存失敗：" + e.message;
      }
    }

    // --- Diff ---
    function showDiff() {
      if (!originalContent) return;
      diffActive = true;
      document.getElementById("btnShowDiff").style.display = "none";
      document.getElementById("btnClearDiff").style.display = "";

      const oldLines = originalContent.split("\n");
      const newLines = rawEditor.value.split("\n");
      let changed = 0;
      const maxLen = Math.max(oldLines.length, newLines.length);
      const diffHtml = [];

      for (let i = 0; i < maxLen; i++) {
        const oldL = oldLines[i];
        const newL = newLines[i];
        if (oldL === undefined) {
          diffHtml.push(`<div class="diff-line-added">+ ${escapeHtml(newL)}</div>`);
          changed++;
        } else if (newL === undefined) {
          diffHtml.push(`<div class="diff-line-removed">- ${escapeHtml(oldL)}</div>`);
          changed++;
        } else if (oldL !== newL) {
          diffHtml.push(`<div class="diff-line-removed">- ${escapeHtml(oldL)}</div>`);
          diffHtml.push(`<div class="diff-line-added">+ ${escapeHtml(newL)}</div>`);
          changed++;
        } else {
          diffHtml.push(`<div>${escapeHtml(newL)}</div>`);
        }
      }

      views.pretty.innerHTML = `<div style="margin-bottom:10px;font-size:12px;color:var(--text-secondary);">
        變更行數：<span class="diff-count">${changed}</span> / ${maxLen}
      </div><pre class="code-block" style="white-space:pre-wrap;">${diffHtml.join("\n")}</pre>`;
      state.activeTab = "pretty";
      showActiveView();
      renderTabs();
      statusEl.textContent = `變更標示：${changed} 行有差異`;
      recordOperation(`變更標示：${changed} 行有差異`);
    }

    function hideDiff() {
      diffActive = false;
      document.getElementById("btnShowDiff").style.display = "";
      document.getElementById("btnClearDiff").style.display = "none";
    }

    // --- Undo / Redo ---
    function editorUndo() {
      rawEditor.focus();
      document.execCommand("undo");
    }
    function editorRedo() {
      rawEditor.focus();
      document.execCommand("redo");
    }

    function renderTabs() {
      const tabs = [];
      if (!state.content) tabs.push(["empty", "開始"]);

      if (state.editMode) {
        tabs.push(["raw", "編輯中"]);
      } else {
        if (state.mode === "md") tabs.push(["pretty", "Markdown 預覽"]);
        if (state.mode === "json" && !state.jsonError) tabs.push(["pretty", "Pretty JSON"], ["tree", "樹狀 JSON"]);
        if (state.mode === "json" && state.parsedJson && isScoreJson(state.parsedJson)) tabs.push(["score", "Score View"]);
        if (state.mode === "py") tabs.push(["python", "Python View"]);
        if (state.mode === "txt") tabs.push(["pretty", "文字閱讀"]);
        tabs.push(["raw", "原始碼"]);
      }

      if (!tabs.some(t => t[0] === state.activeTab)) state.activeTab = tabs[0][0];
      tabsEl.innerHTML = tabs.map(([id, label]) => `<button class="tab ${id === state.activeTab ? "active" : ""}" data-tab="${id}">${label}</button>`).join("");
      tabsEl.querySelectorAll(".tab").forEach(btn => btn.addEventListener("click", () => {
        state.activeTab = btn.dataset.tab;
        showActiveView();
        renderTabs();
      }));
      showActiveView();
    }

    function showActiveView() {
      Object.values(views).forEach(v => v.classList.remove("active"));
      (views[state.activeTab] || views.empty).classList.add("active");
    }

    function highlightSearchHtml(html) {
      const term = state.searchTerm.trim();
      if (!term) return html;
      const escaped = term.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      const re = new RegExp(`(${escaped})`, "gi");
      return html.replace(/(<[^>]*>)|([^<]+)/g, function(match, tag, text) {
        if (tag) return tag;
        return text.replace(re, '<span class="search-hit">$1</span>');
      });
    }

    function renderViews() {
      if (!state.content) return;
      rawEditor.value = state.content;

      if (state.mode === "md") {
        views.pretty.innerHTML = `<article class="markdown-body">${highlightSearchHtml(markdownToHtml(state.content))}</article>`;
      }

      if (state.mode === "txt") {
        views.pretty.innerHTML = `<pre class="code-block">${highlightSearchHtml(escapeHtml(state.content))}</pre>`;
      }

      if (state.mode === "json") {
        if (state.jsonError) {
          views.pretty.innerHTML = `<div class="error-box"><strong>JSON 讀取失敗</strong><br>${escapeHtml(state.jsonError.message)}</div><pre class="code-block">${highlightSearchHtml(escapeHtml(state.content))}</pre>`;
        } else {
          const pretty = JSON.stringify(state.parsedJson, null, 2);
          views.pretty.innerHTML = `<pre class="code-block">${highlightSearchHtml(syntaxJson(pretty))}</pre>`;
          views.tree.innerHTML = `<div class="json-tree">${renderJsonTree(state.parsedJson, "root")}</div>`;
          attachTreeToggles();
          if (isScoreJson(state.parsedJson)) views.score.innerHTML = renderScoreView(state.parsedJson);
        }
      }

      if (state.mode === "py") {
        views.python.innerHTML = renderPythonView(state.content);
      }
    }

    // ═══════════════════════════════════════════
    //  JSON RENDERING
    // ═══════════════════════════════════════════
    function syntaxJson(json) {
      let s = escapeHtml(json);
      s = s.replace(/(&quot;[^&]*?&quot;)(\s*:)/g, '<span class="tree-key">$1</span>$2');
      s = s.replace(/:\s*(&quot;.*?&quot;)/g, ': <span class="tree-string">$1</span>');
      s = s.replace(/:\s*(-?\d+(?:\.\d+)?(?:e[+-]?\d+)?)/gi, ': <span class="tree-number">$1</span>');
      s = s.replace(/:\s*(true|false)/gi, ': <span class="tree-bool">$1</span>');
      s = s.replace(/:\s*(null)/gi, ': <span class="tree-null">$1</span>');
      return highlightSearchHtml(s);
    }

    function renderJsonTree(value, key) {
      const type = Array.isArray(value) ? "array" : value === null ? "null" : typeof value;
      if (type !== "object" && type !== "array") {
        return `<div class="tree-line"><span class="tree-key">${escapeHtml(key)}</span>: ${renderPrimitive(value)}</div>`;
      }
      const entries = type === "array" ? value.map((v, i) => [i, v]) : Object.entries(value);
      const id = `node_${Math.random().toString(36).slice(2)}`;
      const open = key === "root" ? "" : "tree-hidden";
      const label = type === "array" ? `[${entries.length}]` : `{${entries.length}}`;
      let html = `<div class="tree-line"><span class="tree-toggle" data-target="${id}">${key === "root" ? "▾" : "▸"}</span><span class="tree-key">${escapeHtml(key)}</span> ${label}</div>`;
      html += `<div class="tree-node ${open}" id="${id}">`;
      entries.forEach(([k, v]) => { html += renderJsonTree(v, k); });
      html += `</div>`;
      return html;
    }

    function renderPrimitive(value) {

    // ═══════════════════════════════════════════
    //  PYTHON VIEW
    // ═══════════════════════════════════════════
    function scanPython(content) {
      const lines = content.replace(/\r\n/g, "\n").split("\n");
      const imports = [], functions = [], classes = [];
      let hasMain = false;
      lines.forEach((line, index) => {
        const lineNo = index + 1;
        const im = line.match(/^\s*(?:import\s+(.+)|from\s+([\w.]+)\s+import\s+(.+))/);
        if (im) imports.push({ line: lineNo, text: line.trim() });
        const fn = line.match(/^\s*def\s+([\w_]+)\s*\(/);
        if (fn) functions.push({ line: lineNo, name: fn[1] });
        const cl = line.match(/^\s*class\s+([\w_]+)/);
        if (cl) classes.push({ line: lineNo, name: cl[1] });
        if (line.includes('if __name__ == "__main__"') || line.includes("if __name__ == '__main__'")) hasMain = true;
      });
      return { imports, functions, classes, hasMain };
    }

    function scanPythonRisks(content) {
      const checks = [
        { re: /os\.remove|os\.unlink|shutil\.rmtree/g, label: "可能刪除檔案" },
        { re: /open\s*\([^\n]*["']w["']|open\s*\([^\n]*["']a["']/g, label: "可能寫入檔案" },
        { re: /requests\.|httpx\.|urllib\./g, label: "可能連網" },
        { re: /subprocess\.|os\.system/g, label: "可能執行系統指令" },
        { re: /API_KEY|\.env|os\.environ|getenv/g, label: "可能讀取金鑰" }
      ];
      return checks.filter(c => c.re.test(content));
    }

    function highlightPythonLine(line) {
      let s = escapeHtml(line);
      s = s.replace(/(#.*)$/g, '<span class="tok-comment">$1</span>');
      s = s.replace(/(&quot;.*?&quot;|&#039;.*?&#039;)/g, '<span class="tok-string">$1</span>');
      s = s.replace(/\b(def|class|import|from|as|if|elif|else|for|while|return|try|except|finally|with|lambda|yield|in|is|not|and|or|True|False|None)\b/g, '<span class="tok-keyword">$1</span>');
      s = s.replace(/\b(\d+(?:\.\d+)?)\b/g, '<span class="tok-number">$1</span>');
      s = s.replace(/\b([a-zA-Z_]\w*)(?=\s*\()/g, '<span class="tok-func">$1</span>');
      return s;
    }

    function renderPythonView(content) {
      const info = scanPython(content);
      const risks = scanPythonRisks(content);
      const imports = info.imports.length ? info.imports.map(x => `<li><code>${escapeHtml(x.text)}</code> <span class="badge">L${x.line}</span></li>`).join("") : "<li>無 import</li>";
      const functions = info.functions.length ? info.functions.map(x => `<li><code>${escapeHtml(x.name)}()</code> <span class="badge">L${x.line}</span></li>`).join("") : "<li>無 function</li>";
      const classes = info.classes.length ? info.classes.map(x => `<li><code>${escapeHtml(x.name)}</code> <span class="badge">L${x.line}</span></li>`).join("") : "<li>無 class</li>";
      const riskHtml = risks.length ? risks.map(r => `<span class="badge warn">${escapeHtml(r.label)}</span>`).join("") : `<span class="badge ok">未偵測到風險關鍵字</span>`;

      const lines = content.replace(/\r\n/g, "\n").split("\n");
      let table = `<table class="code-table"><tbody>`;
      lines.forEach((line, i) => {
        table += `<tr><td class="line-no">${i + 1}</td><td class="line-code">${highlightSearchHtml(highlightPythonLine(line))}</td></tr>`;
      });
      table += `</tbody></table>`;

      return `<div class="py-layout">
        <aside class="outline-box">
          <h2>Python 摘要</h2>
          <div class="outline-list">
            <strong>Imports</strong><ul>${imports}</ul>
            <strong>Functions</strong><ul>${functions}</ul>
            <strong>Classes</strong><ul>${classes}</ul>
            <strong>Main guard</strong><div style="margin:6px 0;">${info.hasMain ? '<span class="badge ok">if __name__ == "__main__"</span>' : '<span class="badge">未偵測到</span>'}</div>
            <strong>安全提醒</strong><div class="badge-row">${riskHtml}</div>
          </div>
        </aside>
        <section>${table}</section>
      </div>`;
    }

      const blob = new Blob([text], { type: `${type};charset=utf-8` });

    fileInput.addEventListener("change", event => {
      const file = event.target.files[0];
      if (!file) return;
      if (!confirmDiscardEdits()) { fileInput.value = ""; return; }
      const ext = getExtension(file.name);
      const isDocx = ext === '.docx' || ext === '.doc';

      if (isDocx) {
        // DOCX: read as ArrayBuffer → convert to Markdown via document-bridge
        const reader = new FileReader();
        reader.onload = async () => {
          try {
            statusEl.textContent = '正在轉換 DOCX…';
            const { importDocx, extractDocText } = await import('../../core/document-bridge.js');
            let markdown, outName;
            if (ext === '.docx') {
              const result = await importDocx(reader.result, file.name);
              markdown = result.markdown;
              outName = result.outName;
              if (result.warnings.length > 0) {
                console.warn('DOCX import warnings:', result.warnings);
              }
            } else {
              // Legacy .doc — rough text extraction only
              markdown = extractDocText(reader.result);
              outName = file.name.replace(/\.doc$/i, '.md');
            }
            setFile(outName, markdown, file.size);
            state._docxSourceName = file.name;
            statusEl.textContent = `已匯入：${file.name} → ${outName}`;
          } catch (e) {
            console.error('DOCX import failed:', e);
            statusEl.textContent = `DOCX 匯入失敗：${e.message}`;
          }
          // Persist to library
          try {
            const { saveFileEntry, saveFileBlob } = await import('../../core/storage.js');
            const entry = await saveFileEntry({ name: file.name, type: ext.slice(1), size: file.size, sourceFile: file.name });
            await saveFileBlob(entry.id, new Blob([reader.result]));
            if (window.parent !== window) {
              window.parent.postMessage({ type: 'akasha-file-opened', entry }, location.origin);
            }
          } catch (e) {
            console.warn('Failed to persist file to library:', e);
          }
        };
        reader.readAsArrayBuffer(file);
      } else {
        // Text-based files: auto-detect encoding (fixes Big5/Shift-JIS garbled text)
        (async () => {
          try {
            const { decodeFile } = await import('../../core/text-decode.js');
            const text = await decodeFile(file);
            setFile(file.name, text, file.size);
            try {
              const { saveFileEntry, saveFileBlob } = await import('../../core/storage.js');
              const fileExt = (getExtension(file.name) || '.txt').replace(/^\./, '');
              const entry = await saveFileEntry({ name: file.name, type: fileExt, size: file.size });
              await saveFileBlob(entry.id, new Blob([text], { type: file.type || 'text/plain' }));
              if (window.parent !== window) {
                window.parent.postMessage({ type: 'akasha-file-opened', entry }, location.origin);
              }
            } catch (e) {
              console.warn('Failed to persist file to library:', e);
            }
          } catch (e) {
            console.warn('File read failed:', e);
          }
        })();
      }
    });

          try {
            statusEl.textContent = '正在轉換 DOCX…';
            const { importDocx, extractDocText } = await import('../../core/document-bridge.js');
            let markdown, outName;
            if (ext === '.docx') {
              const result = await importDocx(reader.result, file.name);
              markdown = result.markdown;
              outName = result.outName;
            } else {
              markdown = extractDocText(reader.result);
              outName = file.name.replace(/\.doc$/i, '.md');
            }
            setFile(outName, markdown, file.size);
            state._docxSourceName = file.name;
            statusEl.textContent = `已匯入：${file.name} → ${outName}`;
          } catch (e) {
            console.error('DOCX import failed:', e);
            statusEl.textContent = `DOCX 匯入失敗：${e.message}`;
          }
        };
        reader.readAsArrayBuffer(file);
      } else {
        (async () => {
          try {
            const { decodeFile } = await import('../../core/text-decode.js');
            const text = await decodeFile(file);
            setFile(file.name, text, file.size);
          } catch (e) {
            console.warn('File read failed:', e);
          }
        })();
      }
    });

    // --- PostMessage API for parent shell ---
    window.addEventListener("message", async (event) => {
      if (event.origin !== location.origin) return;
      if (event.data?.type === "akasha-open-file") {
        if (!confirmDiscardEdits()) return;
        const fname = event.data.filename || "file.md";
        const ext = getExtension(fname);
        // Handle DOCX/DOC ArrayBuffer from parent shell
        if ((ext === '.docx' || ext === '.doc') && event.data.content instanceof ArrayBuffer) {
          try {
            statusEl.textContent = '正在轉換 DOCX…';
            const { importDocx, extractDocText } = await import('../../core/document-bridge.js');
            let markdown, outName;
            if (ext === '.docx') {
              const result = await importDocx(event.data.content, fname);
              markdown = result.markdown;
              outName = result.outName;
            } else {
              markdown = extractDocText(event.data.content);
              outName = fname.replace(/\.doc$/i, '.md');
            }
            setFile(outName, markdown, event.data.size);
            state._docxSourceName = fname;
            statusEl.textContent = `已匯入：${fname} → ${outName}`;
          } catch (e) {
            console.error('DOCX import failed:', e);
            statusEl.textContent = `DOCX 匯入失敗：${e.message}`;
          }
          return;
        }
        setFile(fname, event.data.content, event.data.size);
        // S1-10A: Respect readOnly flag from copyright-protected items
        if (event.data.readOnly) {
          rawEditor.readOnly = true;
          rawEditor.style.opacity = '0.7';
          rawEditor.style.cursor = 'default';
          // Hide edit/save/export buttons
          document.getElementById("btnEditToggle").style.display = "none";
          document.getElementById("btnDownloadEdited").style.display = "none";
          document.getElementById("btnSaveToLibrary").style.display = "none";
          document.getElementById("exportDocx").style.display = "none";
          document.getElementById("exportScriptDocx").style.display = "none";
          document.getElementById("exportScriptPdf").style.display = "none";
          document.getElementById("exportSummary").style.display = "none";
          document.getElementById("btnSaveSummaryToLibrary").style.display = "none";
          document.getElementById("downloadText").style.display = "none";
          document.getElementById("copyRaw").style.display = "none";
          document.getElementById("copyView").style.display = "none";
          statusEl.textContent = "唯讀模式：此為受保護的館藏摘錄";
        }
      }
      // AI context request from App Shell
      if (event.data?.type === "akasha-ai-get-context") {
        const content = state.content || "";
        const truncated = content.length > 12000 ? content.slice(0, 12000) + "\n…（內容已截斷）" : content;
        window.parent.postMessage({
          type: "akasha-ai-context-response",
          module: "markdown",
          fileName: state.filename || null,
          fileType: state.extension || "text",
          content: truncated,
        }, location.origin);
      }
    });

    // --- Dark/Light mode inheritance ---
    function syncMode() {
      const parentMode = window.parent?.document?.documentElement?.getAttribute("data-mode");
      if (parentMode) document.documentElement.setAttribute("data-mode", parentMode);
    }
    syncMode();
    window.addEventListener("message", (e) => {
      if (e.origin !== location.origin) return;
      if (e.data?.type === "akasha-mode-change") {
        document.documentElement.setAttribute("data-mode", e.data.mode);
      }
    });

    // --- Restore draft ---
    const saved = localStorage.getItem("akasha-reader-draft");
    const savedName = localStorage.getItem("akasha-reader-filename");
    if (saved) setFile(savedName || "draft.txt", saved);
    else {
      renderFileInfo(0);
      renderHint();
      renderChecks();
      renderTabs();
      updateSheetsVisibility();
    }

    // HINTS 聯動 — init hover listeners
    initHoverHints();
  </script>
</body>
</html>
