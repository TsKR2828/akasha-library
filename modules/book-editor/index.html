<!DOCTYPE html>
<html lang="zh-TW" data-mode="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>童話書編輯器</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#1a1510;--panel:#111;--panel2:#1c1c1c;--border:#333;
  --gold:#c9a84c;--gold2:#e8c97a;--paper:#f5f0e8;--ink:#1a1208;
  --muted:#888;--accent:#5b3fa0;
}
body{background:var(--bg);color:#ddd;font-family:'Georgia',serif;height:100vh;overflow:hidden;display:flex;flex-direction:column}

/* ── TOP BAR ── */
.topbar{height:48px;background:var(--panel);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 16px;gap:12px;flex-shrink:0;z-index:100}
.topbar-title{color:var(--gold);font-size:14px;letter-spacing:.15em;flex:1}
.tb-btn{background:none;border:.5px solid var(--border);border-radius:6px;padding:6px 14px;color:#ccc;font-size:12px;cursor:pointer;font-family:inherit;transition:all .15s}
.tb-btn:hover{border-color:var(--gold);color:var(--gold)}
.tb-btn.primary{border-color:var(--gold);background:rgba(201,168,76,.12);color:var(--gold2)}
.tb-btn.primary:hover{background:rgba(201,168,76,.22)}
.sep{width:1px;height:24px;background:var(--border)}

/* ── MAIN LAYOUT ── */
.main{flex:1;display:flex;overflow:hidden}

/* ── LEFT PANEL ── */
.left-panel{width:300px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.panel-tabs{display:flex;border-bottom:1px solid var(--border)}
.ptab{flex:1;padding:10px;text-align:center;font-size:11px;letter-spacing:.1em;cursor:pointer;color:var(--muted);transition:all .15s;border:none;background:none;font-family:inherit}
.ptab.active{color:var(--gold);border-bottom:2px solid var(--gold)}
.panel-body{flex:1;overflow-y:auto;padding:12px}

/* Page list */
.page-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:6px;cursor:pointer;margin-bottom:4px;border:.5px solid transparent;transition:all .15s}
.page-item:hover{background:rgba(255,255,255,.04)}
.page-item.active{background:rgba(201,168,76,.1);border-color:rgba(201,168,76,.3)}
.page-num-badge{width:26px;height:26px;border-radius:4px;background:var(--panel2);display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--muted);flex-shrink:0}
.page-item.active .page-num-badge{background:rgba(201,168,76,.2);color:var(--gold)}
.page-info{flex:1;min-width:0}
.page-info-title{font-size:12px;color:#ccc;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.page-info-sub{font-size:10px;color:var(--muted);margin-top:2px}
.page-del{background:none;border:none;color:var(--muted);cursor:pointer;padding:2px 4px;font-size:14px;opacity:0;transition:opacity .15s}
.page-item:hover .page-del{opacity:1}
.page-del:hover{color:#e05}

.add-page-btn{width:100%;padding:10px;border:.5px dashed var(--border);border-radius:6px;background:none;color:var(--muted);font-size:12px;cursor:pointer;font-family:inherit;transition:all .15s;margin-top:8px}
.add-page-btn:hover{border-color:var(--gold);color:var(--gold)}

/* Edit form */
.field{margin-bottom:14px}
.field label{display:block;font-size:10px;letter-spacing:.15em;color:var(--muted);text-transform:uppercase;margin-bottom:6px}
.field input,.field textarea,.field select{width:100%;background:var(--panel2);border:.5px solid var(--border);border-radius:6px;padding:8px 10px;color:#ddd;font-size:12px;font-family:inherit;outline:none;transition:border .15s;resize:vertical}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--gold)}
.field textarea{min-height:90px;line-height:1.7}
.field select option{background:#222}
.img-upload-area{border:.5px dashed var(--border);border-radius:6px;padding:16px;text-align:center;cursor:pointer;transition:all .15s;position:relative}
.img-upload-area:hover{border-color:var(--gold);background:rgba(201,168,76,.04)}
.img-upload-area input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer}
.img-upload-area .upload-hint{font-size:11px;color:var(--muted)}
.img-thumb{width:100%;height:80px;object-fit:cover;border-radius:4px;margin-top:8px;display:none}
.img-clear{background:none;border:.5px solid #444;border-radius:4px;padding:3px 10px;color:var(--muted);font-size:11px;cursor:pointer;margin-top:6px;display:none}

/* Layout picker */
.layout-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.layout-opt{border:.5px solid var(--border);border-radius:6px;padding:10px 8px;text-align:center;cursor:pointer;transition:all .15s;font-size:11px;color:var(--muted)}
.layout-opt:hover{border-color:var(--gold);color:#ccc}
.layout-opt.selected{border-color:var(--gold);background:rgba(201,168,76,.1);color:var(--gold2)}
.layout-icon{font-size:18px;display:block;margin-bottom:4px}

/* ── CENTER — BOOK PREVIEW ── */
.center{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;background:radial-gradient(ellipse at center,#2a1f0e 0%,#0d0a05 100%)}

/* Book shadow bg */
.book-shadow{
  position:absolute;
  width:860px;height:560px;
  background:rgba(0,0,0,.5);
  border-radius:8px;
  filter:blur(24px);
  transform:translateY(20px);
}
.book-wrap{
  width:840px;height:544px;
  display:flex;
  position:relative;
  border-radius:6px;
  overflow:hidden;
  box-shadow:0 8px 48px rgba(0,0,0,.7),0 2px 8px rgba(0,0,0,.5);
}

/* Pages */
.book-left,.book-right{width:50%;height:100%;position:relative;overflow:hidden}
.book-left{border-right:none}
.book-spine{width:20px;background:linear-gradient(to right,#1a1208,#3a2a14 40%,#1a1208);flex-shrink:0;position:relative;z-index:10;box-shadow:2px 0 8px rgba(0,0,0,.4),-2px 0 8px rgba(0,0,0,.4)}
.book-spine::after{content:attr(data-title);position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) rotate(90deg);font-size:8px;letter-spacing:.3em;color:var(--gold);white-space:nowrap;opacity:.7}

.page-face{
  width:100%;height:100%;
  background:var(--paper);
  display:flex;flex-direction:column;
  position:relative;overflow:hidden;
}
/* Paper texture lines */
.page-face::before{
  content:'';position:absolute;inset:0;
  background:repeating-linear-gradient(0deg,transparent,transparent 31px,rgba(0,0,0,.03) 31px,rgba(0,0,0,.03) 32px);
  pointer-events:none;z-index:0;
}
/* Ex Libris frame */
.page-face::after{
  content:'';position:absolute;inset:10px;
  border:1px solid #2a2010;border-radius:1px;
  box-shadow:inset 0 0 0 3px var(--paper),inset 0 0 0 4px #2a2010;
  pointer-events:none;z-index:1;
}
.page-content{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;padding:28px 26px 24px}

/* Image slots */
.img-slot{width:100%;object-fit:cover;border-radius:2px;flex-shrink:0}
.img-slot.half{height:42%}
.img-slot.full{height:72%}
.img-placeholder{display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.06);border:1px dashed rgba(0,0,0,.15);border-radius:2px;color:rgba(0,0,0,.25);font-size:11px;flex-shrink:0}
.img-placeholder.half{height:42%}
.img-placeholder.full{height:72%}

.page-chapter{font-size:9px;letter-spacing:.3em;color:#8a6840;text-transform:uppercase;margin-bottom:4px;flex-shrink:0}
.page-title-text{font-size:17px;color:var(--ink);letter-spacing:.06em;margin-bottom:8px;line-height:1.3;flex-shrink:0}
.page-body{font-size:11px;color:#2a1e0a;line-height:1.85;flex:1;overflow:hidden;text-align:justify}
.page-num-display{position:absolute;bottom:16px;font-size:9px;color:#8a6840;letter-spacing:.2em;z-index:3}
.page-num-display.left{left:22px}
.page-num-display.right{right:22px}

/* Cover page */
.cover-page{background:#1a1208;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:20px}
.cover-page::after{border-color:var(--gold);box-shadow:inset 0 0 0 3px #1a1208,inset 0 0 0 4px var(--gold),inset 0 0 0 8px #1a1208,inset 0 0 0 9px var(--gold)}
.cover-img{width:60%;max-height:45%;object-fit:contain;position:relative;z-index:2}
.cover-title-text{font-size:22px;color:var(--paper);letter-spacing:.1em;text-align:center;position:relative;z-index:2;line-height:1.4}
.cover-subtitle{font-size:10px;letter-spacing:.3em;color:var(--gold);text-transform:uppercase;position:relative;z-index:2}
.cover-author-text{font-size:9px;color:#8a6840;letter-spacing:.2em;position:relative;z-index:2;margin-top:8px}

/* Empty page hint */
.empty-hint{display:flex;align-items:center;justify-content:center;height:100%;color:rgba(0,0,0,.2);font-size:12px;font-style:italic}

/* Nav */
.book-nav{position:absolute;bottom:20px;display:flex;align-items:center;gap:24px;left:50%;transform:translateX(-50%);z-index:20}
.bnav-btn{background:rgba(0,0,0,.5);border:.5px solid rgba(201,168,76,.3);border-radius:20px;padding:7px 20px;color:var(--gold);font-size:11px;letter-spacing:.15em;cursor:pointer;font-family:inherit;transition:all .2s}
.bnav-btn:hover{background:rgba(201,168,76,.15);border-color:var(--gold)}
.bnav-btn:disabled{opacity:.25;cursor:default}
.bnav-ind{font-size:10px;color:rgba(201,168,76,.6);letter-spacing:.2em;min-width:80px;text-align:center}

/* Roman numerals util */
</style>
</head>
<body>

<!-- TOP BAR -->
<div class="topbar">
  <div class="topbar-title">✦ 童話書編輯器</div>
  <button class="tb-btn" onclick="addPage('text')">＋ 新增頁面</button>
  <button class="tb-btn" onclick="addPage('cover')">＋ 封面頁</button>
  <div class="sep"></div>
  <button class="tb-btn" onclick="saveProject()">💾 存檔 .book</button>
  <button class="tb-btn" onclick="loadProjectFile()">📂 載入存檔</button>
  <input type="file" id="load-input" accept=".book,.json" style="display:none" onchange="loadProject(event)"/>
  <div class="sep"></div>
  <button class="tb-btn primary" onclick="downloadHTML()">↓ 下載 HTML</button>
  <button class="tb-btn primary" id="pdf-btn" onclick="exportPDF()">↓ 輸出 PDF</button>
  <button class="tb-btn primary" onclick="openFullscreen()">⛶ 全螢幕</button>
</div>

<!-- MAIN -->
<div class="main">

  <!-- LEFT PANEL -->
  <div class="left-panel">
    <div class="panel-tabs">
      <button class="ptab active" id="tab-pages" onclick="switchTab('pages')">頁面列表</button>
      <button class="ptab" id="tab-edit" onclick="switchTab('edit')">編輯內容</button>
    </div>
    <div class="panel-body" id="panel-pages">
      <div id="page-list"></div>
      <button class="add-page-btn" onclick="addPage('text')">＋ 新增文字頁</button>
      <button class="add-page-btn" style="margin-top:4px" onclick="addPage('cover')">＋ 新增封面頁</button>
    </div>
    <div class="panel-body" id="panel-edit" style="display:none">
      <div id="edit-form"></div>
    </div>
  </div>

  <!-- CENTER BOOK -->
  <div class="center">
    <div class="book-shadow"></div>
    <div class="book-wrap" id="book-wrap">
      <div class="book-left" id="book-left">
        <div class="page-face"><div class="page-content"><div class="empty-hint">← 左頁</div></div></div>
      </div>
      <div class="book-spine" data-title="童話書"></div>
      <div class="book-right" id="book-right">
        <div class="page-face"><div class="page-content"><div class="empty-hint">右頁 →</div></div></div>
      </div>
    </div>
    <div class="book-nav">
      <button class="bnav-btn" id="btn-prev" onclick="navBook(-1)">← 上一頁</button>
      <span class="bnav-ind" id="bnav-ind">— / —</span>
      <button class="bnav-btn" id="btn-next" onclick="navBook(1)">下一頁 →</button>
    </div>
  </div>

</div>

<script>
/* ── STATE ── */
let pages = [
  {id:uid(),type:'cover',title:'我的童話書',subtitle:'A Fairy Tale',author:'作者名稱',imgData:null,layout:'cover'},
  {id:uid(),type:'text',chapter:'第一章',title:'故事的開始',body:'從前從前，在一個很遠很遠的地方……\n\n這裡可以輸入你的故事。每一個字都會在書頁上留下印記，就像古老的藏書票一樣，訴說著只屬於你的敘事。',imgData:null,imgSize:'half',layout:'img-top'},
  {id:uid(),type:'text',chapter:'第一章',title:'奇妙的相遇',body:'她沿著石板路走去，空氣裡飄著肉桂與舊紙的氣味。\n\n前方的路口站著一個人，手裡捧著一本從未見過封面的書。',imgData:null,imgSize:'half',layout:'text-only'},
];
let spreadIdx = 0;
let activePage = pages[0].id;
let activeTab = 'pages';

function uid(){return Math.random().toString(36).slice(2,9)}

/* ── ROMAN NUMERALS ── */
function toRoman(n){
  const v=[1000,900,500,400,100,90,50,40,10,9,5,4,1];
  const s=['M','CM','D','CD','C','XC','L','XL','X','IX','V','IV','I'];
  let r='';for(let i=0;i<v.length;i++){while(n>=v[i]){r+=s[i];n-=v[i]}}return r;
}

/* ── RENDER PAGE ── */
function renderPage(page, side, pageNumber) {
  if (!page) return `<div class="page-face"><div class="page-content"><div class="empty-hint">${side==='left'?'← 左頁':'右頁 →'}</div></div></div>`;

  if (page.type === 'cover') {
    const imgHtml = page.imgData
      ? `<img class="cover-img" src="${sanitizeImgSrc(page.imgData)}" style="position:relative;z-index:2"/>`
      : `<div style="width:55%;height:38%;background:rgba(201,168,76,.08);border:1px dashed rgba(201,168,76,.3);display:flex;align-items:center;justify-content:center;color:rgba(201,168,76,.3);font-size:10px;position:relative;z-index:2;border-radius:2px">封面圖片</div>`;
    return `<div class="page-face cover-page">
      ${imgHtml}
      <div class="cover-title-text">${esc(page.title||'書名')}</div>
      <div class="cover-subtitle">${esc(page.subtitle||'')}</div>
      <div class="cover-author-text">${esc(page.author||'')}</div>
    </div>`;
  }

  // text page
  const roman = toRoman(pageNumber);
  const numSide = side === 'left' ? 'left' : 'right';

  let imgBlock = '';
  if (page.layout !== 'text-only') {
    if (page.imgData) {
      const sz = page.imgSize || 'half';
      imgBlock = `<img class="img-slot ${sz}" src="${sanitizeImgSrc(page.imgData)}" style="margin-bottom:10px"/>`;
    } else {
      const sz = page.imgSize || 'half';
      imgBlock = `<div class="img-placeholder ${sz}" style="margin-bottom:10px">圖片區域</div>`;
    }
  }

  return `<div class="page-face">
    <div class="page-content">
      ${imgBlock}
      <div class="page-chapter">${esc(page.chapter||'')}</div>
      <div class="page-title-text">${esc(page.title||'')}</div>
      <div class="page-body">${esc(page.body||'').replace(/\n/g,'<br>')}</div>
    </div>
    <div class="page-num-display ${numSide}">${roman}</div>
  </div>`;
}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function sanitizeImgSrc(s){if(!s)return'';if(typeof s!=='string')return'';if(!s.startsWith('data:image/')&&!s.startsWith('https://'))return'';return s.replace(/"/g,'&quot;')}

/* ── RENDER SPREAD ── */
function getSpread(idx) {
  // spread 0 = pages[0] left alone (cover), spread 1 = pages[1]+[2], etc.
  if (idx === 0) return [pages[0], null];
  const base = 1 + (idx-1)*2;
  return [pages[base]||null, pages[base+1]||null];
}

function totalSpreads() {
  if (pages.length <= 1) return 1;
  return 1 + Math.ceil((pages.length-1)/2);
}

function renderSpread() {
  const [lp, rp] = getSpread(spreadIdx);
  // Page numbers: cover = 0, others = position in pages array
  const lIdx = lp ? pages.indexOf(lp) : -1;
  const rIdx = rp ? pages.indexOf(rp) : -1;
  document.getElementById('book-left').innerHTML = renderPage(lp, 'left', lIdx);
  document.getElementById('book-right').innerHTML = renderPage(rp, 'right', rIdx);
  document.getElementById('bnav-ind').textContent = `${spreadIdx+1} / ${totalSpreads()}`;
  document.getElementById('btn-prev').disabled = spreadIdx === 0;
  document.getElementById('btn-next').disabled = spreadIdx >= totalSpreads()-1;
}

function navBook(dir) {
  const ns = spreadIdx + dir;
  if (ns < 0 || ns >= totalSpreads()) return;
  spreadIdx = ns;
  renderSpread();
}

/* ── PAGE LIST ── */
function renderPageList() {
  const list = document.getElementById('page-list');
  list.innerHTML = pages.map((p,i) => `
    <div class="page-item${p.id===activePage?' active':''}" onclick="selectPage('${p.id}')">
      <div class="page-num-badge">${i+1}</div>
      <div class="page-info">
        <div class="page-info-title">${esc(p.title||'（無標題）')}</div>
        <div class="page-info-sub">${p.type==='cover'?'封面':(esc(p.chapter||'')+'  '+toRoman(i))}</div>
      </div>
      <button class="page-del" onclick="deletePage(event,'${p.id}')">✕</button>
    </div>
  `).join('');
}

function selectPage(id) {
  activePage = id;
  renderPageList();
  renderEditForm();
  switchTab('edit');
  // Jump to spread containing this page
  const idx = pages.findIndex(p=>p.id===id);
  if (idx === 0) spreadIdx = 0;
  else spreadIdx = 1 + Math.floor((idx-1)/2);
  renderSpread();
}

function deletePage(e, id) {
  e.stopPropagation();
  if (pages.length <= 1) return alert('至少保留一頁！');
  pages = pages.filter(p=>p.id!==id);
  if (activePage === id) activePage = pages[0].id;
  spreadIdx = Math.min(spreadIdx, totalSpreads()-1);
  render();
}

function addPage(type) {
  const p = type==='cover'
    ? {id:uid(),type:'cover',title:'新封面',subtitle:'',author:'',imgData:null}
    : {id:uid(),type:'text',chapter:'',title:'新頁面',body:'',imgData:null,imgSize:'half',layout:'img-top'};
  pages.push(p);
  activePage = p.id;
  spreadIdx = totalSpreads()-1;
  render();
  switchTab('edit');
}

/* ── EDIT FORM ── */
function renderEditForm() {
  const p = pages.find(p=>p.id===activePage);
  if (!p) return;
  const form = document.getElementById('edit-form');

  if (p.type === 'cover') {
    form.innerHTML = `
      <div class="field"><label>書名</label><input value="${esc(p.title||'')}" oninput="updatePage('title',this.value)"/></div>
      <div class="field"><label>副標題</label><input value="${esc(p.subtitle||'')}" oninput="updatePage('subtitle',this.value)"/></div>
      <div class="field"><label>作者</label><input value="${esc(p.author||'')}" oninput="updatePage('author',this.value)"/></div>
      <div class="field"><label>封面圖片</label>
        <div class="img-upload-area" id="upload-area">
          <input type="file" accept="image/*" onchange="handleImg(event)"/>
          <div class="upload-hint">點擊上傳圖片</div>
          <img id="img-thumb" class="img-thumb" src="" alt=""/>
        </div>
        <button class="img-clear" id="img-clear" onclick="clearImg()">移除圖片</button>
      </div>
    `;
  } else {
    form.innerHTML = `
      <div class="field"><label>版面配置</label>
        <div class="layout-grid">
          <div class="layout-opt${p.layout==='img-top'?' selected':''}" onclick="updatePage('layout','img-top')"><span class="layout-icon">🖼</span>圖上文下</div>
          <div class="layout-opt${p.layout==='text-only'?' selected':''}" onclick="updatePage('layout','text-only')"><span class="layout-icon">📝</span>純文字</div>
          <div class="layout-opt${p.layout==='img-half'?' selected':''}" onclick="updatePage('layout','img-half')"><span class="layout-icon">◧</span>圖半頁</div>
          <div class="layout-opt${p.layout==='img-full'?' selected':''}" onclick="updatePage('layout','img-full');updatePage('imgSize','full')"><span class="layout-icon">🖼</span>圖全頁</div>
        </div>
      </div>
      <div class="field"><label>章節標籤</label><input value="${esc(p.chapter||'')}" oninput="updatePage('chapter',this.value)" placeholder="例：第一章"/></div>
      <div class="field"><label>標題</label><input value="${esc(p.title||'')}" oninput="updatePage('title',this.value)"/></div>
      <div class="field"><label>正文</label><textarea oninput="updatePage('body',this.value)">${esc(p.body||'')}</textarea></div>
      <div class="field" id="img-field" style="${p.layout==='text-only'?'display:none':''}">
        <label>圖片大小</label>
        <select onchange="updatePage('imgSize',this.value)">
          <option value="half"${p.imgSize==='half'?' selected':''}>半頁</option>
          <option value="full"${p.imgSize==='full'?' selected':''}>全頁（大）</option>
        </select>
      </div>
      <div class="field" id="img-field2" style="${p.layout==='text-only'?'display:none':''}">
        <label>上傳圖片</label>
        <div class="img-upload-area">
          <input type="file" accept="image/*" onchange="handleImg(event)"/>
          <div class="upload-hint">點擊上傳圖片</div>
          <img id="img-thumb" class="img-thumb" src="" alt=""/>
        </div>
        <button class="img-clear" id="img-clear" onclick="clearImg()">移除圖片</button>
      </div>
    `;
  }
  // Show thumb if img exists
  const thumb = document.getElementById('img-thumb');
  const clr = document.getElementById('img-clear');
  if (thumb && p.imgData) {
    thumb.src = p.imgData;
    thumb.style.display = 'block';
    if (clr) clr.style.display = 'inline-block';
  }
}

function updatePage(key, val) {
  const p = pages.find(p=>p.id===activePage);
  if (!p) return;
  p[key] = val;
  if (key==='layout') {
    const imgF = document.getElementById('img-field');
    const imgF2 = document.getElementById('img-field2');
    if (imgF) imgF.style.display = val==='text-only'?'none':'';
    if (imgF2) imgF2.style.display = val==='text-only'?'none':'';
    // Re-render layout opts
    document.querySelectorAll('.layout-opt').forEach(el=>{
      el.classList.toggle('selected', el.textContent.trim().includes(
        val==='img-top'?'圖上文下':val==='text-only'?'純文字':val==='img-half'?'圖半頁':'圖全頁'
      ));
    });
  }
  renderSpread();
  renderPageList();
}

function handleImg(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    const p = pages.find(p=>p.id===activePage);
    if (!p) return;
    p.imgData = ev.target.result;
    const thumb = document.getElementById('img-thumb');
    const clr = document.getElementById('img-clear');
    if (thumb){thumb.src=ev.target.result;thumb.style.display='block';}
    if (clr) clr.style.display='inline-block';
    renderSpread();
  };
  reader.readAsDataURL(file);
}

function clearImg() {
  const p = pages.find(p=>p.id===activePage);
  if (p) p.imgData = null;
  const thumb = document.getElementById('img-thumb');
  const clr = document.getElementById('img-clear');
  if (thumb){thumb.src='';thumb.style.display='none';}
  if (clr) clr.style.display='none';
  renderSpread();
}

/* ── TABS ── */
function switchTab(tab) {
  activeTab = tab;
  document.getElementById('tab-pages').classList.toggle('active', tab==='pages');
  document.getElementById('tab-edit').classList.toggle('active', tab==='edit');
  document.getElementById('panel-pages').style.display = tab==='pages'?'':'none';
  document.getElementById('panel-edit').style.display = tab==='edit'?'':'none';
  if (tab==='edit') renderEditForm();
}

/* ── SAVE / LOAD ── */
function saveProject() {
  const data = JSON.stringify({version:1, pages}, null, 2);
  const blob = new Blob([data], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  const title = (pages.find(p=>p.type==='cover')?.title || '童話書').replace(/\s/g,'_');
  a.download = title + '.book';
  a.click();
}

function loadProjectFile() {
  document.getElementById('load-input').click();
}

function loadProject(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const data = JSON.parse(ev.target.result);
      if (!data.pages || !Array.isArray(data.pages)) throw new Error();
      pages = data.pages;
      spreadIdx = 0;
      activePage = pages[0]?.id || '';
      render();
      alert('✓ 載入成功！共 ' + pages.length + ' 頁');
    } catch {
      alert('⚠ 檔案格式錯誤，請選擇 .book 存檔');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
}

/* ── PDF EXPORT (html2canvas + jsPDF) ── */
async function exportPDF() {
  const btn = document.getElementById('pdf-btn');
  btn.textContent = '⏳ 產生中...';
  btn.disabled = true;

  // Load libraries dynamically
  if (!window.html2canvas) {
    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
  }
  if (!window.jspdf) {
    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.2/jspdf.umd.min.js');
  }

  const spreads = totalSpreads();
  const W = 840, H = 544, SPINE = 20;
  const TOTAL_W = W * 2 + SPINE;

  // Create offscreen container
  const container = document.createElement('div');
  container.style.cssText = `position:fixed;left:-9999px;top:0;z-index:-1`;
  document.body.appendChild(container);

  // Clone all current styles into container
  const styleClone = document.createElement('style');
  styleClone.textContent = Array.from(document.querySelectorAll('style'))
    .map(s => s.textContent).join('\n');
  container.appendChild(styleClone);

  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({ orientation: 'landscape', unit: 'px', format: [TOTAL_W, H] });

  for (let i = 0; i < spreads; i++) {
    if (i > 0) pdf.addPage([TOTAL_W, H], 'landscape');

    const [lp, rp] = getSpread(i);
    const li = lp ? pages.indexOf(lp) : -1;
    const ri = rp ? pages.indexOf(rp) : -1;

    // Build spread DOM
    const row = document.createElement('div');
    row.style.cssText = `display:flex;width:${TOTAL_W}px;height:${H}px;font-family:Georgia,serif;background:#f5f0e8`;

    const leftDiv = document.createElement('div');
    leftDiv.className = 'book-left';
    leftDiv.style.cssText = `width:${W}px;height:${H}px;overflow:hidden`;
    leftDiv.innerHTML = renderPage(lp, 'left', li);

    const spine = document.createElement('div');
    spine.style.cssText = `width:${SPINE}px;height:${H}px;flex-shrink:0;background:linear-gradient(to right,#1a1208,#3a2a14 40%,#1a1208)`;

    const rightDiv = document.createElement('div');
    rightDiv.className = 'book-right';
    rightDiv.style.cssText = `width:${W}px;height:${H}px;overflow:hidden`;
    rightDiv.innerHTML = renderPage(rp, 'right', ri);

    row.append(leftDiv, spine, rightDiv);
    container.appendChild(row);

    // Wait for images to load
    const imgs = row.querySelectorAll('img');
    await Promise.all(Array.from(imgs).map(img =>
      img.complete ? Promise.resolve() : new Promise(r => { img.onload = r; img.onerror = r; })
    ));

    // Capture to canvas
    const canvas = await html2canvas(row, {
      width: TOTAL_W,
      height: H,
      scale: 2,
      useCORS: true,
      backgroundColor: '#f5f0e8',
      logging: false
    });

    const imgData = canvas.toDataURL('image/jpeg', 0.92);
    pdf.addImage(imgData, 'JPEG', 0, 0, TOTAL_W, H);

    container.removeChild(row);

    btn.textContent = `⏳ ${i + 1}/${spreads}`;
  }

  document.body.removeChild(container);

  const titleText = pages.find(p => p.type === 'cover')?.title || '童話書';
  pdf.save(titleText + '.pdf');

  btn.textContent = '↓ 輸出 PDF';
  btn.disabled = false;
}

function loadScript(src) {
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = src;
    s.onload = resolve;
    s.onerror = reject;
    document.head.appendChild(s);
  });
}

  const cssSafeTitle = safeTitle.replace(/\\/g, '\\\\').replace(/'/g, "\\'");

  return `<!DOCTYPE html>
<html lang="zh-TW"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>${safeTitle}</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:radial-gradient(ellipse at center,#2a1f0e 0%,#0d0a05 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;font-family:'Georgia',serif;overflow:hidden}

.book-spine::after{content:'${cssSafeTitle}';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) rotate(90deg);font-size:8px;letter-spacing:.3em;color:#c9a84c;white-space:nowrap;opacity:.7}
.page-face{width:100%;height:100%;background:#f5f0e8;display:flex;flex-direction:column;position:relative;overflow:hidden}
.page-face::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 31px,rgba(0,0,0,.03) 31px,rgba(0,0,0,.03) 32px);pointer-events:none;z-index:0}
.page-face::after{content:'';position:absolute;inset:10px;border:1px solid #2a2010;box-shadow:inset 0 0 0 3px #f5f0e8,inset 0 0 0 4px #2a2010;pointer-events:none;z-index:1}
.page-content{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;padding:28px 26px 24px}
.img-slot{width:100%;object-fit:cover;border-radius:2px;flex-shrink:0;margin-bottom:10px}
.img-slot.half{height:42%}.img-slot.full{height:72%}
.img-ph{display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.06);border:1px dashed rgba(0,0,0,.15);color:rgba(0,0,0,.2);font-size:11px;flex-shrink:0;margin-bottom:10px}
.img-ph.half{height:42%}.img-ph.full{height:72%}
.page-chapter{font-size:9px;letter-spacing:.3em;color:#8a6840;text-transform:uppercase;margin-bottom:4px}
.page-title-text{font-size:17px;color:#1a1208;letter-spacing:.06em;margin-bottom:8px;line-height:1.3}
.page-body{font-size:11px;color:#2a1e0a;line-height:1.85;flex:1;overflow:hidden;text-align:justify}
.page-num-display{position:absolute;bottom:16px;font-size:9px;color:#8a6840;letter-spacing:.2em;z-index:3}
.cover-page{background:#1a1208;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:20px}
.cover-page::after{border-color:#c9a84c;box-shadow:inset 0 0 0 3px #1a1208,inset 0 0 0 4px #c9a84c,inset 0 0 0 8px #1a1208,inset 0 0 0 9px #c9a84c}
.cover-title-text{font-size:22px;color:#f5f0e8;letter-spacing:.1em;text-align:center;position:relative;z-index:2;line-height:1.4}
.cover-subtitle{font-size:10px;letter-spacing:.3em;color:#c9a84c;text-transform:uppercase;position:relative;z-index:2}
.cover-author-text{font-size:9px;color:#8a6840;letter-spacing:.2em;position:relative;z-index:2;margin-top:8px}
.nav{display:flex;align-items:center;gap:24px;margin-top:20px}
.nbtn{background:rgba(0,0,0,.5);border:.5px solid rgba(201,168,76,.3);border-radius:20px;padding:7px 20px;color:#c9a84c;font-size:11px;letter-spacing:.15em;cursor:pointer;font-family:inherit}
.nbtn:hover{background:rgba(201,168,76,.15)}.nbtn:disabled{opacity:.25;cursor:default}
.nind{font-size:10px;color:rgba(201,168,76,.6);letter-spacing:.2em;min-width:80px;text-align:center}
</style></head><body>
<div class="book-wrap" id="bw">
  <div class="book-left" id="bl"></div>
  <div class="book-spine"></div>
  <div class="book-right" id="br"></div>
</div>
<div class="nav">
  <button class="nbtn" id="bp" onclick="nav(-1)">← 上一頁</button>
  <span class="nind" id="ni"></span>
  <button class="nbtn" id="bn" onclick="nav(1)">下一頁 →</button>
</div>
<script>
const pages=${pagesJSON};
let si=0;
function roman(n){const v=[1000,900,500,400,100,90,50,40,10,9,5,4,1],s=['M','CM','D','CD','C','XC','L','XL','X','IX','V','IV','I'];let r='';for(let i=0;i<v.length;i++){while(n>=v[i]){r+=s[i];n-=v[i]}}return r}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function rp(p,side,pn){
  if(!p)return '<div class="page-face"><div class="page-content" style="align-items:center;justify-content:center;height:100%"><span style="color:rgba(0,0,0,.15);font-size:12px">—</span></div></div>';
  if(p.type==='cover'){
    const img=p.imgData?'<img style="width:55%;max-height:40%;object-fit:contain;position:relative;z-index:2;margin-bottom:8px" src="'+p.imgData+'">'
      :'<div style="width:55%;height:35%;background:rgba(201,168,76,.08);border:1px dashed rgba(201,168,76,.3);position:relative;z-index:2;margin-bottom:8px"></div>';
    return '<div class="page-face cover-page">'+img+'<div class="cover-title-text">'+esc(p.title)+'</div><div class="cover-subtitle">'+esc(p.subtitle)+'</div><div class="cover-author-text">'+esc(p.author)+'</div></div>';
  }
  const ns=side==='left'?'left:22px':'right:22px';
  let ib='';
  if(p.layout!=='text-only'){
    if(p.imgData){ib='<img class="img-slot '+(p.imgSize||'half')+'" src="'+p.imgData+'">';}
    else{ib='<div class="img-ph '+(p.imgSize||'half')+'">圖片</div>';}
  }
  return '<div class="page-face"><div class="page-content">'+ib+'<div class="page-chapter">'+esc(p.chapter)+'</div><div class="page-title-text">'+esc(p.title)+'</div><div class="page-body">'+esc(p.body).replace(/\\n/g,'<br>')+'</div></div><div class="page-num-display" style="'+ns+'">'+roman(pn)+'</div></div>';
}
function spread(i){if(i===0)return[pages[0],null];const b=1+(i-1)*2;return[pages[b]||null,pages[b+1]||null]}
function ts(){return pages.length<=1?1:1+Math.ceil((pages.length-1)/2)}
function draw(){
  const[l,r]=spread(si);
  const li=l?pages.indexOf(l):-1,ri=r?pages.indexOf(r):-1;
  document.getElementById('bl').innerHTML=rp(l,'left',li);
  document.getElementById('br').innerHTML=rp(r,'right',ri);
  document.getElementById('ni').textContent=(si+1)+' / '+ts();
  document.getElementById('bp').disabled=si===0;
  document.getElementById('bn').disabled=si>=ts()-1;
}
function nav(d){const n=si+d;if(n<0||n>=ts())return;si=n;draw();}
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')nav(1);if(e.key==='ArrowLeft')nav(-1);});
draw();
<\/script></body></html>`;
}

function downloadHTML() {
  const html = buildBookHTML(false);
  const blob = new Blob([html], {type:'text/html'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '童話書.html';
  a.click();
}

function openFullscreen() {
  const html = buildBookHTML(true);
  const w = window.open('','_blank','width=1920,height=1080');
  w.document.write(html);
  w.document.close();
}

/* ── INIT ── */
function render() {
  renderPageList();
  renderSpread();
  if (activeTab==='edit') renderEditForm();
}

document.addEventListener('keydown', e=>{
  if (e.key==='ArrowRight' && activeTab!=='edit') navBook(1);
  if (e.key==='ArrowLeft' && activeTab!=='edit') navBook(-1);
});

render();

// Dark/light mode sync from App Shell
(function() {
  try {
    var parentMode = window.parent?.document?.documentElement?.getAttribute('data-mode');
    if (parentMode) document.documentElement.setAttribute('data-mode', parentMode);
  } catch(e) {}
})();
window.addEventListener('message', function(e) {
  if (e.origin !== location.origin) return;
  if (e.data?.type === 'akasha-mode-change') {
    document.documentElement.setAttribute('data-mode', e.data.mode);
  }
});
</script>
