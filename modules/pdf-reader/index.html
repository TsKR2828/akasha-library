<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1E2430">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="阿卡夏">
<meta name="description" content="輕量 PDF 閱讀器 · 內建切割工具">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192x192.png">
<title>阿卡夏圖書館 — PDF 閱讀器</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs" type="module"></script>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Noto+Serif+TC:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #1E2430;
    --navy-light: #2A3240;
    --navy-hover: #343E4E;
    --gold: #C9A86A;
    --gold-dim: #A08550;
    --gold-glow: rgba(201,168,106,0.15);
    --cream: #F4F0E6;
    --cream-dark: #E8E2D4;
    --text-primary: #F4F0E6;
    --text-secondary: #9BA3B0;
    --text-dark: #1E2430;
    --danger: #C75B5B;
    --success: #6AAE7F;
    --sidebar-width: 280px;
    --topbar-height: 52px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Serif TC', serif;
    background: var(--navy);
    color: var(--text-primary);
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* ===== TOP BAR ===== */
  .topbar {
    height: var(--topbar-height);
    background: var(--navy);
    border-bottom: 1px solid var(--navy-light);
    display: flex;
    align-items: center;
    padding: 0 20px;
    gap: 16px;
    flex-shrink: 0;
    z-index: 100;
  }

  .topbar-brand {
    font-family: 'Cormorant Garamond', serif;
    font-size: 20px;
    font-weight: 600;
    color: var(--gold);
    letter-spacing: 2px;
    cursor: default;
    user-select: none;
    white-space: nowrap;
  }

  .topbar-brand span {
    font-family: 'Noto Serif TC', serif;
    font-size: 14px;
    color: var(--text-secondary);
    margin-left: 8px;
    font-weight: 400;
  }

  .topbar-divider {
    width: 1px;
    height: 24px;
    background: var(--navy-light);
  }

  .topbar-filename {
    font-size: 13px;
    color: var(--text-secondary);
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .topbar-actions {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .btn {
    font-family: 'Noto Serif TC', serif;
    font-size: 12px;
    padding: 6px 14px;
    border-radius: 4px;
    border: 1px solid var(--navy-light);
    background: var(--navy-light);
    color: var(--text-primary);
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }

  .btn:hover {
    background: var(--navy-hover);
    border-color: var(--gold-dim);
  }

  .btn-gold {
    background: var(--gold);
    color: var(--navy);
    border-color: var(--gold);
    font-weight: 600;
  }

  .btn-gold:hover {
    background: var(--gold-dim);
    border-color: var(--gold-dim);
  }

  .btn-danger {
    border-color: var(--danger);
    color: var(--danger);
  }

  .btn-danger:hover {
    background: var(--danger);
    color: var(--cream);
  }

  /* ===== MAIN LAYOUT ===== */
  .main-container {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* ===== SIDEBAR ===== */
  .sidebar {
    width: var(--sidebar-width);
    background: var(--navy);
    border-right: 1px solid var(--navy-light);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    transition: margin-left 0.3s ease;
  }

  .sidebar.collapsed {
    margin-left: calc(-1 * var(--sidebar-width));
  }

  .sidebar-tabs {
    display: flex;
    border-bottom: 1px solid var(--navy-light);
    flex-shrink: 0;
  }

  .sidebar-tab {
    flex: 1;
    padding: 10px;
    font-size: 12px;
    text-align: center;
    cursor: pointer;
    color: var(--text-secondary);
    border-bottom: 2px solid transparent;
    transition: all 0.2s;
    background: none;
    border-top: none;
    border-left: none;
    border-right: none;
    font-family: 'Noto Serif TC', serif;
  }

  .sidebar-tab.active {
    color: var(--gold);
    border-bottom-color: var(--gold);
  }

  .sidebar-tab:hover {
    color: var(--text-primary);
  }

  .sidebar-content {
    flex: 1;
    overflow-y: auto;
    padding: 12px;
  }

  .sidebar-content::-webkit-scrollbar { width: 4px; }
  .sidebar-content::-webkit-scrollbar-track { background: transparent; }
  .sidebar-content::-webkit-scrollbar-thumb { background: var(--navy-hover); border-radius: 2px; }

  /* Thumbnail list */
  .thumb-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px;
    border-radius: 4px;
    cursor: pointer;
    transition: background 0.15s;
    margin-bottom: 4px;
  }

  .thumb-item:hover, .thumb-item.active {
    background: var(--navy-light);
  }

  .thumb-item.active {
    border-left: 2px solid var(--gold);
  }

  .thumb-item canvas {
    width: 48px;
    height: 64px;
    border-radius: 2px;
    border: 1px solid var(--navy-light);
    flex-shrink: 0;
  }

  .thumb-page-num {
    font-size: 12px;
    color: var(--text-secondary);
  }

  /* Split panel */
  .split-panel { display: none; }
  .split-panel.visible { display: block; }

  .split-group {
    background: var(--navy-light);
    border-radius: 6px;
    padding: 14px;
    margin-bottom: 12px;
  }

  .split-group label {
    display: block;
    font-size: 12px;
    color: var(--text-secondary);
    margin-bottom: 6px;
  }

  .split-input-row {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-bottom: 10px;
  }

  .split-input-row span {
    font-size: 12px;
    color: var(--text-secondary);
  }

  .split-input {
    width: 70px;
    padding: 6px 8px;
    background: var(--navy);
    border: 1px solid var(--navy-hover);
    color: var(--text-primary);
    border-radius: 4px;
    font-family: 'Cormorant Garamond', serif;
    font-size: 15px;
    text-align: center;
  }

  .split-input:focus {
    outline: none;
    border-color: var(--gold);
  }

  .split-mode-toggle {
    display: flex;
    border-radius: 4px;
    overflow: hidden;
    margin-bottom: 14px;
    border: 1px solid var(--navy-hover);
  }

  .split-mode-btn {
    flex: 1;
    padding: 8px;
    font-size: 11px;
    text-align: center;
    background: var(--navy);
    color: var(--text-secondary);
    border: none;
    cursor: pointer;
    font-family: 'Noto Serif TC', serif;
    transition: all 0.2s;
  }

  .split-mode-btn.active {
    background: var(--gold);
    color: var(--navy);
    font-weight: 600;
  }

  .split-preview {
    font-size: 11px;
    color: var(--text-secondary);
    padding: 8px;
    background: var(--navy);
    border-radius: 4px;
    margin-bottom: 12px;
    line-height: 1.6;
    max-height: 200px;
    overflow-y: auto;
  }

  .split-preview-item {
    padding: 2px 0;
  }

  .split-preview-item.current {
    color: var(--gold);
  }

  /* Library panel */
  .library-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px;
    border-radius: 4px;
    cursor: pointer;
    transition: background 0.15s;
    margin-bottom: 4px;
  }

  .library-item:hover {
    background: var(--navy-light);
  }

  .library-item-info {
    flex: 1;
    overflow: hidden;
  }

  .library-item-title {
    font-size: 13px;
    color: var(--text-primary);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .library-item-meta {
    font-size: 11px;
    color: var(--text-secondary);
    margin-top: 2px;
  }

  .library-item-remove {
    color: var(--text-secondary);
    cursor: pointer;
    font-size: 16px;
    padding: 4px;
    border-radius: 4px;
    transition: all 0.15s;
    background: none;
    border: none;
  }

  .library-item-remove:hover {
    color: var(--danger);
    background: rgba(199,91,91,0.1);
  }

  .library-empty {
    text-align: center;
    color: var(--text-secondary);
    font-size: 12px;
    padding: 32px 16px;
    line-height: 1.8;
  }

  /* ===== SYNC CHECKBOX ===== */
  .sync-checkbox {
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    user-select: none;
    padding: 8px 10px;
    border-radius: 4px;
    transition: background 0.15s;
  }

  .sync-checkbox:hover {
    background: var(--navy-light);
  }

  .sync-checkbox input { display: none; }

  .sync-checkbox-mark {
    width: 16px;
    height: 16px;
    border: 1.5px solid var(--text-secondary);
    border-radius: 3px;
    flex-shrink: 0;
    position: relative;
    transition: all 0.2s;
  }

  .sync-checkbox input:checked + .sync-checkbox-mark {
    background: var(--gold);
    border-color: var(--gold);
  }

  .sync-checkbox input:checked + .sync-checkbox-mark::after {
    content: '';
    position: absolute;
    left: 4px;
    top: 1px;
    width: 5px;
    height: 9px;
    border: solid var(--navy);
    border-width: 0 2px 2px 0;
    transform: rotate(45deg);
  }

  .sync-checkbox-label {
    font-size: 12px;
    color: var(--text-secondary);
    transition: color 0.2s;
  }

  .sync-checkbox input:checked ~ .sync-checkbox-label {
    color: var(--gold);
  }

  /* ===== READER AREA ===== */
  .reader-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
  }

  .reader-toolbar {
    height: 40px;
    background: var(--navy);
    border-bottom: 1px solid var(--navy-light);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    flex-shrink: 0;
    padding: 0 12px;
  }

  .reader-toolbar .btn { padding: 4px 10px; font-size: 11px; }

  .page-indicator {
    font-family: 'Cormorant Garamond', serif;
    font-size: 14px;
    color: var(--text-secondary);
    min-width: 90px;
    text-align: center;
  }

  .page-jump-input {
    width: 48px;
    padding: 3px 6px;
    background: var(--navy-light);
    border: 1px solid var(--navy-hover);
    color: var(--text-primary);
    border-radius: 3px;
    font-family: 'Cormorant Garamond', serif;
    font-size: 13px;
    text-align: center;
  }

  .page-jump-input:focus {
    outline: none;
    border-color: var(--gold);
  }

  .zoom-display {
    font-size: 11px;
    color: var(--text-secondary);
    min-width: 40px;
    text-align: center;
  }

  .reader-viewport {
    flex: 1;
    overflow: auto;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 24px;
    background: #151A22;
  }

  .reader-viewport::-webkit-scrollbar { width: 8px; }
  .reader-viewport::-webkit-scrollbar-track { background: #151A22; }
  .reader-viewport::-webkit-scrollbar-thumb { background: var(--navy-hover); border-radius: 4px; }

  #pdf-canvas {
    box-shadow: 0 4px 24px rgba(0,0,0,0.4);
    border-radius: 2px;
  }

  /* ===== WELCOME SCREEN ===== */
  .welcome-screen {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    padding: 40px;
  }

  .welcome-icon {
    width: 80px;
    height: 80px;
    border: 2px solid var(--gold);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--gold);
    font-size: 32px;
    font-family: 'Cormorant Garamond', serif;
  }

  .welcome-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 28px;
    color: var(--gold);
    letter-spacing: 3px;
  }

  .welcome-sub {
    font-size: 13px;
    color: var(--text-secondary);
    text-align: center;
    line-height: 1.8;
  }

  .drop-zone {
    width: 360px;
    max-width: 100%;
    padding: 40px;
    border: 2px dashed var(--navy-hover);
    border-radius: 8px;
    text-align: center;
    cursor: pointer;
    transition: all 0.3s;
    position: relative;
  }

  .drop-zone:hover, .drop-zone.dragover {
    border-color: var(--gold);
    background: var(--gold-glow);
  }

  .drop-zone-text {
    font-size: 13px;
    color: var(--text-secondary);
    line-height: 1.8;
  }

  .drop-zone-text strong {
    color: var(--gold);
    font-weight: 600;
  }

  #file-input { display: none; }

  /* ===== LOADING ===== */
  .loading-overlay {
    position: absolute;
    inset: 0;
    background: rgba(30,36,48,0.85);
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 16px;
    z-index: 200;
  }

  .loading-overlay.visible { display: flex; }

  .loading-spinner {
    width: 32px;
    height: 32px;
    border: 2px solid var(--navy-light);
    border-top-color: var(--gold);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  .loading-text {
    font-size: 12px;
    color: var(--text-secondary);
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* ===== TOAST ===== */
  .toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    padding: 12px 20px;
    background: var(--navy-light);
    border: 1px solid var(--gold-dim);
    border-radius: 6px;
    font-size: 12px;
    color: var(--text-primary);
    z-index: 999;
    transform: translateY(80px);
    opacity: 0;
    transition: all 0.3s ease;
    max-width: 320px;
  }

  .toast.visible {
    transform: translateY(0);
    opacity: 1;
  }

  .toast.error {
    border-color: var(--danger);
  }

  .toast.success {
    border-color: var(--success);
  }

  /* ===== SIDEBAR TOGGLE ===== */
  .sidebar-toggle {
    position: absolute;
    left: 0;
    top: 50%;
    transform: translateY(-50%);
    width: 20px;
    height: 48px;
    background: var(--navy-light);
    border: 1px solid var(--navy-hover);
    border-left: none;
    border-radius: 0 4px 4px 0;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-secondary);
    font-size: 12px;
    z-index: 50;
    transition: all 0.2s;
  }

  .sidebar-toggle:hover {
    background: var(--navy-hover);
    color: var(--gold);
  }

  /* ===== AI PANEL ===== */
  .ai-panel {
    width: 340px;
    background: var(--navy);
    border-left: 1px solid var(--navy-light);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    transition: margin-right 0.3s ease;
    height: 100%;
  }

  .ai-panel--hidden {
    margin-right: -340px;
  }

  .ai-panel__header {
    padding: 12px 16px;
    border-bottom: 1px solid var(--navy-light);
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }

  .ai-panel__avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: var(--gold-glow);
    border: 1.5px solid var(--gold-dim);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    flex-shrink: 0;
  }

  .ai-panel__name {
    font-size: 13px;
    color: var(--text-primary);
    font-weight: 600;
    flex: 1;
  }

  .ai-panel__status {
    font-size: 10px;
    color: var(--text-secondary);
    margin-top: 1px;
  }

  .ai-panel__close {
    background: none;
    border: none;
    color: var(--text-secondary);
    font-size: 18px;
    cursor: pointer;
    padding: 4px;
    border-radius: 4px;
    transition: all 0.15s;
  }

  .ai-panel__close:hover {
    color: var(--text-primary);
    background: var(--navy-light);
  }

  /* Mode switcher */
  .ai-panel__modes {
    display: flex;
    padding: 8px 16px;
    gap: 4px;
    border-bottom: 1px solid var(--navy-light);
    flex-shrink: 0;
  }

  .ai-panel__mode-btn {
    flex: 1;
    padding: 6px 8px;
    font-size: 11px;
    text-align: center;
    background: none;
    border: 1px solid var(--navy-light);
    border-radius: 4px;
    color: var(--text-secondary);
    cursor: pointer;
    font-family: inherit;
    transition: all 0.15s;
  }

  .ai-panel__mode-btn:hover {
    border-color: var(--gold-dim);
    color: var(--text-primary);
  }

  .ai-panel__mode-btn--active {
    border-color: var(--gold);
    background: var(--gold-glow);
    color: var(--gold);
  }

  /* Chat messages */
  .ai-panel__messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .ai-panel__messages::-webkit-scrollbar { width: 4px; }
  .ai-panel__messages::-webkit-scrollbar-track { background: transparent; }
  .ai-panel__messages::-webkit-scrollbar-thumb { background: var(--navy-hover); border-radius: 2px; }

  .ai-msg {
    max-width: 88%;
    padding: 10px 14px;
    border-radius: 10px;
    font-size: 13px;
    line-height: 1.7;
  }

  .ai-msg--assistant {
    background: var(--navy-light);
    color: var(--text-primary);
    align-self: flex-start;
    border-bottom-left-radius: 3px;
  }

  .ai-msg--user {
    background: var(--gold-glow);
    color: var(--cream);
    align-self: flex-end;
    border-bottom-right-radius: 3px;
    border: 1px solid rgba(201,168,106,0.2);
  }

  .ai-msg__typing {
    display: flex;
    gap: 4px;
    padding: 12px 16px;
    align-self: flex-start;
  }

  .ai-msg__typing span {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--text-secondary);
    animation: typing-dot 1.2s infinite;
  }

  .ai-msg__typing span:nth-child(2) { animation-delay: 0.2s; }
  .ai-msg__typing span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes typing-dot {
    0%, 60%, 100% { opacity: 0.3; transform: translateY(0); }
    30% { opacity: 1; transform: translateY(-3px); }
  }

  /* Token/cost display */
  .ai-panel__cost {
    padding: 6px 16px;
    font-size: 10px;
    color: var(--text-secondary);
    border-top: 1px solid var(--navy-light);
    display: flex;
    justify-content: space-between;
    flex-shrink: 0;
  }

  .ai-panel__cost-coins {
    color: var(--gold);
  }

  /* Input area */
  .ai-panel__input-area {
    padding: 12px 16px;
    border-top: 1px solid var(--navy-light);
    flex-shrink: 0;
  }

  .ai-panel__input-row {
    display: flex;
    gap: 8px;
    align-items: flex-end;
  }

  .ai-panel__input {
    flex: 1;
    padding: 10px 14px;
    background: var(--navy-light);
    border: 1px solid var(--navy-hover);
    border-radius: 8px;
    color: var(--text-primary);
    font-size: 13px;
    font-family: inherit;
    resize: none;
    min-height: 40px;
    max-height: 120px;
    line-height: 1.5;
    outline: none;
    transition: border-color 0.2s;
  }

  .ai-panel__input:focus {
    border-color: var(--gold-dim);
  }

  .ai-panel__input::placeholder {
    color: var(--text-secondary);
  }

  .ai-panel__send {
    width: 38px;
    height: 38px;
    border-radius: 8px;
    background: var(--gold);
    border: none;
    color: var(--navy);
    font-size: 16px;
    cursor: pointer;
    flex-shrink: 0;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .ai-panel__send:hover {
    background: var(--gold-dim);
  }

  .ai-panel__send:disabled {
    opacity: 0.4;
    cursor: default;
  }

  /* AI toggle button in topbar */
  .btn-ai {
    background: var(--gold-glow);
    border-color: var(--gold-dim);
    color: var(--gold);
  }

  .btn-ai:hover {
    background: rgba(201,168,106,0.25);
  }

  .btn-ai--active {
    background: var(--gold);
    color: var(--navy);
    font-weight: 600;
  }

  /* ===== RESPONSIVE ===== */
  @media (max-width: 768px) {
    .sidebar { 
      position: absolute; 
      z-index: 90; 
      height: calc(100vh - var(--topbar-height));
      width: 260px;
    }
    .sidebar.collapsed { margin-left: -260px; }
    .topbar-brand span { display: none; }
    .topbar-brand { font-size: 16px; }
    .reader-viewport { padding: 12px; }
    .welcome-screen { padding: 24px; }
    .drop-zone { width: 100%; padding: 32px 20px; }
    .welcome-title { font-size: 22px; }
    .reader-toolbar { gap: 6px; padding: 0 8px; }
    .reader-toolbar .btn { padding: 4px 8px; font-size: 10px; }
    .page-jump-input { width: 40px; }
    .toast { left: 16px; right: 16px; max-width: none; }

    /* Touch-friendly: larger tap targets */
    .thumb-item { padding: 10px; }
    .btn { min-height: 36px; }
    .sidebar-tab { padding: 12px; }

    /* Start with sidebar collapsed on mobile */
    .sidebar { margin-left: -260px; }

    /* AI panel full-width overlay on mobile */
    .ai-panel {
      position: absolute;
      right: 0;
      top: 0;
      width: 100%;
      height: 100%;
      z-index: 95;
    }
    .ai-panel--hidden { margin-right: -100%; }
  }

  /* Safe area for notched phones */
  @supports (padding: env(safe-area-inset-top)) {
    .topbar { padding-top: env(safe-area-inset-top); }
    .toast { bottom: calc(24px + env(safe-area-inset-bottom)); }
  }
</style>
</head>
<body>

<!-- Top Bar -->
<div class="topbar">
  <div class="topbar-brand">阿卡夏圖書館 <span>Akasha Library</span></div>
  <div class="topbar-divider"></div>
  <div class="topbar-filename" id="currentFileName">未開啟檔案</div>
  <div class="topbar-actions">
    <button class="btn btn-ai" id="btnAI" onclick="toggleAIPanel()">AI 圖書館員</button>
    <button class="btn" id="btnOpen" onclick="document.getElementById('file-input').click()">開啟檔案</button>
    <input type="file" id="file-input" accept=".pdf">
  </div>
</div>

<!-- Main -->
<div class="main-container">
  <!-- Sidebar -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-tabs">
      <button class="sidebar-tab active" data-tab="pages" onclick="switchTab('pages')">頁面</button>
      <button class="sidebar-tab" data-tab="split" onclick="switchTab('split')">切割</button>
      <button class="sidebar-tab" data-tab="library" onclick="switchTab('library')">書庫</button>
    </div>

    <!-- Pages Tab -->
    <div class="sidebar-content" id="tab-pages">
      <div class="library-empty" id="pages-empty">開啟 PDF 後顯示頁面縮圖</div>
      <div id="thumb-list"></div>
    </div>

    <!-- Split Tab -->
    <div class="sidebar-content" id="tab-split" style="display:none;">
      <div class="split-panel visible">
        <div class="split-mode-toggle">
          <button class="split-mode-btn active" data-mode="range" onclick="setSplitMode('range')">範圍擷取</button>
          <button class="split-mode-btn" data-mode="every" onclick="setSplitMode('every')">等分切割</button>
        </div>

        <!-- Range mode -->
        <div id="split-range">
          <div class="split-group">
            <label>擷取頁面範圍</label>
            <div class="split-input-row">
              <span>從第</span>
              <input type="number" class="split-input" id="splitFrom" min="1" value="1">
              <span>頁 到第</span>
              <input type="number" class="split-input" id="splitTo" min="1" value="1">
              <span>頁</span>
            </div>
          </div>
          <button class="btn btn-gold" style="width:100%" onclick="splitRange()">擷取並下載</button>
        </div>

        <!-- Every-N mode -->
        <div id="split-every" style="display:none;">
          <div class="split-group">
            <label>每幾頁切割一個檔案</label>
            <div class="split-input-row">
              <span>每</span>
              <input type="number" class="split-input" id="splitEvery" min="1" value="50">
              <span>頁為一檔</span>
            </div>
          </div>
          <div class="split-preview" id="splitPreview"></div>
          <button class="btn btn-gold" style="width:100%" onclick="splitEvery()">全部切割並下載</button>
        </div>

        <label class="sync-checkbox" style="margin-top:14px;">
          <input type="checkbox" id="syncToLibrary">
          <span class="sync-checkbox-mark"></span>
          <span class="sync-checkbox-label">同步更新書庫</span>
        </label>

        <div style="margin-top:10px; font-size:11px; color:var(--text-secondary); line-height:1.6;" id="splitInfo">
          開啟 PDF 後即可使用切割功能
        </div>
      </div>
    </div>

    <!-- Library Tab -->
    <div class="sidebar-content" id="tab-library" style="display:none;">
      <div class="library-empty" id="library-empty">
        書庫是空的<br>開啟的 PDF 會自動加入書庫
      </div>
      <div id="library-list"></div>
    </div>
  </div>

  <!-- Reader -->
  <div class="reader-area">
    <div class="sidebar-toggle" id="sidebarToggle" onclick="toggleSidebar()">◀</div>

    <!-- Welcome -->
    <div class="welcome-screen" id="welcomeScreen">
      <div class="welcome-icon">書</div>
      <div class="welcome-title">阿卡夏圖書館</div>
      <div class="welcome-sub">
        輕量 PDF 閱讀器 · 內建切割工具<br>
        拖放檔案或點擊下方開啟
      </div>
      <div class="drop-zone" id="dropZone">
        <div class="drop-zone-text">
          將 PDF 拖放至此<br>
          或 <strong>點擊選擇檔案</strong>
        </div>
      </div>
    </div>

    <!-- Reader View (hidden until file opens) -->
    <div id="readerView" style="display:none;">
      <div class="reader-toolbar">
        <button class="btn" onclick="prevPage()">‹ 上一頁</button>
        <input type="number" class="page-jump-input" id="pageJumpInput" min="1" value="1" onchange="jumpToPage(this.value)">
        <span class="page-indicator" id="pageIndicator">/ 0</span>
        <button class="btn" onclick="nextPage()">下一頁 ›</button>
        <div class="topbar-divider"></div>
        <button class="btn" onclick="zoomOut()">−</button>
        <span class="zoom-display" id="zoomDisplay">100%</span>
        <button class="btn" onclick="zoomIn()">+</button>
        <button class="btn" onclick="zoomFit()">適合寬度</button>
      </div>
      <div class="reader-viewport" id="readerViewport">
        <canvas id="pdf-canvas"></canvas>
      </div>
    </div>

    <div class="loading-overlay" id="loadingOverlay">
      <div class="loading-spinner"></div>
      <div class="loading-text" id="loadingText">載入中…</div>
    </div>
  </div>

  <!-- AI Librarian Panel -->
  <aside class="ai-panel ai-panel--hidden" id="aiPanel">
    <div class="ai-panel__header">
      <div class="ai-panel__avatar">&#128218;</div>
      <div>
        <div class="ai-panel__name">AI 圖書館員</div>
        <div class="ai-panel__status" id="aiStatus">待機中</div>
      </div>
      <button class="ai-panel__close" onclick="toggleAIPanel()" title="關閉">&times;</button>
    </div>

    <div class="ai-panel__modes">
      <button class="ai-panel__mode-btn ai-panel__mode-btn--active" data-ai-mode="text" onclick="setAIMode('text')">純文字</button>
      <button class="ai-panel__mode-btn" data-ai-mode="voice" onclick="setAIMode('voice')">含語音</button>
      <button class="ai-panel__mode-btn" data-ai-mode="persona" onclick="setAIMode('persona')">含形象</button>
    </div>

    <div class="ai-panel__messages" id="aiMessages">
      <div class="ai-msg ai-msg--assistant">
        你好！我是你的 AI 圖書館員。開啟一本書後，可以問我任何關於內容的問題。
      </div>
    </div>

    <div class="ai-panel__cost">
      <span>預估：<span id="aiTokenEstimate">—</span> tokens</span>
      <span class="ai-panel__cost-coins">&#9679; 餘額：<span id="aiCoins">40</span> 月幣</span>
    </div>

    <div class="ai-panel__input-area">
      <div class="ai-panel__input-row">
        <textarea class="ai-panel__input" id="aiInput" placeholder="問點什麼..." rows="1" onkeydown="handleAIKeydown(event)"></textarea>
        <button class="ai-panel__send" id="aiSend" onclick="sendAIMessage()" title="送出">&#10148;</button>
      </div>
    </div>
  </aside>
</div>

<div class="toast" id="toast"></div>

<script type="module">
  // ===== PDF.js Setup =====
  const pdfjsLib = await import('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs');
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs';

  // ===== State =====
  let pdfDoc = null;
  let pdfBytes = null;
  let currentPage = 1;
  let totalPages = 0;
  let scale = 1.0;
  let currentFileName = '';

  // Make functions globally accessible
  window.prevPage = () => { if (currentPage > 1) { currentPage--; renderPage(); } };
  window.nextPage = () => { if (currentPage < totalPages) { currentPage++; renderPage(); } };
  window.jumpToPage = (val) => {
    const p = parseInt(val);
    if (p >= 1 && p <= totalPages) { currentPage = p; renderPage(); }
    else { document.getElementById('pageJumpInput').value = currentPage; }
  };
  window.zoomIn = () => { scale = Math.min(scale + 0.15, 3.0); renderPage(); };
  window.zoomOut = () => { scale = Math.max(scale - 0.15, 0.3); renderPage(); };
  window.zoomFit = () => { fitWidth(); };
  window.switchTab = switchTab;
  window.setSplitMode = setSplitMode;
  window.splitRange = splitRange;
  window.splitEvery = splitEveryFn;
  window.toggleSidebar = toggleSidebar;
  window.goToPage = (p) => { currentPage = p; renderPage(); switchTab('pages'); };

  // ===== File Input =====
  const fileInput = document.getElementById('file-input');
  const dropZone = document.getElementById('dropZone');

  fileInput.addEventListener('change', (e) => {
    if (e.target.files[0]) loadFile(e.target.files[0]);
  });

  dropZone?.addEventListener('click', () => fileInput.click());
  
  // Drag & drop on welcome zone
  dropZone?.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
  dropZone?.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
  dropZone?.addEventListener('drop', (e) => {
    e.preventDefault();
    dropZone.classList.remove('dragover');
    if (e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]);
  });

  // Drag & drop anywhere on reader
  document.body.addEventListener('dragover', (e) => e.preventDefault());
  document.body.addEventListener('drop', (e) => {
    e.preventDefault();
    if (e.dataTransfer.files[0] && e.dataTransfer.files[0].type === 'application/pdf') {
      loadFile(e.dataTransfer.files[0]);
    }
  });

  // ===== Load PDF =====
  async function loadFile(file) {
    if (file.type !== 'application/pdf') {
      showToast('請選擇 PDF 檔案', 'error');
      return;
    }

    showLoading('正在載入 ' + file.name + '…');
    currentFileName = file.name;
    document.getElementById('currentFileName').textContent = file.name;

    try {
      const arrayBuffer = await file.arrayBuffer();
      pdfBytes = new Uint8Array(arrayBuffer);
      pdfDoc = await pdfjsLib.getDocument({ data: pdfBytes.slice() }).promise;
      totalPages = pdfDoc.numPages;
      currentPage = 1;
      scale = 1.0;

      // Update UI
      document.getElementById('welcomeScreen').style.display = 'none';
      document.getElementById('readerView').style.display = 'flex';
      document.getElementById('pages-empty').style.display = 'none';
      document.getElementById('splitInfo').textContent = `共 ${totalPages} 頁`;
      document.getElementById('splitTo').value = totalPages;
      document.getElementById('splitTo').max = totalPages;
      document.getElementById('splitFrom').max = totalPages;

      // Save to library
      saveToLibrary(file.name, totalPages);

      // Render
      await renderPage();
      renderThumbnails();
      updateSplitPreview();
      hideLoading();
      showToast(`已載入「${file.name}」· ${totalPages} 頁`, 'success');

      // Auto fit width after first render
      setTimeout(fitWidth, 100);
    } catch (err) {
      hideLoading();
      showToast('載入失敗：' + err.message, 'error');
      console.error(err);
    }
  }

  // ===== Render Page =====
  async function renderPage() {
    if (!pdfDoc) return;
    const page = await pdfDoc.getPage(currentPage);
    const viewport = page.getViewport({ scale });
    const canvas = document.getElementById('pdf-canvas');
    const ctx = canvas.getContext('2d');

    canvas.width = viewport.width * window.devicePixelRatio;
    canvas.height = viewport.height * window.devicePixelRatio;
    canvas.style.width = viewport.width + 'px';
    canvas.style.height = viewport.height + 'px';
    ctx.setTransform(window.devicePixelRatio, 0, 0, window.devicePixelRatio, 0, 0);

    await page.render({ canvasContext: ctx, viewport }).promise;

    // Update indicators
    document.getElementById('pageJumpInput').value = currentPage;
    document.getElementById('pageJumpInput').max = totalPages;
    document.getElementById('pageIndicator').textContent = `/ ${totalPages}`;
    document.getElementById('zoomDisplay').textContent = Math.round(scale * 100) + '%';

    // Highlight active thumb
    document.querySelectorAll('.thumb-item').forEach((el, i) => {
      el.classList.toggle('active', i + 1 === currentPage);
    });
  }

  // ===== Fit Width =====
  function fitWidth() {
    if (!pdfDoc) return;
    pdfDoc.getPage(currentPage).then(page => {
      const vp = page.getViewport({ scale: 1.0 });
      const container = document.getElementById('readerViewport');
      const targetWidth = container.clientWidth - 48;
      scale = targetWidth / vp.width;
      renderPage();
    });
  }

  // ===== Thumbnails =====
  async function renderThumbnails() {
    const list = document.getElementById('thumb-list');
    list.innerHTML = '';
    const thumbScale = 0.25;

    for (let i = 1; i <= totalPages; i++) {
      const page = await pdfDoc.getPage(i);
      const vp = page.getViewport({ scale: thumbScale });
      const canvas = document.createElement('canvas');
      canvas.width = vp.width;
      canvas.height = vp.height;
      const ctx = canvas.getContext('2d');
      await page.render({ canvasContext: ctx, viewport: vp }).promise;

      const item = document.createElement('div');
      item.className = 'thumb-item' + (i === currentPage ? ' active' : '');
      item.onclick = () => { currentPage = i; renderPage(); };
      
      const num = document.createElement('span');
      num.className = 'thumb-page-num';
      num.textContent = i;

      item.appendChild(canvas);
      item.appendChild(num);
      list.appendChild(item);

      // Yield to not freeze UI
      if (i % 10 === 0) await new Promise(r => setTimeout(r, 0));
    }
  }

  // ===== Sidebar Tabs =====
  function switchTab(tab) {
    document.querySelectorAll('.sidebar-tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
    document.getElementById('tab-pages').style.display = tab === 'pages' ? '' : 'none';
    document.getElementById('tab-split').style.display = tab === 'split' ? '' : 'none';
    document.getElementById('tab-library').style.display = tab === 'library' ? '' : 'none';
    if (tab === 'library') renderLibrary();
  }

  function toggleSidebar() {
    const sb = document.getElementById('sidebar');
    const btn = document.getElementById('sidebarToggle');
    sb.classList.toggle('collapsed');
    btn.textContent = sb.classList.contains('collapsed') ? '▶' : '◀';
  }

  // ===== Split Mode =====
  function setSplitMode(mode) {
    document.querySelectorAll('.split-mode-btn').forEach(b => b.classList.toggle('active', b.dataset.mode === mode));
    document.getElementById('split-range').style.display = mode === 'range' ? '' : 'none';
    document.getElementById('split-every').style.display = mode === 'every' ? '' : 'none';
    if (mode === 'every') updateSplitPreview();
  }

  function updateSplitPreview() {
    if (!totalPages) return;
    const n = parseInt(document.getElementById('splitEvery').value) || 50;
    const preview = document.getElementById('splitPreview');
    let html = '';
    let fileNum = 1;
    for (let start = 1; start <= totalPages; start += n) {
      const end = Math.min(start + n - 1, totalPages);
      html += `<div class="split-preview-item">檔案 ${fileNum}：第 ${start} – ${end} 頁（${end - start + 1} 頁）</div>`;
      fileNum++;
    }
    preview.innerHTML = html;
  }

  document.getElementById('splitEvery')?.addEventListener('input', updateSplitPreview);

  // ===== PDF Splitting (using pdf-lib via CDN) =====
  let PDFLib = null;

  async function loadPDFLib() {
    if (PDFLib) return PDFLib;
    // Dynamically load pdf-lib
    const script = document.createElement('script');
    script.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js';
    document.head.appendChild(script);
    await new Promise((resolve, reject) => {
      script.onload = resolve;
      script.onerror = reject;
    });
    PDFLib = window.PDFLib;
    return PDFLib;
  }

  async function splitRange() {
    if (!pdfBytes) { showToast('請先開啟 PDF', 'error'); return; }
    const from = parseInt(document.getElementById('splitFrom').value);
    const to = parseInt(document.getElementById('splitTo').value);
    if (from < 1 || to > totalPages || from > to) {
      showToast('頁面範圍無效', 'error');
      return;
    }

    showLoading(`擷取第 ${from} – ${to} 頁…`);
    try {
      const lib = await loadPDFLib();
      const srcDoc = await lib.PDFDocument.load(pdfBytes);
      const newDoc = await lib.PDFDocument.create();
      const pages = await newDoc.copyPages(srcDoc, Array.from({ length: to - from + 1 }, (_, i) => from - 1 + i));
      pages.forEach(p => newDoc.addPage(p));
      const bytes = await newDoc.save();
      downloadBlob(bytes, `${stripExt(currentFileName)}_p${from}-${to}.pdf`);
      if (document.getElementById('syncToLibrary').checked) {
        saveToLibrary(`${stripExt(currentFileName)}_p${from}-${to}.pdf`, to - from + 1);
      }
      hideLoading();
      showToast(`已下載第 ${from}–${to} 頁` + (document.getElementById('syncToLibrary').checked ? '（已加入書庫）' : ''), 'success');
    } catch (err) {
      hideLoading();
      showToast('切割失敗：' + err.message, 'error');
    }
  }

  async function splitEveryFn() {
    if (!pdfBytes) { showToast('請先開啟 PDF', 'error'); return; }
    const n = parseInt(document.getElementById('splitEvery').value);
    if (n < 1) { showToast('請輸入有效數字', 'error'); return; }

    showLoading('正在切割…');
    try {
      const lib = await loadPDFLib();
      const srcDoc = await lib.PDFDocument.load(pdfBytes);
      let fileNum = 1;

      for (let start = 0; start < totalPages; start += n) {
        const end = Math.min(start + n, totalPages);
        const newDoc = await lib.PDFDocument.create();
        const pages = await newDoc.copyPages(srcDoc, Array.from({ length: end - start }, (_, i) => start + i));
        pages.forEach(p => newDoc.addPage(p));
        const bytes = await newDoc.save();
        const partName = `${stripExt(currentFileName)}_part${fileNum}.pdf`;
        downloadBlob(bytes, partName);
        if (document.getElementById('syncToLibrary').checked) {
          saveToLibrary(partName, end - start);
        }
        fileNum++;
        // Small delay so browser doesn't choke on multi-download
        await new Promise(r => setTimeout(r, 300));
      }

      const syncd = document.getElementById('syncToLibrary').checked;
      hideLoading();
      showToast(`已切割為 ${fileNum - 1} 個檔案` + (syncd ? '（已加入書庫）' : ''), 'success');
    } catch (err) {
      hideLoading();
      showToast('切割失敗：' + err.message, 'error');
    }
  }

  // ===== Library (localStorage) =====
  function getLibrary() {
    try { return JSON.parse(localStorage.getItem('akasha-library') || '[]'); } 
    catch { return []; }
  }

  function saveToLibrary(name, pages) {
    const lib = getLibrary();
    const existing = lib.findIndex(b => b.name === name);
    const entry = { name, pages, lastOpened: Date.now() };
    if (existing >= 0) lib[existing] = entry;
    else lib.unshift(entry);
    // Keep max 50
    localStorage.setItem('akasha-library', JSON.stringify(lib.slice(0, 50)));
  }

  function removeFromLibrary(name) {
    const lib = getLibrary().filter(b => b.name !== name);
    localStorage.setItem('akasha-library', JSON.stringify(lib));
    renderLibrary();
  }

  function renderLibrary() {
    const lib = getLibrary();
    const list = document.getElementById('library-list');
    const empty = document.getElementById('library-empty');
    
    if (lib.length === 0) {
      empty.style.display = '';
      list.innerHTML = '';
      return;
    }

    empty.style.display = 'none';
    list.innerHTML = lib.map(b => `
      <div class="library-item">
        <div class="library-item-info">
          <div class="library-item-title">${escapeHtml(b.name)}</div>
          <div class="library-item-meta">${b.pages} 頁 · ${formatDate(b.lastOpened)}</div>
        </div>
        <button class="library-item-remove" onclick="event.stopPropagation(); removeFromLibrary('${escapeHtml(b.name)}')" title="從書庫移除">×</button>
      </div>
    `).join('');
  }

  window.removeFromLibrary = removeFromLibrary;

  // ===== Keyboard shortcuts =====
  document.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT') return;
    if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); window.prevPage(); }
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); window.nextPage(); }
    if (e.key === '+' || e.key === '=') { e.preventDefault(); window.zoomIn(); }
    if (e.key === '-') { e.preventDefault(); window.zoomOut(); }
  });

  // ===== Utils =====
  function stripExt(filename) {
    return filename.replace(/\.pdf$/i, '');
  }

  function downloadBlob(bytes, filename) {
    const blob = new Blob([bytes], { type: 'application/pdf' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    a.click();
    URL.revokeObjectURL(url);
  }

  function showLoading(text) {
    document.getElementById('loadingText').textContent = text || '載入中…';
    document.getElementById('loadingOverlay').classList.add('visible');
  }

  function hideLoading() {
    document.getElementById('loadingOverlay').classList.remove('visible');
  }

  function showToast(msg, type = '') {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast visible ' + type;
    setTimeout(() => t.classList.remove('visible'), 3000);
  }

  function escapeHtml(str) {
    return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function formatDate(ts) {
    const d = new Date(ts);
    return `${d.getFullYear()}/${(d.getMonth()+1).toString().padStart(2,'0')}/${d.getDate().toString().padStart(2,'0')}`;
  }

  // Initial library render
  renderLibrary();

  // ===== AI PANEL =====
  let aiPanelOpen = false;
  let aiMode = 'text'; // 'text' | 'voice' | 'persona'
  let aiCoins = 40;

  window.toggleAIPanel = function() {
    const panel = document.getElementById('aiPanel');
    const btn = document.getElementById('btnAI');
    aiPanelOpen = !aiPanelOpen;
    panel.classList.toggle('ai-panel--hidden', !aiPanelOpen);
    btn.classList.toggle('btn-ai--active', aiPanelOpen);
  };

  window.setAIMode = function(mode) {
    aiMode = mode;
    document.querySelectorAll('.ai-panel__mode-btn').forEach(b => {
      b.classList.toggle('ai-panel__mode-btn--active', b.dataset.aiMode === mode);
    });
    const statusEl = document.getElementById('aiStatus');
    if (mode === 'text') statusEl.textContent = '純文字模式';
    else if (mode === 'voice') statusEl.textContent = '語音模式（開發中）';
    else if (mode === 'persona') statusEl.textContent = '形象模式��開發中）';
  };

  window.handleAIKeydown = function(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendAIMessage();
    }
  };

  window.sendAIMessage = function() {
    const input = document.getElementById('aiInput');
    const text = input.value.trim();
    if (!text) return;

    // Add user message
    appendAIMessage(text, 'user');
    input.value = '';
    autoResizeInput();

    // Update token estimate (placeholder calc)
    const estimatedTokens = Math.ceil(text.length * 1.5);
    document.getElementById('aiTokenEstimate').textContent = `~${estimatedTokens + 2000}`;

    // Show typing indicator
    showAITyping();

    // Placeholder response (replace with real API call later)
    setTimeout(() => {
      hideAITyping();
      if (!pdfDoc) {
        appendAIMessage('請先開啟一本 PDF，我才能回答關於書籍內容的問題。', 'assistant');
      } else {
        appendAIMessage(`[Placeholder] 你正在閱讀「${currentFileName}」的第 ${currentPage} 頁。這裡之後會接入 RAG 檢索 + LLM API。\n\n你的問題：「${text}」`, 'assistant');
        // Deduct coins (placeholder)
        aiCoins = Math.max(0, aiCoins - 0.5);
        document.getElementById('aiCoins').textContent = aiCoins;
      }
    }, 1200);
  };

  function appendAIMessage(text, role) {
    const container = document.getElementById('aiMessages');
    const msg = document.createElement('div');
    msg.className = `ai-msg ai-msg--${role}`;
    msg.textContent = text;
    container.appendChild(msg);
    container.scrollTop = container.scrollHeight;
  }

  function showAITyping() {
    const container = document.getElementById('aiMessages');
    const typing = document.createElement('div');
    typing.className = 'ai-msg__typing';
    typing.id = 'aiTyping';
    typing.innerHTML = '<span></span><span></span><span></span>';
    container.appendChild(typing);
    container.scrollTop = container.scrollHeight;
  }

  function hideAITyping() {
    const el = document.getElementById('aiTyping');
    if (el) el.remove();
  }

  // Auto-resize textarea
  const aiInput = document.getElementById('aiInput');
  aiInput?.addEventListener('input', autoResizeInput);

  function autoResizeInput() {
    const el = document.getElementById('aiInput');
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 120) + 'px';
  }

  // ===== PWA Service Worker =====
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('../../sw.js')
      .then(reg => console.log('SW registered:', reg.scope))
      .catch(() => {});
  }
</script>

</body>
</html>
