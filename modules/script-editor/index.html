<!DOCTYPE html>
<html lang="zh-Hant" data-mode="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Script Editor — Akasha Library</title>
<link rel="stylesheet" href="../../assets/styles/shared.css">
<style>
/* ===== Layout ===== */
html,body{margin:0;height:100%;overflow:hidden}
header{
  position:sticky;top:0;z-index:20;
  display:flex;align-items:center;gap:8px;
  padding:6px 12px;
  background:var(--navy);border-bottom:1px solid var(--navy-line);
  min-height:42px;flex-shrink:0;
}
header h1{font:600 13px/1 var(--font-display);color:var(--gold);margin:0;white-space:nowrap;letter-spacing:.5px}
header .sep{color:var(--text-tertiary);font-size:11px;margin:0 2px}

/* toolbar buttons */
.tb{
  display:inline-flex;align-items:center;gap:4px;
  padding:4px 10px;border:1px solid var(--navy-line);border-radius:var(--r-soft);
  background:transparent;color:var(--text-secondary);font-size:12px;
  transition:border-color .15s,color .15s;
}
.tb:hover{border-color:var(--gold-dim);color:var(--text-primary)}
.tb.accent{border-color:var(--gold-dim);color:var(--gold)}
.tb.accent:hover{border-color:var(--gold);color:var(--gold-bright)}
.tb svg{width:14px;height:14px;flex-shrink:0}
.spacer{flex:1}
.file-label{cursor:pointer}
.file-label input{display:none}

/* 3-col app */
.app{
  display:grid;
  grid-template-columns:240px 1fr 320px;
  height:calc(100vh - 42px);
  overflow:hidden;
}
@media(max-width:960px){
  .app{grid-template-columns:1fr;grid-template-rows:auto 1fr auto}
  .panel-left,.panel-right{max-height:35vh;overflow-y:auto}
}

/* ===== Left panel — Characters ===== */
.panel-left{
  background:var(--navy-deep);border-right:1px solid var(--navy-line);
  display:flex;flex-direction:column;overflow:hidden;
}
.panel-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 12px;border-bottom:1px solid var(--navy-line);
  font:600 12px/1 var(--font-display);color:var(--gold);letter-spacing:.5px;
}
.panel-header button{
  padding:2px 8px;border:1px solid var(--navy-line);border-radius:var(--r-soft);
  background:transparent;color:var(--text-secondary);font-size:11px;cursor:pointer;
}
.panel-header button:hover{border-color:var(--gold-dim);color:var(--gold)}

.char-list{flex:1;overflow-y:auto;padding:8px}
.char-card{
  display:flex;align-items:center;gap:8px;
  padding:8px 10px;margin-bottom:4px;border-radius:var(--r-card);
  border:1px solid transparent;cursor:pointer;
  transition:background .15s,border-color .15s;
}
.char-card:hover{background:var(--navy-light);border-color:var(--navy-line)}
.char-card.active{background:var(--navy-light);border-color:var(--gold-dim)}
.char-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.char-info{flex:1;min-width:0}
.char-name{font-size:13px;color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.char-aliases{font-size:11px;color:var(--text-tertiary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.char-count{font-size:11px;color:var(--text-tertiary);flex-shrink:0}
.char-actions{display:flex;gap:2px}
.char-actions button{
  padding:2px 4px;background:transparent;border:none;color:var(--text-tertiary);
  font-size:11px;cursor:pointer;border-radius:2px;
}
.char-actions button:hover{color:var(--gold);background:var(--navy-hover)}

/* Character edit modal */
.char-modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:100;
  display:flex;align-items:center;justify-content:center;
}
.char-modal{
  background:var(--navy);border:1px solid var(--navy-line);border-radius:var(--r-card);
  padding:20px;width:340px;max-width:90vw;box-shadow:var(--shadow-lift);
}
.char-modal h3{margin:0 0 14px;font:600 14px/1 var(--font-display);color:var(--gold)}
.char-modal label{display:block;font-size:12px;color:var(--text-secondary);margin-bottom:4px;margin-top:10px}
.char-modal input{
  width:100%;padding:6px 8px;
  background:var(--navy-deep);border:1px solid var(--navy-line);border-radius:var(--r-soft);
  color:var(--text-primary);font-size:13px;font-family:inherit;
}
.char-modal input:focus{outline:none;border-color:var(--gold-dim)}
.char-modal .color-row{display:flex;align-items:center;gap:8px}
.char-modal .color-row input[type="color"]{width:32px;height:28px;padding:0;border:none;cursor:pointer;background:none}
.char-modal .btn-row{display:flex;gap:8px;margin-top:16px;justify-content:flex-end}
.char-modal .btn-row button{
  padding:6px 16px;border-radius:var(--r-soft);font-size:12px;border:1px solid var(--navy-line);
  background:transparent;color:var(--text-secondary);cursor:pointer;
}
.char-modal .btn-row button.primary{background:var(--gold-deep);color:var(--cream);border-color:var(--gold-dim)}
.char-modal .btn-row button.danger{color:var(--danger);border-color:var(--danger)}

/* empty state */
.empty-chars{padding:20px 16px;text-align:center;color:var(--text-tertiary);font-size:12px;line-height:1.6}

/* ===== Center — Editor ===== */
.editor-panel{
  display:flex;flex-direction:column;overflow:hidden;
  background:var(--navy-deep);
}
.editor-toolbar{
  display:flex;align-items:center;gap:6px;
  padding:6px 12px;border-bottom:1px solid var(--navy-line);
  background:var(--navy);font-size:12px;
}
.editor-toolbar .stat{color:var(--text-tertiary);font-size:11px;margin-left:4px}
.editor-wrap{flex:1;overflow:hidden;display:flex;position:relative}
#script-editor{
  flex:1;resize:none;border:none;outline:none;
  padding:16px 20px;
  font:14px/1.75 var(--font-body);
  color:var(--text-primary);background:transparent;
  tab-size:4;white-space:pre-wrap;word-wrap:break-word;
}
#script-editor::placeholder{color:var(--text-tertiary)}

/* status bar */
.status-bar{
  display:flex;align-items:center;gap:8px;
  padding:4px 12px;border-top:1px solid var(--navy-line);
  background:var(--navy);font-size:11px;color:var(--text-tertiary);
}
.status-bar .badge{
  padding:1px 6px;border-radius:var(--r-sharp);
  background:var(--navy-light);color:var(--text-secondary);font-size:10px;
}
.status-bar .badge.ok{color:var(--success)}
.status-bar .badge.warn{color:var(--gold)}

/* ===== Right panel — Preview ===== */
.panel-right{
  background:var(--navy-deep);border-left:1px solid var(--navy-line);
  display:flex;flex-direction:column;overflow:hidden;
}
.preview-tabs{
  display:flex;border-bottom:1px solid var(--navy-line);background:var(--navy);
}
.preview-tab{
  flex:1;padding:8px 0;text-align:center;
  font-size:12px;color:var(--text-tertiary);
  border:none;background:transparent;cursor:pointer;
  border-bottom:2px solid transparent;
  transition:color .15s,border-color .15s;
}
.preview-tab:hover{color:var(--text-secondary)}
.preview-tab.active{color:var(--gold);border-bottom-color:var(--gold)}
.preview-body{flex:1;overflow-y:auto;padding:12px}

/* blocks preview cards */
.block-card{
  margin-bottom:6px;padding:8px 10px;
  border-radius:var(--r-card);border:1px solid var(--navy-line);
  font-size:13px;line-height:1.55;
}
.block-card.dialogue{background:var(--navy-light)}
.block-card.narration{background:rgba(201,168,106,.06);border-color:var(--gold-line)}
.block-card.command{background:rgba(100,107,120,.08);border-color:rgba(100,107,120,.2)}
.block-speaker{
  font-size:12px;font-weight:600;margin-bottom:2px;
  display:flex;align-items:center;gap:6px;
}
.block-speaker .dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.block-text{color:var(--text-primary)}
.block-meta{font-size:11px;color:var(--text-tertiary);margin-top:3px}
.block-cmd{font-family:var(--font-mono);font-size:12px;color:var(--text-secondary)}
.block-number{font-size:10px;color:var(--text-tertiary);float:right;margin-top:2px}

/* stats / outline in preview */
.stats-grid{
  display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;
}
.stat-box{
  padding:10px;border-radius:var(--r-card);border:1px solid var(--navy-line);
  background:var(--navy-light);text-align:center;
}
.stat-box .val{font-size:20px;font-weight:600;color:var(--gold);font-family:var(--font-display)}
.stat-box .lbl{font-size:11px;color:var(--text-tertiary);margin-top:2px}

/* empty preview */
.empty-preview{padding:24px 16px;text-align:center;color:var(--text-tertiary);font-size:12px;line-height:1.6}

/* ===== Layout preview (8-F) ===== */
.layout-page{
  background:var(--navy-light);border:1px solid var(--navy-line);border-radius:var(--r-card);
  padding:28px 24px 32px;margin-bottom:12px;
  font-family:var(--font-body);font-size:13px;line-height:1.85;
  min-height:200px;
  box-shadow:0 2px 8px rgba(0,0,0,.18);
}
.layout-title{
  text-align:center;font:600 16px/1.4 var(--font-display);color:var(--gold);
  margin-bottom:16px;padding-bottom:10px;
  border-bottom:1px solid var(--gold-line);letter-spacing:.5px;
}
.layout-scene{
  text-align:center;font-size:11px;color:var(--gold-dim);
  margin:14px 0 8px;letter-spacing:1px;text-transform:uppercase;
}
.layout-dlg{margin-bottom:8px;padding-left:20px;text-indent:-20px}
.layout-dlg .lspeaker{
  font-weight:700;margin-right:6px;display:inline;
}
.layout-dlg .ltext{display:inline;color:var(--text-primary)}
.layout-narr{
  margin:10px 0;padding:6px 16px;
  font-style:italic;color:var(--text-secondary);
  border-left:2px solid var(--gold-line);
}
.layout-cmd{
  margin:6px 0;text-align:right;
  font-family:var(--font-mono);font-size:11px;color:var(--text-tertiary);
}
.layout-toolbar{
  display:flex;align-items:center;gap:6px;
  margin-bottom:10px;padding-bottom:8px;
  border-bottom:1px solid var(--navy-line);
}
.layout-toolbar .tb{font-size:11px;padding:3px 8px}

/* ===== Toast ===== */
#toast-container{
  position:fixed;bottom:16px;right:16px;z-index:200;
  display:flex;flex-direction:column;gap:6px;
}
.toast{
  padding:8px 16px;border-radius:var(--r-card);
  background:var(--navy);border:1px solid var(--gold-dim);
  color:var(--cream-dim);font-size:12px;
  box-shadow:var(--shadow-card);
  animation:fadeInUp .25s ease;
}
@keyframes fadeInUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* ===== Export dropdown ===== */
.export-menu{
  position:absolute;top:100%;right:0;z-index:50;
  min-width:180px;padding:4px;
  background:var(--navy);border:1px solid var(--navy-line);border-radius:var(--r-card);
  box-shadow:var(--shadow-lift);
  display:none;
}
.export-menu.show{display:block}
.export-menu button{
  display:block;width:100%;text-align:left;
  padding:7px 12px;border:none;background:transparent;
  color:var(--text-secondary);font-size:12px;border-radius:var(--r-soft);cursor:pointer;
}
.export-menu button:hover{background:var(--navy-light);color:var(--text-primary)}
.export-menu .menu-divider{height:1px;background:var(--navy-line);margin:4px 0}
</style>

<!-- ====== Script ====== -->
<script type="module">

/* ──────────────────────────────────────────
   State
   ────────────────────────────────────────── */
const state = {
  filename: 'untitled.txt',
  format: 'plain-script',   // plain-script | blocks-jsonl
  blocks: [],
  characters: [],            // Character DB
  content: '',
  dirty: false,
  undoStack: [],
  redoStack: [],
  previewTab: 'blocks',
};

/* ──────────────────────────────────────────
   Character DB (separate IndexedDB)
   ────────────────────────────────────────── */
const CHAR_DB_NAME = 'script-editor-characters';
const CHAR_DB_VERSION = 1;
let _charDb = null;

function openCharDB() {
  if (_charDb) return Promise.resolve(_charDb);
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(CHAR_DB_NAME, CHAR_DB_VERSION);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains('characters')) {
        db.createObjectStore('characters', { keyPath: 'id' });
      }
    };
    req.onsuccess = () => { _charDb = req.result; resolve(_charDb); };
    req.onerror = () => reject(req.error);
  });
}

async function loadCharacters() {
  const db = await openCharDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction('characters', 'readonly');
    const store = tx.objectStore('characters');
    const req = store.getAll();
    req.onsuccess = () => resolve(req.result || []);
    req.onerror = () => reject(req.error);
  });
}

async function saveCharacter(char) {
  const db = await openCharDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction('characters', 'readwrite');
    tx.objectStore('characters').put(char);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

async function deleteCharacter(id) {
  const db = await openCharDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction('characters', 'readwrite');
    tx.objectStore('characters').delete(id);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

/* ──────────────────────────────────────────
   Parser — Plain Script → blocks
   ────────────────────────────────────────── */
function parseBlocks(content) {
  if (!content.trim()) return [];
  const lines = content.split('\n');
  const blocks = [];
  const DIALOGUE_RE = /^([^#/\n][^：:]{0,20})[：:](.+)/;
  const COMMAND_RE = /^#(\w[\w.-]*)\s*[:：]\s*(.+)/;
  const COMMENT_RE = /^\s*\/\//;

  for (const raw of lines) {
    const line = raw.trimEnd();
    if (!line || COMMENT_RE.test(line)) continue;

    const cmdMatch = line.match(COMMAND_RE);
    if (cmdMatch) {
      blocks.push({ type: 'command', command: cmdMatch[1].trim(), value: cmdMatch[2].trim() });
      continue;
    }

    const dlgMatch = line.match(DIALOGUE_RE);
    if (dlgMatch) {
      const speaker = dlgMatch[1].trim();
      const text = dlgMatch[2].trim();
      if (speaker === '旁白' || speaker === 'Narrator' || speaker === 'narrator') {
        blocks.push({ type: 'narration', text });
      } else {
        blocks.push({ type: 'dialogue', speaker, text, speakerId: resolveSpeakerId(speaker) });
      }
      continue;
    }

    // Fallback: narration
    blocks.push({ type: 'narration', text: line.trim() });
  }
  return blocks;
}

function parseBlocksJsonl(content) {
  const blocks = [];
  for (const line of content.split('\n')) {
    const trimmed = line.trim();
    if (!trimmed) continue;
    try { blocks.push(JSON.parse(trimmed)); } catch {}
  }
  return blocks;
}

/* ──────────────────────────────────────────
   Reverse parsers — external formats → blocks  (8-G)
   ────────────────────────────────────────── */

/** AVG JSON → blocks  (full fidelity) */
function parseAvgJson(text) {
  try {
    const obj = JSON.parse(text);
    // { title, blocks: [...] }  or bare array
    const arr = Array.isArray(obj) ? obj : (obj.blocks || []);
    return arr.filter(b => b && b.type);
  } catch { return []; }
}

/** TyranoScript .ks → blocks  (best-effort) */
function parseTyranoScript(text) {
  const blocks = [];
  let currentSpeaker = null;
  for (const raw of text.split('\n')) {
    const line = raw.trimEnd();
    if (!line || line === '[p]' || line === '[l]') continue;

    // Speaker tag:  #角色名
    const spk = line.match(/^#(.+)/);
    if (spk && !/^\[/.test(spk[1])) { currentSpeaker = spk[1].trim(); continue; }

    // Commands: [tag key=value ...]
    const tagMatch = line.match(/^\[(\w+)\s*(.*?)\]$/);
    if (tagMatch) {
      const tag = tagMatch[1]; const attrs = tagMatch[2];
      if (tag === 'cm' || tag === 'er') { currentSpeaker = null; continue; }
      if (tag === 'scene') {
        const v = attrs.match(/value="([^"]+)"/);
        blocks.push({ type: 'command', command: 'scene', value: v ? v[1] : attrs });
        continue;
      }
      if (tag === 'playbgm') {
        const s = attrs.match(/storage="([^"]+)"/);
        blocks.push({ type: 'command', command: 'bgm', value: s ? s[1] : attrs });
        continue;
      }
      if (tag === 'playse') {
        const s = attrs.match(/storage="([^"]+)"/);
        blocks.push({ type: 'command', command: 'se', value: s ? s[1] : attrs });
        continue;
      }
      // Generic tag → command
      blocks.push({ type: 'command', command: tag, value: attrs || '' });
      continue;
    }

    // Text line — strip inline [p] [l] [r]
    let cleaned = line.replace(/\[p\]|\[l\]|\[r\]|\[cm\]|\[er\]/g, '').trim();
    if (!cleaned) continue;

    if (currentSpeaker) {
      blocks.push({ type: 'dialogue', speaker: currentSpeaker, text: cleaned });
    } else {
      blocks.push({ type: 'narration', text: cleaned });
    }
  }
  return blocks;
}

/** Exported Markdown → blocks  (best-effort)
 *  Recognises patterns from blocksToMarkdown():
 *    **角色**：台詞
 *    *旁白文字*
 *    `#command: value`
 */
function parseMarkdownScript(text) {
  const blocks = [];
  for (const raw of text.split('\n')) {
    const line = raw.trim();
    if (!line) continue;
    // Skip heading lines
    if (/^#{1,3}\s/.test(line)) continue;
    if (line === '---') continue;

    // Command: `#cmd: val`
    const cmdMatch = line.match(/^`#([\w.-]+)\s*[:：]\s*(.+)`$/);
    if (cmdMatch) {
      blocks.push({ type: 'command', command: cmdMatch[1], value: cmdMatch[2] });
      continue;
    }

    // Dialogue: **speaker**：text  or  **speaker**: text
    const dlgMatch = line.match(/^\*\*(.+?)\*\*\s*[：:]\s*(.+)/);
    if (dlgMatch) {
      const speaker = dlgMatch[1].trim();
      const txt = dlgMatch[2].trim();
      if (speaker === '旁白' || speaker === 'Narrator') {
        blocks.push({ type: 'narration', text: txt });
      } else {
        blocks.push({ type: 'dialogue', speaker, text: txt });
      }
      continue;
    }

    // Narration: *italic text*  (whole line)
    const narrMatch = line.match(/^\*(.+)\*$/);
    if (narrMatch) {
      blocks.push({ type: 'narration', text: narrMatch[1].trim() });
      continue;
    }

    // Fallback narration
    if (line.length > 1) {
      blocks.push({ type: 'narration', text: line });
    }
  }
  return blocks;
}

/** Blocks → Plain Script text  (round-trip core) */
function blocksToPlainScript(blocks) {
  const lines = [];
  for (const b of blocks) {
    if (b.type === 'command') {
      lines.push(`#${b.command}：${b.value}`);
    } else if (b.type === 'narration') {
      lines.push(`旁白：${b.text}`);
    } else if (b.type === 'dialogue') {
      lines.push(`${b.speaker}：${b.text}`);
    }
  }
  return lines.join('\n');
}

/** Detect file format + convert for import */
function importAsPlainScript(text, filename) {
  const ext = (filename || '').toLowerCase();
  let blocks = null;
  let via = '';

  if (ext.endsWith('.blocks.jsonl') || ext.endsWith('.jsonl')) {
    blocks = parseBlocksJsonl(text);
    via = 'blocks.jsonl';
  } else if (ext.endsWith('.ks')) {
    blocks = parseTyranoScript(text);
    via = 'TyranoScript';
  } else if (ext.endsWith('.json')) {
    // Try AVG JSON first
    blocks = parseAvgJson(text);
    via = 'AVG JSON';
    if (!blocks.length) { blocks = null; } // not valid AVG JSON, treat as text
  } else if (ext.endsWith('.md')) {
    blocks = parseMarkdownScript(text);
    via = 'Markdown';
    if (!blocks.length) { blocks = null; }
  }

  if (blocks && blocks.length) {
    return { plainScript: blocksToPlainScript(blocks), blocks, via };
  }
  return null; // no conversion needed, treat as raw Plain Script
}

function resolveSpeakerId(speakerName) {
  for (const c of state.characters) {
    if (c.displayName === speakerName) return c.id;
    if (c.aliases && c.aliases.some(a => a === speakerName)) return c.id;
  }
  return null;
}

/* ──────────────────────────────────────────
   Auto-detect characters from blocks
   ────────────────────────────────────────── */
function detectNewSpeakers(blocks) {
  const known = new Set();
  for (const c of state.characters) {
    known.add(c.displayName);
    if (c.aliases) c.aliases.forEach(a => known.add(a));
  }
  const newSpeakers = new Set();
  for (const b of blocks) {
    if (b.type === 'dialogue' && b.speaker && !known.has(b.speaker)) {
      newSpeakers.add(b.speaker);
    }
  }
  return [...newSpeakers];
}

async function autoRegisterSpeakers(blocks) {
  const newNames = detectNewSpeakers(blocks);
  if (!newNames.length) return false;
  const PALETTE = ['#C9A86A','#6aae7f','#7aa3cc','#c4604f','#b07acc','#cc9a6a','#6accc0','#cc6a8a','#8a8acc','#aab06a'];
  for (const name of newNames) {
    const char = {
      id: 'char_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 6),
      displayName: name,
      aliases: [],
      color: PALETTE[state.characters.length % PALETTE.length],
      createdAt: Date.now(),
    };
    state.characters.push(char);
    await saveCharacter(char);
  }
  return true;
}

/* ──────────────────────────────────────────
   Undo / Redo
   ────────────────────────────────────────── */
let _lastSnapshot = '';
function pushUndo() {
  const cur = editor.value;
  if (cur === _lastSnapshot) return;
  state.undoStack.push(_lastSnapshot);
  if (state.undoStack.length > 100) state.undoStack.shift();
  state.redoStack.length = 0;
  _lastSnapshot = cur;
}
function doUndo() {
  if (!state.undoStack.length) return;
  state.redoStack.push(editor.value);
  editor.value = state.undoStack.pop();
  _lastSnapshot = editor.value;
  onContentChange();
}
function doRedo() {
  if (!state.redoStack.length) return;
  state.undoStack.push(editor.value);
  editor.value = state.redoStack.pop();
  _lastSnapshot = editor.value;
  onContentChange();
}

/* ──────────────────────────────────────────
   Render — Character list
   ────────────────────────────────────────── */
function renderCharList() {
  const el = document.getElementById('char-list');
  if (!state.characters.length) {
    el.innerHTML = '<div class="empty-chars">尚未建立角色卡。<br>編輯器會自動從劇本偵測角色，<br>或點擊「+ 新增」手動建立。</div>';
    return;
  }
  // count lines per speaker
  const counts = {};
  for (const b of state.blocks) {
    if (b.speaker) counts[b.speaker] = (counts[b.speaker] || 0) + 1;
  }

  el.innerHTML = state.characters.map(c => {
    const n = counts[c.displayName] || 0;
    const aliasStr = c.aliases && c.aliases.length ? c.aliases.join(', ') : '';
    return `<div class="char-card" data-id="${c.id}">
      <span class="char-dot" style="background:${c.color || 'var(--gold)'}"></span>
      <div class="char-info">
        <div class="char-name">${esc(c.displayName)}</div>
        ${aliasStr ? `<div class="char-aliases">${esc(aliasStr)}</div>` : ''}
      </div>
      <span class="char-count">${n}</span>
      <div class="char-actions">
        <button data-action="edit" data-id="${c.id}" title="編輯">&#9998;</button>
      </div>
    </div>`;
  }).join('');

  // click to edit
  el.querySelectorAll('[data-action="edit"]').forEach(btn => {
    btn.addEventListener('click', e => { e.stopPropagation(); openCharModal(btn.dataset.id); });
  });
}

/* ──────────────────────────────────────────
   Render — Blocks preview
   ────────────────────────────────────────── */
function renderBlocksPreview() {
  const body = document.getElementById('preview-body');
  if (state.previewTab !== 'blocks') return;
  if (!state.blocks.length) {
    body.innerHTML = '<div class="empty-preview">在左側編輯器輸入劇本後，<br>此處即時顯示解析結果。</div>';
    return;
  }
  body.innerHTML = state.blocks.map((b, i) => {
    const num = `<span class="block-number">#${i + 1}</span>`;
    if (b.type === 'command') {
      return `<div class="block-card command">${num}<span class="block-cmd">#${esc(b.command)}: ${esc(b.value)}</span></div>`;
    }
    if (b.type === 'narration') {
      return `<div class="block-card narration">${num}<div class="block-text" style="font-style:italic;color:var(--text-secondary)">${esc(b.text)}</div></div>`;
    }
    // dialogue
    const color = getCharColor(b.speaker);
    return `<div class="block-card dialogue">${num}
      <div class="block-speaker"><span class="dot" style="background:${color}"></span><span style="color:${color}">${esc(b.speaker)}</span></div>
      <div class="block-text">${esc(b.text)}</div>
      ${b.emotion ? `<div class="block-meta">emotion: ${esc(b.emotion)}</div>` : ''}
    </div>`;
  }).join('');
}

function renderStatsPreview() {
  const body = document.getElementById('preview-body');
  if (state.previewTab !== 'stats') return;

  const total = state.blocks.length;
  const dialogues = state.blocks.filter(b => b.type === 'dialogue').length;
  const narrations = state.blocks.filter(b => b.type === 'narration').length;
  const commands = state.blocks.filter(b => b.type === 'command').length;

  // speaker ranking
  const speakerCounts = {};
  for (const b of state.blocks) {
    if (b.speaker) speakerCounts[b.speaker] = (speakerCounts[b.speaker] || 0) + 1;
  }
  const ranking = Object.entries(speakerCounts).sort((a, b) => b[1] - a[1]);
  const totalChars = state.blocks.reduce((s, b) => s + (b.text || '').length, 0);

  body.innerHTML = `
    <div class="stats-grid">
      <div class="stat-box"><div class="val">${total}</div><div class="lbl">Total Blocks</div></div>
      <div class="stat-box"><div class="val">${dialogues}</div><div class="lbl">Dialogue</div></div>
      <div class="stat-box"><div class="val">${narrations}</div><div class="lbl">Narration</div></div>
      <div class="stat-box"><div class="val">${commands}</div><div class="lbl">Commands</div></div>
    </div>
    <div class="stat-box" style="margin-bottom:12px"><div class="val">${totalChars.toLocaleString()}</div><div class="lbl">Total Characters</div></div>
    <div class="panel-header" style="padding:0 0 6px;border:none"><span>SPEAKER RANKING</span></div>
    ${ranking.map(([name, count], i) => {
      const pct = total ? Math.round(count / dialogues * 100) : 0;
      const color = getCharColor(name);
      return `<div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;font-size:12px">
        <span style="color:var(--text-tertiary);width:16px;text-align:right">${i + 1}.</span>
        <span class="dot" style="background:${color};width:8px;height:8px;border-radius:50%;flex-shrink:0"></span>
        <span style="flex:1;color:var(--text-primary)">${esc(name)}</span>
        <span style="color:var(--text-secondary)">${count}</span>
        <span style="color:var(--text-tertiary)">${pct}%</span>
      </div>`;
    }).join('')}
  `;
}

function getCharColor(speakerName) {
  const c = state.characters.find(c => c.displayName === speakerName || (c.aliases && c.aliases.includes(speakerName)));
  return c ? c.color : 'var(--text-secondary)';
}

function renderLayoutPreview() {
  const body = document.getElementById('preview-body');
  if (state.previewTab !== 'layout') return;
  if (!state.blocks.length) {
    body.innerHTML = '<div class="empty-preview">輸入劇本後，此處顯示排版預覽。<br>版面對應 PDF / DOCX 匯出結果。</div>';
    return;
  }
  const title = state.filename.replace(/\.\w+$/, '') || 'Script';
  let currentScene = '';
  const items = state.blocks.map(b => {
    if (b.type === 'command') {
      if (b.command === 'scene' || b.command === 'location') {
        currentScene = b.value;
        return `<div class="layout-scene">— ${esc(b.value)} —</div>`;
      }
      return `<div class="layout-cmd">[${esc(b.command)}: ${esc(b.value)}]</div>`;
    }
    if (b.type === 'narration') {
      return `<div class="layout-narr">${esc(b.text)}</div>`;
    }
    const color = getCharColor(b.speaker);
    return `<div class="layout-dlg"><span class="lspeaker" style="color:${color}">${esc(b.speaker)}</span><span class="ltext">${esc(b.text)}</span></div>`;
  }).join('\n');

  body.innerHTML = `
    <div class="layout-toolbar">
      <button class="tb" id="btn-layout-print" title="列印 / 另存 PDF">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:12px;height:12px"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
        列印預覽
      </button>
      <button class="tb" id="btn-layout-docx" title="匯出 DOCX">DOCX</button>
      <span class="spacer"></span>
      <span style="font-size:11px;color:var(--text-tertiary)">${state.blocks.length} blocks</span>
    </div>
    <div class="layout-page">
      <div class="layout-title">${esc(title)}</div>
      ${items}
    </div>`;

  // Wire inline buttons
  body.querySelector('#btn-layout-print')?.addEventListener('click', () => doExport('pdf'));
  body.querySelector('#btn-layout-docx')?.addEventListener('click', () => doExport('docx'));
}

function renderPreview() {
  if (state.previewTab === 'blocks') renderBlocksPreview();
  else if (state.previewTab === 'layout') renderLayoutPreview();
  else if (state.previewTab === 'stats') renderStatsPreview();
}

/* ──────────────────────────────────────────
   Character modal
   ────────────────────────────────────────── */
let _editingCharId = null;

function openCharModal(id) {
  _editingCharId = id || null;
  const modal = document.getElementById('char-modal');
  const title = document.getElementById('char-modal-title');
  const nameInput = document.getElementById('char-input-name');
  const aliasInput = document.getElementById('char-input-aliases');
  const colorInput = document.getElementById('char-input-color');
  const colorHex = document.getElementById('char-input-color-hex');
  const delBtn = document.getElementById('char-btn-delete');

  if (id) {
    const c = state.characters.find(x => x.id === id);
    if (!c) return;
    title.textContent = '編輯角色';
    nameInput.value = c.displayName;
    aliasInput.value = (c.aliases || []).join(', ');
    colorInput.value = c.color || '#C9A86A';
    colorHex.value = c.color || '#C9A86A';
    delBtn.style.display = '';
  } else {
    title.textContent = '新增角色';
    nameInput.value = '';
    aliasInput.value = '';
    colorInput.value = '#C9A86A';
    colorHex.value = '#C9A86A';
    delBtn.style.display = 'none';
  }
  modal.style.display = '';
  nameInput.focus();
}

function closeCharModal() {
  document.getElementById('char-modal').style.display = 'none';
  _editingCharId = null;
}

async function saveCharModal() {
  const name = document.getElementById('char-input-name').value.trim();
  if (!name) { toast('請輸入角色名稱'); return; }
  const aliases = document.getElementById('char-input-aliases').value
    .split(/[,，]/).map(s => s.trim()).filter(Boolean);
  const color = document.getElementById('char-input-color').value;

  if (_editingCharId) {
    const c = state.characters.find(x => x.id === _editingCharId);
    if (c) { c.displayName = name; c.aliases = aliases; c.color = color; await saveCharacter(c); }
  } else {
    const c = {
      id: 'char_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 6),
      displayName: name, aliases, color, createdAt: Date.now(),
    };
    state.characters.push(c);
    await saveCharacter(c);
  }
  closeCharModal();
  reparse();
  renderCharList();
  renderPreview();
  toast(_editingCharId ? '角色已更新' : '角色已新增');
}

async function deleteCharFromModal() {
  if (!_editingCharId) return;
  await deleteCharacter(_editingCharId);
  state.characters = state.characters.filter(c => c.id !== _editingCharId);
  closeCharModal();
  reparse();
  renderCharList();
  renderPreview();
  toast('角色已刪除');
}

/* ──────────────────────────────────────────
   Content change handler (debounced parse)
   ────────────────────────────────────────── */
let _parseTimer = null;

function onContentChange() {
  state.content = editor.value;
  state.dirty = true;

  // Update stats
  const lines = state.content.split('\n');
  document.getElementById('line-count').textContent = lines.length + ' 行';
  document.getElementById('char-count').textContent = state.content.length + ' 字';

  // Debounced parse
  clearTimeout(_parseTimer);
  _parseTimer = setTimeout(() => reparse(), 200);
}

async function reparse() {
  if (state.format === 'blocks-jsonl') {
    state.blocks = parseBlocksJsonl(state.content);
  } else {
    state.blocks = parseBlocks(state.content);
  }

  // auto-register new speakers
  const added = await autoRegisterSpeakers(state.blocks);

  // re-resolve speakerIds
  for (const b of state.blocks) {
    if (b.type === 'dialogue' && b.speaker) {
      b.speakerId = resolveSpeakerId(b.speaker);
    }
  }

  document.getElementById('block-count').textContent = state.blocks.length + ' blocks';
  const errCount = state.blocks.filter(b => b.type === 'narration' && !b.text).length;
  const statusEl = document.getElementById('parse-status');
  if (state.blocks.length) {
    statusEl.innerHTML = errCount
      ? `<span class="badge warn">${errCount} empty</span>`
      : `<span class="badge ok">OK</span>`;
  } else {
    statusEl.textContent = '';
  }

  if (added) renderCharList();
  renderPreview();

  // Draft auto-save
  try { localStorage.setItem('script-editor-draft', state.content); } catch {}
}

/* ──────────────────────────────────────────
   Export
   ────────────────────────────────────────── */
async function doExport(fmt) {
  if (!state.blocks.length) { toast('沒有可匯出的 blocks'); return; }
  const title = state.filename.replace(/\.\w+$/, '') || 'script';

  // Send to Table Forge via PostMessage bridge
  if (fmt === 'table') {
    const { blocksToTablePayload, MSG_TYPES, STORAGE_KEY } = await import('../../core/export/bridge.js');
    const payload = blocksToTablePayload(state.blocks, title);
    if (!payload) { toast('無可轉換的對話資料'); return; }
    sessionStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
    window.parent.postMessage({ type: MSG_TYPES.SCRIPT_EDITOR_EXPORT_TO_TABLE }, '*');
    toast('已送往 Table Forge');
    return;
  }

  // Map fmt to export-core dataType:format
  const fmtMap = {
    'jsonl': 'jsonl', 'ks': 'ks', 'avg-json': 'avg-json',
    'md': 'md', 'docx': 'docx', 'pdf': 'pdf',
  };
  const outputFormat = fmtMap[fmt];
  if (!outputFormat) return;

  try {
    const { exportAndDownload } = await import('../../core/export-core.js');
    await exportAndDownload('dialogue', outputFormat, { blocks: state.blocks }, { title });
    toast(`已匯出 ${fmt.toUpperCase()}`);
  } catch (err) {
    console.error('Export error:', err);
    toast('匯出失敗：' + err.message);
  }
}

/* ──────────────────────────────────────────
   File I/O
   ────────────────────────────────────────── */
function openFile(file) {
  const reader = new FileReader();
  reader.onload = () => {
    const text = reader.result;
    state.filename = file.name;
    document.getElementById('filename-display').textContent = file.name;

    // Try round-trip import (8-G): .ks / .jsonl / AVG JSON / MD → Plain Script
    const imported = importAsPlainScript(text, file.name);
    if (imported) {
      state.format = 'plain-script';
      document.getElementById('format-badge').textContent = `Plain Script (← ${imported.via})`;
      editor.value = imported.plainScript;
      toast(`已從 ${imported.via} 匯入 ${imported.blocks.length} blocks`);
    } else {
      state.format = 'plain-script';
      document.getElementById('format-badge').textContent = 'Plain Script';
      editor.value = text;
    }

    _lastSnapshot = editor.value;
    state.undoStack.length = 0;
    state.redoStack.length = 0;
    onContentChange();

    // Notify App Shell
    const ext = file.name.toLowerCase();
    const ftype = ext.endsWith('.jsonl') ? 'jsonl' : ext.endsWith('.ks') ? 'ks' : 'txt';
    window.parent.postMessage({
      type: 'akasha-file-opened',
      entry: { name: file.name, type: ftype, size: file.size, lastOpened: Date.now() }
    }, '*');
  };
  reader.readAsText(file);
}

function newScript() {
  state.filename = 'untitled.txt';
  state.format = 'plain-script';
  document.getElementById('filename-display').textContent = 'untitled.txt';
  document.getElementById('format-badge').textContent = 'Plain Script';
  editor.value = '';
  _lastSnapshot = '';
  state.undoStack.length = 0;
  state.redoStack.length = 0;
  onContentChange();
}

function saveScript() {
  const blob = new Blob([editor.value], { type: 'text/plain;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = state.filename;
  a.click();
  URL.revokeObjectURL(a.href);
  toast('已下載 ' + state.filename);
}

/* ──────────────────────────────────────────
   PostMessage — from App Shell
   ────────────────────────────────────────── */
window.addEventListener('message', async e => {
  const d = e.data;
  if (!d || !d.type) return;

  if (d.type === 'akasha-open-file') {
    state.filename = d.filename || 'untitled.txt';
    document.getElementById('filename-display').textContent = state.filename;

    const text = d.content || '';
    const imported = importAsPlainScript(text, state.filename);
    if (imported) {
      state.format = 'plain-script';
      document.getElementById('format-badge').textContent = `Plain Script (← ${imported.via})`;
      editor.value = imported.plainScript;
    } else {
      state.format = 'plain-script';
      document.getElementById('format-badge').textContent = 'Plain Script';
      editor.value = text;
    }

    _lastSnapshot = editor.value;
    state.undoStack.length = 0;
    state.redoStack.length = 0;
    onContentChange();
  }

  if (d.type === 'akasha-ai-get-context') {
    const truncated = state.content.slice(0, 12000);
    window.parent.postMessage({
      type: 'akasha-ai-context-response',
      module: 'script-editor',
      fileName: state.filename,
      fileType: state.format,
      content: truncated,
      blockCount: state.blocks.length,
      characters: state.characters.map(c => c.displayName),
    }, '*');
  }

  if (d.type === 'akasha-mode-change') {
    document.documentElement.dataset.mode = d.mode;
  }
});

/* ──────────────────────────────────────────
   Toast
   ────────────────────────────────────────── */
function toast(msg) {
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  document.getElementById('toast-container').appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity .3s'; setTimeout(() => el.remove(), 300); }, 2500);
}

/* ──────────────────────────────────────────
   Utilities
   ────────────────────────────────────────── */
function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ──────────────────────────────────────────
   Init + Wiring
   ────────────────────────────────────────── */
const editor = document.getElementById('script-editor');

// Restore draft
const draft = localStorage.getItem('script-editor-draft');
if (draft) { editor.value = draft; _lastSnapshot = draft; }

// Load characters
(async () => {
  try {
    state.characters = await loadCharacters();
  } catch { state.characters = []; }
  renderCharList();
  if (editor.value) onContentChange();
})();

// Editor input
let _undoTimer = null;
editor.addEventListener('input', () => {
  clearTimeout(_undoTimer);
  _undoTimer = setTimeout(pushUndo, 400);
  onContentChange();
});

// Cursor position
editor.addEventListener('click', updateCursor);
editor.addEventListener('keyup', updateCursor);
function updateCursor() {
  const val = editor.value.slice(0, editor.selectionStart);
  const ln = val.split('\n').length;
  const col = val.length - val.lastIndexOf('\n');
  document.getElementById('cursor-pos').textContent = `Ln ${ln}, Col ${col}`;
}

// Keyboard shortcuts
editor.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'z' && !e.shiftKey) { e.preventDefault(); doUndo(); }
  if ((e.ctrlKey || e.metaKey) && (e.key === 'y' || (e.key === 'z' && e.shiftKey))) { e.preventDefault(); doRedo(); }
  if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); saveScript(); }
});

// Toolbar buttons
document.getElementById('btn-new').addEventListener('click', newScript);
document.getElementById('btn-save').addEventListener('click', saveScript);
document.getElementById('btn-undo').addEventListener('click', doUndo);
document.getElementById('btn-redo').addEventListener('click', doRedo);

// File input
document.getElementById('file-input').addEventListener('change', e => {
  if (e.target.files[0]) openFile(e.target.files[0]);
  e.target.value = '';
});

// Export menu
const exportBtn = document.getElementById('btn-export');
const exportMenu = document.getElementById('export-menu');
exportBtn.addEventListener('click', () => exportMenu.classList.toggle('show'));
document.addEventListener('click', e => {
  if (!exportBtn.contains(e.target) && !exportMenu.contains(e.target)) exportMenu.classList.remove('show');
});
exportMenu.querySelectorAll('[data-fmt]').forEach(btn => {
  btn.addEventListener('click', () => { exportMenu.classList.remove('show'); doExport(btn.dataset.fmt); });
});

// Preview tabs
document.querySelectorAll('.preview-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.preview-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    state.previewTab = tab.dataset.tab;
    renderPreview();
  });
});

// Character modal
document.getElementById('btn-add-char').addEventListener('click', () => openCharModal(null));
document.getElementById('char-btn-cancel').addEventListener('click', closeCharModal);
document.getElementById('char-btn-save').addEventListener('click', saveCharModal);
document.getElementById('char-btn-delete').addEventListener('click', deleteCharFromModal);
document.getElementById('char-modal').addEventListener('click', e => { if (e.target === e.currentTarget) closeCharModal(); });

// Color input sync
const colorPicker = document.getElementById('char-input-color');
const colorHex = document.getElementById('char-input-color-hex');
colorPicker.addEventListener('input', () => { colorHex.value = colorPicker.value; });
colorHex.addEventListener('input', () => { if (/^#[0-9a-f]{6}$/i.test(colorHex.value)) colorPicker.value = colorHex.value; });

// Inherit parent mode
try {
  const parentMode = window.parent.document.documentElement.dataset.mode;
  if (parentMode) document.documentElement.dataset.mode = parentMode;
} catch {}

</script>
</body>
</html>
