<!DOCTYPE html>
<html lang="zh-Hant" data-mode="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Script Editor — Akasha Library</title>
<link rel="stylesheet" href="../../assets/styles/shared.css">
<style>
/* ═══════════════════════════════════════════
   Layout Shell
   ═══════════════════════════════════════════ */
html,body{margin:0;height:100%;overflow:hidden}

/* ── Header ── */
header{
  position:sticky;top:0;z-index:20;
  display:flex;align-items:center;gap:8px;
  padding:6px 12px;
  background:var(--navy);border-bottom:1px solid var(--navy-line);
  min-height:42px;flex-shrink:0;
}
header h1{font:600 13px/1 var(--font-display);color:var(--gold);margin:0;white-space:nowrap;letter-spacing:.5px}
header .sep{color:var(--text-tertiary);font-size:11px;margin:0 2px}
.spacer{flex:1}

/* ── Toolbar buttons ── */
.tb{
  display:inline-flex;align-items:center;gap:4px;
  padding:4px 10px;border:1px solid var(--navy-line);border-radius:var(--r-soft);
  background:transparent;color:var(--text-secondary);font-size:12px;
  cursor:pointer;transition:border-color .15s,color .15s;
}
.tb:hover{border-color:var(--gold-dim);color:var(--text-primary)}
.tb.accent{border-color:var(--gold-dim);color:var(--gold)}
.tb.accent:hover{border-color:var(--gold);color:var(--gold-bright)}
.tb svg{width:14px;height:14px;flex-shrink:0}
.file-label{cursor:pointer}
.file-label input{display:none}

/* ═══════════════════════════════════════════
   Tab Bar
   ═══════════════════════════════════════════ */
.tab-bar{
  display:flex;
  background:var(--navy-deep);
  border-bottom:1px solid var(--navy-line);
  overflow-x:auto;flex-shrink:0;
}
.tab-btn{
  flex:0 0 auto;
  padding:9px 20px;
  font:500 12.5px/1 var(--font-display);letter-spacing:.08em;
  color:var(--text-tertiary);
  background:transparent;border:none;
  border-bottom:2px solid transparent;
  cursor:pointer;transition:color .15s,border-color .15s;
  display:flex;align-items:center;gap:6px;
  white-space:nowrap;
}
.tab-btn:hover{color:var(--text-secondary)}
.tab-btn.active{color:var(--gold);border-bottom-color:var(--gold)}
.tab-btn svg{width:14px;height:14px}

@media(max-width:600px){
  .tab-btn{padding:8px 14px;font-size:11.5px}
}

/* ═══════════════════════════════════════════
   Tab Panels
   ═══════════════════════════════════════════ */
.tab-panels{
  flex:1;overflow:hidden;position:relative;
}
.tab-panel{
  position:absolute;inset:0;
  display:none;overflow:hidden;
}
.tab-panel.active{display:flex;flex-direction:column}

/* placeholder shown for unimplemented tabs */
.tab-placeholder{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  color:var(--text-tertiary);font-size:13px;line-height:1.7;text-align:center;
  padding:40px 20px;gap:12px;
}
.tab-placeholder svg{width:36px;height:36px;opacity:.4}

/* ═══════════════════════════════════════════
   Write TAB — 3-column layout
   ═══════════════════════════════════════════ */
.write-layout{
  flex:1;display:grid;
  grid-template-columns:220px 1fr 300px;
  overflow:hidden;
}
@media(max-width:960px){
  .write-layout{grid-template-columns:1fr;grid-template-rows:auto 1fr auto}
  .write-layout .panel-left,.write-layout .panel-right{max-height:35vh;overflow-y:auto}
}

/* ── Characters sidebar ── */
.panel-left{
  background:var(--navy-deep);border-right:1px solid var(--navy-line);
  display:flex;flex-direction:column;overflow:hidden;
}
.panel-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 12px;border-bottom:1px solid var(--navy-line);
  font:600 12px/1 var(--font-display);color:var(--gold);letter-spacing:.5px;
}
.panel-header button{
  padding:2px 8px;border:1px solid var(--navy-line);border-radius:var(--r-soft);
  background:transparent;color:var(--text-secondary);font-size:11px;cursor:pointer;
}
.panel-header button:hover{border-color:var(--gold-dim);color:var(--gold)}

.char-list{flex:1;overflow-y:auto;padding:8px}
.char-card{
  display:flex;align-items:center;gap:8px;
  padding:8px 10px;margin-bottom:4px;border-radius:var(--r-card);
  border:1px solid transparent;cursor:pointer;
  transition:background .15s,border-color .15s;
}
.char-card:hover{background:var(--navy-light);border-color:var(--navy-line)}
.char-card.active{background:var(--navy-light);border-color:var(--gold-dim)}
.char-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.char-info{flex:1;min-width:0}
.char-name{font-size:13px;color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.char-aliases{font-size:11px;color:var(--text-tertiary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.char-count{font-size:11px;color:var(--text-tertiary);flex-shrink:0}
.char-actions{display:flex;gap:2px}
.char-actions button{
  padding:2px 4px;background:transparent;border:none;color:var(--text-tertiary);
  font-size:11px;cursor:pointer;border-radius:2px;
}
.char-actions button:hover{color:var(--gold);background:var(--navy-hover)}
.empty-chars{padding:20px 16px;text-align:center;color:var(--text-tertiary);font-size:12px;line-height:1.6}

/* ── Editor center ── */
.editor-center{
  display:flex;flex-direction:column;overflow:hidden;
  background:var(--navy-deep);
}
.editor-toolbar{
  display:flex;align-items:center;gap:6px;
  padding:6px 12px;border-bottom:1px solid var(--navy-line);
  background:var(--navy);font-size:12px;
}
.editor-toolbar .stat{color:var(--text-tertiary);font-size:11px;margin-left:4px}
.editor-wrap{flex:1;overflow:hidden;display:flex;position:relative}
#script-editor{
  flex:1;resize:none;border:none;outline:none;
  padding:16px 20px;
  font:14px/1.75 var(--font-body);
  color:var(--text-primary);background:transparent;
  tab-size:4;white-space:pre-wrap;word-wrap:break-word;
}
#script-editor::placeholder{color:var(--text-tertiary)}

/* ── Preview sidebar ── */
.panel-right{
  background:var(--navy-deep);border-left:1px solid var(--navy-line);
  display:flex;flex-direction:column;overflow:hidden;
}
.preview-tabs{
  display:flex;border-bottom:1px solid var(--navy-line);background:var(--navy);
}
.preview-tab{
  flex:1;padding:8px 0;text-align:center;
  font-size:12px;color:var(--text-tertiary);
  border:none;background:transparent;cursor:pointer;
  border-bottom:2px solid transparent;
  transition:color .15s,border-color .15s;
}
.preview-tab:hover{color:var(--text-secondary)}
.preview-tab.active{color:var(--gold);border-bottom-color:var(--gold)}
.preview-body{flex:1;overflow-y:auto;padding:12px}
.empty-preview{padding:24px 16px;text-align:center;color:var(--text-tertiary);font-size:12px;line-height:1.6}

/* ── Block cards (preview + editor tab) ── */
.block-card{
  margin-bottom:6px;padding:8px 10px;
  border-radius:var(--r-card);border:1px solid var(--navy-line);
  font-size:13px;line-height:1.55;
}
.block-card.dialogue{background:var(--navy-light)}
.block-card.narration{background:rgba(201,168,106,.06);border-color:var(--gold-line)}
.block-card.scene{background:rgba(106,201,168,.06);border-color:rgba(106,174,127,.25)}
.block-card.command{background:rgba(100,107,120,.08);border-color:rgba(100,107,120,.2)}
.block-card.choice{background:rgba(176,122,204,.06);border-color:rgba(176,122,204,.2)}
.block-card.note{background:rgba(123,142,201,.06);border-color:rgba(123,142,201,.2)}
.block-speaker{
  font-size:12px;font-weight:600;margin-bottom:2px;
  display:flex;align-items:center;gap:6px;
}
.block-speaker .dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.block-text{color:var(--text-primary)}
.block-meta{font-size:11px;color:var(--text-tertiary);margin-top:3px}
.block-cmd{font-family:var(--font-mono);font-size:12px;color:var(--text-secondary)}
.block-number{font-size:10px;color:var(--text-tertiary);float:right;margin-top:2px}

/* ── Tags ── */
.tag{
  display:inline-flex;align-items:center;gap:4px;
  padding:2px 9px;border-radius:10px;
  font-size:11px;letter-spacing:.04em;white-space:nowrap;
  transition:opacity .15s;
}
.tag .tag-remove{
  background:transparent;border:none;color:inherit;cursor:pointer;
  padding:0;opacity:.7;display:flex;font-size:9px;
}

/* ── Stats grid ── */
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.stat-box{
  padding:10px;border-radius:var(--r-card);border:1px solid var(--navy-line);
  background:var(--navy-light);text-align:center;
}
.stat-box .val{font-size:20px;font-weight:600;color:var(--gold);font-family:var(--font-display)}
.stat-box .lbl{font-size:11px;color:var(--text-tertiary);margin-top:2px}

/* ── Voice preview (14-A / 17-2) ── */
.block-play{
  float:right;margin:-2px -4px 0 0;
  padding:2px 6px;border:1px solid var(--navy-line);border-radius:var(--r-soft);
  background:transparent;color:var(--text-tertiary);font-size:11px;cursor:pointer;
  transition:color .15s,border-color .15s;
}
.block-play:hover{color:var(--gold);border-color:var(--gold-dim)}
.block-play.speaking{color:var(--gold);border-color:var(--gold);animation:pulse-voice .8s infinite alternate}
@keyframes pulse-voice{from{opacity:1}to{opacity:.5}}

.voice-panel,.bgm-panel{display:flex;flex-direction:column;gap:10px}
.voice-controls,.bgm-controls{
  display:flex;align-items:center;gap:6px;
  padding:8px 10px;border-radius:var(--r-card);border:1px solid var(--navy-line);
  background:var(--navy-light);
}
.voice-controls button,.bgm-controls button{
  padding:4px 10px;border:1px solid var(--navy-line);border-radius:var(--r-soft);
  background:transparent;color:var(--text-secondary);font-size:12px;cursor:pointer;
  transition:color .15s,border-color .15s;
}
.voice-controls button:hover,.bgm-controls button:hover{color:var(--gold);border-color:var(--gold-dim)}
.voice-controls button.active,.bgm-controls button.active{color:var(--gold);border-color:var(--gold)}
.voice-status,.bgm-status{font-size:11px;color:var(--text-tertiary)}

.voice-settings,.bgm-settings{
  padding:10px;border-radius:var(--r-card);border:1px solid var(--navy-line);
  background:var(--navy-light);
}
.voice-settings label,.bgm-settings label{display:block;font-size:11px;color:var(--text-tertiary);margin-bottom:4px;margin-top:6px}
.voice-settings label:first-child,.bgm-settings label:first-child{margin-top:0}
.voice-settings select,.bgm-settings select,
.voice-settings input[type=range],.bgm-settings input[type=range]{
  width:100%;background:var(--navy-deep);color:var(--text-primary);
  border:1px solid var(--navy-line);border-radius:var(--r-soft);
  padding:4px 6px;font-size:12px;
}
.voice-settings input[type=range],.bgm-settings input[type=range]{
  padding:0;height:20px;cursor:pointer;
}
.voice-range-row{display:flex;align-items:center;gap:8px}
.voice-range-row span{font-size:11px;color:var(--text-secondary);min-width:36px;text-align:right}

.voice-queue-list{max-height:300px;overflow-y:auto}
.voice-queue-item{
  display:flex;align-items:flex-start;gap:6px;
  padding:6px 8px;margin-bottom:3px;
  border-radius:var(--r-soft);font-size:12px;cursor:pointer;
  border:1px solid transparent;
}
.voice-queue-item:hover{background:var(--navy-light)}
.voice-queue-item.current{border-color:var(--gold-dim);background:var(--navy-light)}
.voice-queue-item .vq-speaker{font-weight:600;white-space:nowrap;min-width:60px}
.voice-queue-item .vq-text{color:var(--text-secondary);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.voice-queue-item .vq-num{font-size:10px;color:var(--text-tertiary);min-width:20px}

.preset-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.preset-card{
  padding:10px;border-radius:var(--r-card);border:1px solid var(--navy-line);
  background:var(--navy-deep);cursor:pointer;
  transition:border-color .15s,background .15s;
}
.preset-card:hover{border-color:var(--gold-dim);background:var(--navy-light)}
.preset-card.selected{border-color:var(--gold);background:var(--navy-light)}
.preset-card .pc-name{font-size:12px;font-weight:600;color:var(--text-primary);margin-bottom:2px}
.preset-card .pc-inst{font-size:11px;color:var(--gold-dim)}
.preset-card .pc-mood{font-size:10px;color:var(--text-tertiary);margin-top:2px}

.score-preview{
  padding:10px;border-radius:var(--r-card);border:1px solid var(--navy-line);
  background:var(--navy-deep);
}
.score-preview-title{font-size:11px;color:var(--text-tertiary);margin-bottom:6px}
.score-timeline{position:relative;height:60px;overflow:hidden;border-radius:4px;background:rgba(0,0,0,.2)}
.score-note{
  position:absolute;border-radius:2px;min-width:4px;
  background:var(--gold-dim);opacity:.7;
}
.score-meta{display:flex;gap:12px;margin-top:6px;font-size:10px;color:var(--text-tertiary)}

/* Slot badge on character cards */
.char-slot-badge{
  display:inline-block;font-size:9px;padding:1px 5px;
  background:var(--gold-deep);color:var(--cream);
  border-radius:3px;margin-left:4px;font-family:var(--font-mono);
  vertical-align:middle;letter-spacing:.5px;
}

/* ═══════════════════════════════════════════
   Editor TAB — block card list + side panel
   ═══════════════════════════════════════════ */
.editor-layout{
  flex:1;display:grid;
  grid-template-columns:1fr 320px;
  overflow:hidden;
}
.editor-block-list{
  flex:1;overflow-y:auto;padding:12px 16px;
  background:var(--navy-deep);
}
.editor-side-panel{
  background:var(--navy);border-left:1px solid var(--navy-line);
  display:flex;flex-direction:column;overflow-y:auto;padding:12px;
}
@media(max-width:800px){
  .editor-layout{grid-template-columns:1fr}
  .editor-side-panel{display:none}
}

/* Editor toolbar */
.editor-bar{
  display:flex;align-items:center;gap:6px;
  padding:8px 4px;margin-bottom:12px;
  border-bottom:1px solid var(--navy-line);
  position:sticky;top:-12px;background:var(--navy-deep);z-index:5;
}
.editor-bar .bar-label{font-size:11px;color:var(--text-tertiary)}
.editor-bar-add{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.bar-add-btn{
  padding:3px 8px;font-size:11px;
  background:transparent;border:1px solid var(--navy-line);
  border-radius:var(--r-soft);cursor:pointer;
  transition:border-color .15s;
}
.bar-add-btn:hover{border-color:var(--gold-dim)}
.bar-btn{
  padding:4px 10px;font-size:11.5px;
  background:transparent;border:1px solid var(--gold-line);
  color:var(--gold-dim);border-radius:var(--r-soft);cursor:pointer;
}
.bar-btn:hover{color:var(--gold);border-color:var(--gold)}
.editor-bar-stat{font-size:11px;color:var(--text-tertiary);margin-left:8px}

/* Block edit card */
.block-edit-card{
  background:var(--navy-light);
  border:1px solid var(--navy-hover);
  margin-bottom:10px;padding:12px 14px;
  transition:border-color .16s,background .16s;
}
.block-edit-card.focused{background:rgba(201,168,106,.04);border-color:var(--gold-line)}
.block-edit-card.errored{background:rgba(196,96,79,.04);border-color:rgba(196,96,79,.3)}

.bc-header{
  display:flex;align-items:center;gap:10px;margin-bottom:10px;
  font-size:11.5px;
}
.bc-type{font-family:var(--font-display);letter-spacing:.12em;text-transform:uppercase;font-size:11px}
.bc-id{font-family:var(--font-mono);font-size:10px;color:var(--text-tertiary);opacity:.65}
.bc-header button{
  padding:3px 7px;background:transparent;
  border:1px solid var(--navy-line);border-radius:2px;
  color:var(--text-tertiary);font-size:11px;cursor:pointer;
}
.bc-header button:hover{color:var(--gold);border-color:var(--gold-dim)}
.bc-header .bc-remove:hover{color:var(--danger);border-color:var(--danger)}

.bc-textarea,.bc-input{
  width:100%;box-sizing:border-box;
  background:var(--navy-deep);border:1px solid var(--navy-line);
  color:var(--cream);padding:6px 8px;margin-bottom:4px;
  font:13px/1.5 var(--font-body);
  border-radius:2px;outline:none;
  transition:border-color .16s;resize:vertical;
}
.bc-textarea:focus,.bc-input:focus{border-color:var(--gold-line)}
.bc-input.mono{font-family:var(--font-mono);font-size:11.5px}
.bc-input.short{max-width:140px}

.bc-speaker{
  background:var(--navy-deep);border:1px solid var(--navy-line);
  color:var(--cream);padding:3px 22px 3px 8px;
  font:12px var(--font-body);border-radius:2px;cursor:pointer;
}

.bc-err{
  padding:5px 10px;margin-bottom:8px;
  background:rgba(196,96,79,.1);border:1px solid rgba(196,96,79,.25);
  border-radius:2px;font:10.5px/1.6 var(--font-mono);
  color:var(--danger);letter-spacing:.02em;
}

.bc-cmd-row,.bc-choice-row{display:flex;gap:6px;align-items:center;margin-bottom:4px}
.bc-cmd-row .bc-input,.bc-choice-row .bc-input{margin-bottom:0}
.bc-opt-remove{
  padding:2px 6px;background:transparent;border:1px solid var(--navy-line);
  border-radius:2px;color:var(--text-tertiary);font-size:11px;cursor:pointer;
}
.bc-opt-remove:hover{color:var(--danger);border-color:var(--danger)}
.bc-opt-add{
  padding:3px 10px;background:transparent;border:1px dashed var(--navy-line);
  border-radius:2px;color:var(--text-tertiary);font-size:11px;cursor:pointer;
  margin-top:4px;
}
.bc-opt-add:hover{border-color:var(--gold-dim);color:var(--gold-dim)}

.bc-tag-row{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;align-items:center}
.bc-tag-add{
  padding:2px 10px;border-radius:2px;
  background:transparent;border:1px dashed var(--navy-line);
  color:var(--text-tertiary);font-size:11px;cursor:pointer;
}
.bc-tag-add:hover{border-color:var(--gold-dim);color:var(--gold-dim)}

.tag-adder-inline{display:inline-flex;align-items:center;gap:4px}
.tag-adder-inline .ta-kind{
  background:var(--navy-deep);border:1px solid var(--navy-line);
  color:var(--cream);padding:3px 6px;font:10.5px var(--font-mono);
  border-radius:2px;cursor:pointer;
}
.tag-adder-inline .ta-text{
  width:90px;background:var(--navy-deep);border:1px solid var(--gold-line);
  color:var(--cream);padding:3px 6px;font-size:11.5px;border-radius:2px;outline:none;
}
.tag-adder-inline .ta-add{
  background:var(--gold-glow);border:1px solid var(--gold-line);
  color:var(--gold);padding:2px 8px;border-radius:2px;font-size:10.5px;cursor:pointer;
}
.tag-adder-inline .ta-close{
  background:transparent;border:1px solid var(--navy-line);
  color:var(--text-tertiary);padding:2px 6px;border-radius:2px;font-size:10.5px;cursor:pointer;
}

/* Side panel */
.side-section{margin-bottom:18px}
.side-section-title{
  font:600 11px/1 var(--font-display);color:var(--gold-dim);
  letter-spacing:.14em;text-transform:uppercase;
  margin-bottom:8px;padding-bottom:4px;
  border-bottom:1px solid var(--navy-line);
}
.side-empty{padding:40px 16px;text-align:center;color:var(--text-tertiary)}
.side-empty-title{font:600 12px var(--font-display);color:var(--gold);margin-bottom:8px;letter-spacing:.1em}
.side-empty-msg{font-size:11.5px;line-height:1.7}

.avg-field{margin-bottom:10px}
.avg-label{
  font:10px var(--font-display);letter-spacing:.14em;color:var(--text-tertiary);
  text-transform:uppercase;margin-bottom:3px;
  display:flex;align-items:center;justify-content:space-between;
}
.avg-import{
  background:transparent;border:1px solid var(--navy-line);
  color:var(--gold-dim);padding:2px 8px;font-size:9.5px;
  border-radius:2px;cursor:pointer;letter-spacing:.1em;
}
.avg-import:hover{color:var(--gold);border-color:var(--gold-dim)}
.avg-input{
  width:100%;box-sizing:border-box;
  background:var(--navy-deep);border:1px solid var(--navy-line);
  color:var(--cream);padding:6px 8px;font:11.5px var(--font-body);
  border-radius:2px;outline:none;
}
.avg-input.mono{font-family:var(--font-mono)}
.avg-input:focus{border-color:var(--gold-line)}

.avg-sprite-preview{
  margin-top:6px;padding:4px 8px;
  border:1px solid var(--navy-line);border-radius:2px;
  background:var(--navy-deep);
  display:flex;align-items:center;gap:8px;
}
.avg-sprite-preview img{height:36px;border-radius:2px}
.avg-sprite-preview span{font:9.5px var(--font-mono);color:var(--text-tertiary)}
.avg-sprite-preview button{
  margin-left:auto;background:transparent;border:none;
  color:var(--text-tertiary);cursor:pointer;padding:2px;font-size:12px;
}

.avg-pos-row{display:flex;gap:4px}
.avg-pos{
  flex:1;padding:5px 0;background:var(--navy-deep);
  border:1px solid var(--navy-line);color:var(--text-secondary);
  font:10.5px var(--font-mono);cursor:pointer;border-radius:2px;
  transition:all .14s;
}
.avg-pos.active{background:var(--gold-glow);border-color:var(--gold-line);color:var(--gold-bright)}

/* Sprite preview (16:9) */
.sprite-preview{
  width:100%;aspect-ratio:16/9;
  background:linear-gradient(180deg,#1a1e2a 0%,#0d1119 100%);
  border:1px solid var(--navy-line);border-radius:2px;
  position:relative;overflow:hidden;margin-bottom:8px;
}
.sp-bg-label{
  position:absolute;top:6px;left:8px;
  font:9.5px var(--font-mono);color:var(--text-tertiary);
  opacity:.7;letter-spacing:.06em;
}
.sp-sprite-wrap{
  position:absolute;bottom:0;transform:translateX(-50%);
  height:75%;display:flex;flex-direction:column;
  align-items:center;justify-content:flex-end;
}
.sp-sprite-wrap img{max-height:85%;max-width:80vw;object-fit:contain;border-radius:2px;margin-bottom:4px}
.sp-placeholder{
  width:44px;height:44px;border-radius:50%;
  border:2px solid var(--navy-line);
  display:flex;align-items:center;justify-content:center;
  font:700 14px var(--font-serif-tc);color:var(--navy-deep);
  margin-bottom:6px;
}
.sp-sprite-name{font:9px var(--font-mono);color:var(--gold-dim);letter-spacing:.04em;text-align:center;white-space:nowrap}
.sp-position{font:8px var(--font-mono);color:var(--text-tertiary);opacity:.6;margin-top:2px}
.sp-indicators{
  position:absolute;bottom:6px;right:8px;
  display:flex;flex-direction:column;gap:3px;align-items:flex-end;
}
.sp-indicators span{font:8.5px var(--font-mono);color:var(--gold-dim);opacity:.8}
.sp-aspect{position:absolute;bottom:6px;left:8px;font:8px var(--font-mono);color:var(--text-tertiary);opacity:.4}

/* JSON preview */
.json-preview{
  margin:0;padding:10px 12px;
  background:var(--navy-deep);border:1px solid var(--navy-line);
  border-radius:2px;
  font:10.5px/1.6 var(--font-mono);color:var(--cream-dim);
  letter-spacing:.02em;overflow:auto;
  max-height:240px;white-space:pre-wrap;word-break:break-all;
}

/* ═══════════════════════════════════════════
   Search TAB
   ═══════════════════════════════════════════ */
.search-layout-inner{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative}
.search-filters{
  display:grid;
  grid-template-columns:2fr 1fr 1fr 1fr 1fr 1fr auto;
  gap:6px;align-items:center;
  padding:10px 16px;border-bottom:1px solid var(--navy-line);
  background:var(--navy);position:sticky;top:0;z-index:10;
}
.search-filters input,.search-filters select{
  padding:5px 10px;
  background:var(--navy-deep);border:1px solid var(--navy-line);border-radius:var(--r-soft);
  color:var(--text-primary);font-size:12px;font-family:inherit;
}
.search-filters input:focus,.search-filters select:focus{outline:none;border-color:var(--gold-dim)}
.search-clear{
  padding:5px 12px;background:transparent;border:none;
  color:var(--text-secondary);font:12px var(--font-serif-tc);
  letter-spacing:.1em;cursor:pointer;
}
.search-clear:hover{color:var(--gold)}
@media(max-width:900px){
  .search-filters{grid-template-columns:1fr 1fr;gap:8px}
}

.search-meta{
  padding:12px 28px 6px;
  font:12.5px var(--font-serif-tc);color:var(--text-secondary);letter-spacing:.06em;
  display:flex;align-items:baseline;gap:10px;
}
.search-meta .result-count{
  font:italic 17px var(--font-serif-en);color:var(--gold);
}
.search-results{flex:1;overflow-y:auto;padding:8px 28px 80px;background:var(--navy-deep)}

.result-card{
  background:var(--navy-light);border:1px solid var(--navy-hover);
  border-left:3px solid var(--gold-dim);
  margin-bottom:12px;overflow:hidden;cursor:pointer;
  transition:all .2s;
}
.result-card:hover{
  border-left-color:var(--gold);
  transform:translateY(-1px);box-shadow:var(--shadow-lift);
}
.rc-header{
  padding:10px 18px;display:flex;align-items:center;gap:10px;
  border-bottom:1px solid var(--navy-line);background:var(--navy);
  font-size:11.5px;
}
.rc-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.rc-speaker{font:12.5px var(--font-serif-tc);color:var(--cream-dim)}
.rc-speaker-en{font:italic 11px var(--font-serif-en);color:var(--gold-dim)}
.rc-type{font:11px var(--font-display);letter-spacing:.12em;color:var(--gold-dim);text-transform:uppercase}
.rc-idx,.rc-id{font:10px var(--font-mono);color:var(--text-tertiary);opacity:.7}
.rc-body{padding:14px 18px 16px}
.rc-original{font:italic 14px/1.7 var(--font-serif-en);color:var(--cream);margin-bottom:4px}
.rc-zh{font:13px/1.7 var(--font-body);color:var(--cream);opacity:.85;margin-bottom:10px;letter-spacing:.04em}
.rc-narr{font:italic 13px/1.7 var(--font-serif-tc);color:var(--text-secondary)}
.rc-scene{font:13px var(--font-display);color:var(--gold);letter-spacing:.08em}
.rc-choice{font:13px/1.7 var(--font-body);color:var(--text-primary)}
.rc-choice div{margin-bottom:3px}
.rc-cmd{font:12px var(--font-mono);color:var(--text-secondary)}
.rc-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}

.search-empty{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;padding:60px 20px;color:var(--text-tertiary);text-align:center;
}
.search-empty-icon{
  width:60px;height:60px;border:1px solid var(--gold-line);
  display:flex;align-items:center;justify-content:center;color:var(--gold-deep);
}
.search-empty-latin{
  font:11px var(--font-display);letter-spacing:.34em;color:var(--gold-deep);text-transform:uppercase;
}
.search-empty-zh{
  font:13.5px var(--font-serif-tc);color:var(--text-secondary);letter-spacing:.06em;
}

.search-export-bar{
  position:absolute;left:0;right:0;bottom:0;z-index:20;
  background:rgba(17,21,29,.94);backdrop-filter:blur(8px);
  border-top:1px solid var(--gold-line);
  padding:10px 28px;
  display:flex;align-items:center;gap:8px;
}
.search-export-bar .bar-label{font:11px var(--font-display);letter-spacing:.12em;color:var(--gold-dim)}
.search-export-bar button{
  padding:5px 12px;background:transparent;border:1px solid var(--navy-line);
  color:var(--text-secondary);font:12px var(--font-serif-tc);
  border-radius:var(--r-soft);cursor:pointer;letter-spacing:.08em;
}
.search-export-bar button:hover{color:var(--gold);border-color:var(--gold-dim)}
.search-export-bar button.bar-btn-accent{background:var(--gold-glow);border-color:var(--gold);color:var(--gold-bright)}

/* ═══════════════════════════════════════════
   Reader TAB
   ═══════════════════════════════════════════ */
.reader-layout{flex:1;display:grid;grid-template-columns:180px 1fr;overflow:hidden}
.reader-toc{
  background:var(--navy);border-right:1px solid var(--navy-line);
  overflow-y:auto;padding:12px;font-size:12px;
}
.reader-toc-item{
  display:block;padding:4px 8px;margin-bottom:2px;border-radius:var(--r-soft);
  color:var(--text-tertiary);text-decoration:none;cursor:pointer;
  transition:color .15s,background .15s;
}
.reader-toc-item:hover{color:var(--text-primary);background:var(--navy-light)}
.reader-toc-item.active{color:var(--gold);background:var(--navy-light)}
.reader-body{
  flex:1;overflow-y:auto;padding:32px 40px;
  background:var(--navy-deep);max-width:700px;margin:0 auto;
}
@media(max-width:700px){
  .reader-layout{grid-template-columns:1fr}
  .reader-toc{display:none}
  .reader-body{padding:20px 16px}
}

/* ── Layout / print-style pages ── */
.layout-page{
  background:var(--navy-light);border:1px solid var(--navy-line);border-radius:var(--r-card);
  padding:28px 24px 32px;margin-bottom:12px;
  font-family:var(--font-body);font-size:13px;line-height:1.85;min-height:200px;
  box-shadow:0 2px 8px rgba(0,0,0,.18);
}
.layout-title{
  text-align:center;font:600 16px/1.4 var(--font-display);color:var(--gold);
  margin-bottom:16px;padding-bottom:10px;border-bottom:1px solid var(--gold-line);letter-spacing:.5px;
}
.layout-scene{text-align:center;font-size:11px;color:var(--gold-dim);margin:14px 0 8px;letter-spacing:1px;text-transform:uppercase}
.layout-dlg{margin-bottom:8px;padding-left:20px;text-indent:-20px}
.layout-dlg .lspeaker{font-weight:700;margin-right:6px;display:inline}
.layout-dlg .ltext{display:inline;color:var(--text-primary)}
.layout-narr{margin:10px 0;padding:6px 16px;font-style:italic;color:var(--text-secondary);border-left:2px solid var(--gold-line)}
.layout-cmd{margin:6px 0;text-align:right;font-family:var(--font-mono);font-size:11px;color:var(--text-tertiary)}

/* ═══════════════════════════════════════════
   Status Bar (shared)
   ═══════════════════════════════════════════ */
.status-bar{
  display:flex;align-items:center;gap:8px;
  padding:4px 12px;border-top:1px solid var(--navy-line);
  background:var(--navy);font-size:11px;color:var(--text-tertiary);
  flex-shrink:0;
}
.status-bar .badge{
  padding:1px 6px;border-radius:var(--r-sharp);
  background:var(--navy-light);color:var(--text-secondary);font-size:10px;
}
.status-bar .badge.ok{color:var(--success)}
.status-bar .badge.warn{color:var(--gold)}
.shortcut-hints{display:flex;gap:6px;overflow:hidden}
.shortcut-hints span{
  padding:1px 6px;border-radius:3px;
  background:var(--navy-light);color:var(--text-tertiary);font-size:10px;
  white-space:nowrap;
}

/* ═══════════════════════════════════════════
   Character Modal
   ═══════════════════════════════════════════ */
.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:100;
  display:flex;align-items:center;justify-content:center;
}
.modal-box{
  background:var(--navy);border:1px solid var(--navy-line);border-radius:var(--r-card);
  padding:20px;width:340px;max-width:90vw;box-shadow:var(--shadow-lift);
}
.modal-box h3{margin:0 0 14px;font:600 14px/1 var(--font-display);color:var(--gold)}
.modal-box label{display:block;font-size:12px;color:var(--text-secondary);margin-bottom:4px;margin-top:10px}
.modal-box input{
  width:100%;padding:6px 8px;
  background:var(--navy-deep);border:1px solid var(--navy-line);border-radius:var(--r-soft);
  color:var(--text-primary);font-size:13px;font-family:inherit;box-sizing:border-box;
}
.modal-box input:focus{outline:none;border-color:var(--gold-dim)}
.modal-box .color-row{display:flex;align-items:center;gap:8px}
.modal-box .color-row input[type="color"]{width:32px;height:28px;padding:0;border:none;cursor:pointer;background:none}
.modal-box .btn-row{display:flex;gap:8px;margin-top:16px;justify-content:flex-end}
.modal-box .btn-row button{
  padding:6px 16px;border-radius:var(--r-soft);font-size:12px;
  border:1px solid var(--navy-line);background:transparent;color:var(--text-secondary);cursor:pointer;
}
.modal-box .btn-row button.primary{background:var(--gold-deep);color:var(--cream);border-color:var(--gold-dim)}
.modal-box .btn-row button.danger{color:var(--danger);border-color:var(--danger)}

/* ═══════════════════════════════════════════
   Export Dropdown
   ═══════════════════════════════════════════ */
.export-wrap{position:relative;display:inline-flex}
.export-menu{
  position:absolute;top:100%;right:0;z-index:50;
  min-width:180px;padding:4px;
  background:var(--navy);border:1px solid var(--navy-line);border-radius:var(--r-card);
  box-shadow:var(--shadow-lift);display:none;
}
.export-menu.show{display:block}
.export-menu button{
  display:block;width:100%;text-align:left;
  padding:7px 12px;border:none;background:transparent;
  color:var(--text-secondary);font-size:12px;border-radius:var(--r-soft);cursor:pointer;
}
.export-menu button:hover{background:var(--navy-light);color:var(--text-primary)}
.export-menu .menu-divider{height:1px;background:var(--navy-line);margin:4px 0}

/* ═══════════════════════════════════════════
   Toast
   ═══════════════════════════════════════════ */
#toast-container{
  position:fixed;bottom:16px;right:16px;z-index:200;
  display:flex;flex-direction:column;gap:6px;
}
.toast{
  padding:8px 16px;border-radius:var(--r-card);
  background:var(--navy);border:1px solid var(--gold-dim);
  color:var(--cream-dim);font-size:12px;
  box-shadow:var(--shadow-card);animation:fadeInUp .25s ease;
}
@keyframes fadeInUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* ═══════════════════════════════════════════
   Outer app structure
   ═══════════════════════════════════════════ */
.app-shell{
  display:flex;flex-direction:column;height:100vh;overflow:hidden;
}
</style>
</head>
<body>
<div class="app-shell">

<!-- ═══════ Header ═══════ -->
<header>
  <h1>SCRIPT EDITOR</h1>
  <span class="sep">/</span>
  <span style="font-size:11px;color:var(--text-tertiary)" id="filename-display">untitled</span>
  <span class="spacer"></span>

  <label class="tb file-label" title="開啟劇本檔案">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
      stroke-linecap="round" stroke-linejoin="round">
      <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/>
      <path d="M14 2v6h6"/>
    </svg>
    開啟
    <input type="file" id="file-input" accept=".txt,.md,.blocks.jsonl,.jsonl,.ks,.json">
  </label>

  <button class="tb" id="btn-new" title="新建劇本">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
      stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 5v14M5 12h14"/>
    </svg>
    新建
  </button>

  <button class="tb" id="btn-save" title="下載 Plain Script">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
      stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
      <polyline points="7 10 12 15 17 10"/>
      <line x1="12" y1="15" x2="12" y2="3"/>
    </svg>
    儲存
  </button>

  <div class="export-wrap">
    <button class="tb accent" id="btn-export" title="匯出">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
        stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 12v8a2 2 0 002 2h12a2 2 0 002-2v-8"/>
        <polyline points="16 6 12 2 8 6"/>
        <line x1="12" y1="2" x2="12" y2="15"/>
      </svg>
      匯出
    </button>
    <div class="export-menu" id="export-menu">
      <button data-fmt="jsonl">blocks.jsonl</button>
      <button data-fmt="ks">TyranoScript .ks</button>
      <button data-fmt="avg-json">AVG JSON</button>
      <div class="menu-divider"></div>
      <button data-fmt="md">Markdown</button>
      <button data-fmt="docx">DOCX (劇本版面)</button>
      <button data-fmt="pdf">PDF 預覽 (HTML)</button>
      <div class="menu-divider"></div>
      <button data-fmt="table">送到 Table Forge</button>
    </div>
  </div>
</header>

<!-- ═══════ Tab Bar ═══════ -->
<nav class="tab-bar" id="tab-bar">
  <button class="tab-btn active" data-tab="write">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
      stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 2c-2 0-7 1-9 5-1 2-1.5 4-1.5 6H7l-2 4.5L3 22h2l1.5-3H12c0-2 .5-4 1.5-6 2-4 5-5 7-5l1-1c0-2-1-5-1.5-5z"/>
    </svg>
    速寫 Write
  </button>
  <button class="tab-btn" data-tab="editor">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
      stroke-linecap="round" stroke-linejoin="round">
      <path d="M16 4l4 4-12 12H4v-4z"/>
    </svg>
    編輯 Editor
  </button>
  <button class="tab-btn" data-tab="search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
      stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="7"/><path d="M16 16l4 4"/>
    </svg>
    搜尋 Search
  </button>
  <button class="tab-btn" data-tab="reader">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
      stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 4h7a3 3 0 013 3v13a2 2 0 00-2-2H4zM20 4h-7a3 3 0 00-3 3v13a2 2 0 012-2h8z"/>
    </svg>
    閱讀 Reader
  </button>
</nav>

<!-- ═══════ Tab Panels ═══════ -->
<div class="tab-panels" id="tab-panels">

  <!-- ── Write TAB ── -->
  <section id="tab-write" class="tab-panel active">
    <div class="write-layout">
      <!-- Characters sidebar -->
      <aside class="panel-left">
        <div class="panel-header">
          <span>CHARACTERS</span>
          <button id="btn-add-char">+ 新增</button>
        </div>
        <div class="char-list" id="char-list">
          <div class="empty-chars">
            尚未建立角色卡。<br>
            編輯器會自動偵測角色，<br>
            或點擊「+ 新增」手動建立。
          </div>
        </div>
      </aside>

      <!-- Editor center -->
      <section class="editor-center">
        <div class="editor-toolbar">
          <button class="tb" id="btn-undo" title="復原 (Ctrl+Z)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
              stroke-linecap="round" stroke-linejoin="round">
              <polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 102.13-9.36L1 10"/>
            </svg>
          </button>
          <button class="tb" id="btn-redo" title="重做 (Ctrl+Y)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
              stroke-linecap="round" stroke-linejoin="round">
              <polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 11-2.13-9.36L23 10"/>
            </svg>
          </button>
          <span class="stat" id="line-count">0 行</span>
          <span class="stat" id="block-count">0 blocks</span>
          <span class="spacer"></span>
          <span class="stat" id="char-count">0 字</span>
        </div>
        <div class="editor-wrap">
          <textarea id="script-editor"
            placeholder="在此輸入劇本...&#10;&#10;格式範例：&#10;角色名：台詞內容&#10;旁白：場景描述&#10;#scene：場景名稱&#10;// 這是註解"
            spellcheck="false"></textarea>
        </div>
      </section>

      <!-- Preview sidebar -->
      <aside class="panel-right">
        <div class="preview-tabs">
          <button class="preview-tab active" data-preview="blocks">Blocks</button>
          <button class="preview-tab" data-preview="layout">版面</button>
          <button class="preview-tab" data-preview="stats">統計</button>
          <button class="preview-tab" data-preview="voice">試聽</button>
          <button class="preview-tab" data-preview="bgm">BGM</button>
        </div>
        <div class="preview-body" id="preview-body">
          <div class="empty-preview">
            在左側編輯器輸入劇本後，<br>
            此處即時顯示解析結果。
          </div>
        </div>
      </aside>
    </div>
  </section>

  <!-- ── Editor TAB ── -->
  <section id="tab-editor" class="tab-panel">
    <div class="editor-layout">
      <div class="editor-block-list" id="editor-block-list"></div>
      <aside class="editor-side-panel" id="editor-side-panel"></aside>
    </div>
  </section>

  <!-- ── Search TAB ── -->
  <section id="tab-search" class="tab-panel">
    <div id="search-panel" style="flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative"></div>
  </section>

  <!-- ── Reader TAB ── -->
  <section id="tab-reader" class="tab-panel">
    <div class="tab-placeholder">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
        stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 4h7a3 3 0 013 3v13a2 2 0 00-2-2H4zM20 4h-7a3 3 0 00-3 3v13a2 2 0 012-2h8z"/>
      </svg>
      閱讀模式<br>
      <span style="font-size:11px">Phase 17-5 · 連續排版、目錄、分歧選項</span>
    </div>
  </section>

</div><!-- /tab-panels -->

<!-- ═══════ Status Bar ═══════ -->
<footer class="status-bar" id="status-bar">
  <span id="format-badge" class="badge">Plain Script</span>
  <span id="parse-status"></span>
  <span class="spacer"></span>
  <span class="shortcut-hints" id="shortcut-hints"></span>
  <span id="cursor-pos">Ln 1, Col 1</span>
</footer>

</div><!-- /app-shell -->

<!-- ═══════ Character Modal ═══════ -->
<div class="modal-overlay" id="char-modal" style="display:none">
  <div class="modal-box">
    <h3 id="char-modal-title">新增角色</h3>
    <label>顯示名稱 *</label>
    <input id="char-input-name" placeholder="例：零韻">
    <label>別名（逗號分隔）</label>
    <input id="char-input-aliases" placeholder="例：Rein, れいいん">
    <label>代表色</label>
    <div class="color-row">
      <input type="color" id="char-input-color" value="#C9A86A">
      <input id="char-input-color-hex" placeholder="#C9A86A" style="flex:1">
    </div>
    <div class="btn-row">
      <button id="char-btn-delete" class="danger" style="display:none">刪除</button>
      <span style="flex:1"></span>
      <button id="char-btn-cancel">取消</button>
      <button id="char-btn-save" class="primary">儲存</button>
    </div>
  </div>
</div>

<div id="toast-container"></div>

<!-- ═══════ Module Script ═══════ -->
<script type="module">
import {
  AppState, Bus, ShortcutManager, Storage,
  esc, debounce, downloadFile, generateId, icon,
  parsePlainScript, blocksToPlainScript, importBlocks,
  validateBlock, validateBlocks,
  loadCharacters, saveCharacter, deleteCharacter,
  resolveCharacterId, getCharColor, detectNewSpeakers, autoRegisterSpeakers,
  BLOCK_TYPES, TAG_PALETTE, TAG_CATEGORIES, ICONS,
} from './data-model.js';

import {
  renderVoicePreview, renderBgmPreview, renderCharListWithSlots,
} from './write-tab.js';

import { initEditorTab } from './editor-tab.js';
import { initSearchTab } from './search-tab.js';

/* ──────────────────────────────────────────
   DOM Refs
   ────────────────────────────────────────── */
const $editor       = document.getElementById('script-editor');
const $filenameDisp = document.getElementById('filename-display');
const $charList     = document.getElementById('char-list');
const $previewBody  = document.getElementById('preview-body');
const $lineCount    = document.getElementById('line-count');
const $blockCount   = document.getElementById('block-count');
const $charCount    = document.getElementById('char-count');
const $cursorPos    = document.getElementById('cursor-pos');
const $formatBadge  = document.getElementById('format-badge');
const $parseStatus  = document.getElementById('parse-status');
const $shortcutBar  = document.getElementById('shortcut-hints');
const $toastBox     = document.getElementById('toast-container');

/* ──────────────────────────────────────────
   Toast
   ────────────────────────────────────────── */
function toast(msg) {
  const el = document.createElement('div');
  el.className = 'toast'; el.textContent = msg;
  $toastBox.appendChild(el);
  setTimeout(() => {
    el.style.opacity = '0'; el.style.transition = 'opacity .3s';
    setTimeout(() => el.remove(), 300);
  }, 2500);
}

/* ──────────────────────────────────────────
   Tab Switching
   ────────────────────────────────────────── */
const $tabBtns   = document.querySelectorAll('#tab-bar .tab-btn');
const $tabPanels = document.querySelectorAll('#tab-panels .tab-panel');

function switchTab(tabId) {
  AppState.set('activeTab', tabId);
  $tabBtns.forEach(b => b.classList.toggle('active', b.dataset.tab === tabId));
  $tabPanels.forEach(p => p.classList.toggle('active', p.id === 'tab-' + tabId));
  Bus.emit('tab:switched', tabId);
}

document.getElementById('tab-bar').addEventListener('click', e => {
  const btn = e.target.closest('.tab-btn');
  if (btn) switchTab(btn.dataset.tab);
});

/* ──────────────────────────────────────────
   Preview Sub-Tabs (Write tab right panel)
   ────────────────────────────────────────── */
document.querySelector('.preview-tabs')?.addEventListener('click', e => {
  const btn = e.target.closest('.preview-tab');
  if (!btn) return;
  document.querySelectorAll('.preview-tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  AppState.set('previewTab', btn.dataset.preview);
  renderPreview();
});

/* ──────────────────────────────────────────
   Undo / Redo
   ────────────────────────────────────────── */
let _lastSnapshot = '';

function pushUndo() {
  const cur = $editor.value;
  if (cur === _lastSnapshot) return;
  const stack = AppState.get('undoStack');
  stack.push(_lastSnapshot);
  if (stack.length > 100) stack.shift();
  AppState.get('redoStack').length = 0;
  _lastSnapshot = cur;
}

function doUndo() {
  const stack = AppState.get('undoStack');
  if (!stack.length) return;
  AppState.get('redoStack').push($editor.value);
  $editor.value = stack.pop();
  _lastSnapshot = $editor.value;
  onContentChange();
}

function doRedo() {
  const stack = AppState.get('redoStack');
  if (!stack.length) return;
  AppState.get('undoStack').push($editor.value);
  $editor.value = stack.pop();
  _lastSnapshot = $editor.value;
  onContentChange();
}

document.getElementById('btn-undo').addEventListener('click', doUndo);
document.getElementById('btn-redo').addEventListener('click', doRedo);

/* ──────────────────────────────────────────
   Content Change Handler (Write tab)
   ────────────────────────────────────────── */
const debouncedParse = debounce(() => {
  const text = $editor.value;
  AppState.set('content', text);

  // Parse
  const blocks = parsePlainScript(text);
  AppState.set('blocks', blocks);

  // Auto-detect characters
  autoRegisterSpeakers(blocks).then(added => {
    if (added.length) {
      toast(`偵測到新角色：${added.map(c => c.displayName).join('、')}`);
      renderCharList();
      ShortcutManager.autoBind();
    }
  });

  // Update stats
  const lines = text.split('\n');
  $lineCount.textContent  = lines.length + ' 行';
  $blockCount.textContent = blocks.length + ' blocks';
  $charCount.textContent  = text.length + ' 字';

  // Validation badge
  const v = blocks.length ? validateBlocks(blocks, AppState.get('characters')) : { valid: true, results: [] };
  $parseStatus.textContent = v.valid ? '' : `${v.results.length} 問題`;
  $parseStatus.className   = v.valid ? '' : 'badge warn';

  // Auto-save draft
  Storage.savePlainText(text);
  Storage.saveDraft(blocks);

  renderPreview();
}, 300);

function onContentChange() {
  debouncedParse();
}

$editor.addEventListener('input', () => { pushUndo(); onContentChange(); });

// Cursor position tracking
$editor.addEventListener('keyup',     updateCursor);
$editor.addEventListener('click',     updateCursor);
$editor.addEventListener('mouseup',   updateCursor);

function updateCursor() {
  const pos = $editor.selectionStart;
  const lines = $editor.value.slice(0, pos).split('\n');
  $cursorPos.textContent = `Ln ${lines.length}, Col ${lines[lines.length - 1].length + 1}`;
}

// Keyboard shortcuts in editor
$editor.addEventListener('keydown', e => {
  // Ctrl+Z / Ctrl+Y
  if (e.ctrlKey && e.key === 'z') { e.preventDefault(); doUndo(); return; }
  if (e.ctrlKey && e.key === 'y') { e.preventDefault(); doRedo(); return; }

  // Alt+1 ~ Alt+9 shortcuts
  if (e.altKey && /^[1-9]$/.test(e.key)) {
    e.preventDefault();
    const binding = ShortcutManager.resolve(`Alt+${e.key}`);
    if (!binding) return;

    if (binding.type === 'scene') {
      insertAtCursor('#scene：');
    } else if (binding.type === 'narration') {
      insertAtCursor('旁白：');
    } else if (binding.type === 'character') {
      const chars = AppState.get('characters') || [];
      const c = chars.find(ch => ch.id === binding.charId);
      if (c) insertAtCursor(c.displayName + '：');
    }
    return;
  }
});

function insertAtCursor(text) {
  const start = $editor.selectionStart;
  const end   = $editor.selectionEnd;
  const val   = $editor.value;

  // If cursor is not at line start, add newline first
  const prefix = (start > 0 && val[start - 1] !== '\n') ? '\n' : '';

  pushUndo();
  $editor.value = val.slice(0, start) + prefix + text + val.slice(end);
  const newPos = start + prefix.length + text.length;
  $editor.selectionStart = $editor.selectionEnd = newPos;
  $editor.focus();
  onContentChange();
}

/* ──────────────────────────────────────────
   Render — Character List (delegated to write-tab.js for slot badges + ctx menu)
   ────────────────────────────────────────── */
function renderCharList() { renderCharListWithSlots($charList); }

// Listen for char-edit requests from write-tab.js
Bus.on('char:edit-requested', id => openCharModal(id));
Bus.on('shortcuts:user-updated', () => { renderCharList(); renderShortcutHints(); });

/* ──────────────────────────────────────────
   Render — Preview (Write tab right panel)
   ────────────────────────────────────────── */
function renderPreview() {
  const tab = AppState.get('previewTab');
  const blocks = AppState.get('blocks') || [];

  if (tab === 'blocks')  return renderBlocksPreview(blocks);
  if (tab === 'stats')   return renderStatsPreview(blocks);
  if (tab === 'layout')  return renderLayoutPreview(blocks);
  if (tab === 'voice')   return _renderVoicePanel();
  if (tab === 'bgm')     return _renderBgmPanel();
}

function renderBlocksPreview(blocks) {
  if (!blocks.length) {
    $previewBody.innerHTML = '<div class="empty-preview">在左側編輯器輸入劇本後，<br>此處即時顯示解析結果。</div>';
    return;
  }
  $previewBody.innerHTML = blocks.map((b, i) => {
    const num = `<span class="block-number">#${i + 1}</span>`;
    if (b.type === 'command')
      return `<div class="block-card command">${num}<span class="block-cmd">#${esc(b.command)}: ${esc(b.value)}</span></div>`;
    if (b.type === 'narration')
      return `<div class="block-card narration">${num}<div class="block-text" style="font-style:italic;color:var(--text-secondary)">${esc(b.text)}</div></div>`;
    if (b.type === 'scene')
      return `<div class="block-card scene">${num}<div class="block-text" style="color:var(--gold)">${esc(b.act || '')} ${esc(b.subtitle || '')}</div></div>`;
    if (b.type === 'note')
      return `<div class="block-card note">${num}<div class="block-text" style="color:var(--text-tertiary);font-style:italic">${esc(b.text)}</div></div>`;

    // dialogue
    const color = getCharColor(b.speaker);
    return `<div class="block-card dialogue">${num}
      <div class="block-speaker"><span class="dot" style="background:${color}"></span><span style="color:${color}">${esc(b.speaker)}</span></div>
      <div class="block-text">${esc(b.text)}</div>
    </div>`;
  }).join('');
}

function renderStatsPreview(blocks) {
  const dlg  = blocks.filter(b => b.type === 'dialogue');
  const narr = blocks.filter(b => b.type === 'narration');
  const speakers = {};
  for (const b of dlg) speakers[b.speaker] = (speakers[b.speaker] || 0) + 1;
  const sorted = Object.entries(speakers).sort((a, b) => b[1] - a[1]);

  $previewBody.innerHTML = `
    <div class="stats-grid">
      <div class="stat-box"><div class="val">${blocks.length}</div><div class="lbl">區塊</div></div>
      <div class="stat-box"><div class="val">${dlg.length}</div><div class="lbl">對白</div></div>
      <div class="stat-box"><div class="val">${narr.length}</div><div class="lbl">旁白</div></div>
      <div class="stat-box"><div class="val">${Object.keys(speakers).length}</div><div class="lbl">角色</div></div>
    </div>
    <div style="font-size:12px;color:var(--text-secondary);margin-bottom:6px">台詞分布</div>
    ${sorted.map(([s, n]) => {
      const pct = Math.round(n / dlg.length * 100) || 0;
      const color = getCharColor(s);
      return `<div style="display:flex;align-items:center;gap:6px;margin-bottom:4px;font-size:12px">
        <span style="min-width:70px;color:${color};text-align:right">${esc(s)}</span>
        <div style="flex:1;height:12px;background:var(--navy-light);border-radius:2px;overflow:hidden">
          <div style="width:${pct}%;height:100%;background:${color};opacity:.7;border-radius:2px"></div>
        </div>
        <span style="min-width:28px;color:var(--text-tertiary);font-size:11px">${n}</span>
      </div>`;
    }).join('')}`;
}

function renderLayoutPreview(blocks) {
  if (!blocks.length) {
    $previewBody.innerHTML = '<div class="empty-preview">先寫點劇本吧。</div>';
    return;
  }
  const title = AppState.get('filename').replace(/\.\w+$/, '') || '未命名';
  let html = `<div class="layout-page"><div class="layout-title">${esc(title)}</div>`;

  for (const b of blocks) {
    if (b.type === 'command' && b.command === 'scene') {
      html += `<div class="layout-scene">${esc(b.value)}</div>`;
    } else if (b.type === 'scene') {
      html += `<div class="layout-scene">${esc(b.act || '')} ${esc(b.subtitle || '')}</div>`;
    } else if (b.type === 'narration') {
      html += `<div class="layout-narr">${esc(b.text)}</div>`;
    } else if (b.type === 'dialogue') {
      const color = getCharColor(b.speaker);
      html += `<div class="layout-dlg"><span class="lspeaker" style="color:${color}">${esc(b.speaker)}</span><span class="ltext">${esc(b.text)}</span></div>`;
    } else if (b.type === 'command') {
      html += `<div class="layout-cmd">[${esc(b.command)}: ${esc(b.value)}]</div>`;
    }
  }
  html += '</div>';
  $previewBody.innerHTML = html;
}

// Voice / BGM panels delegated to write-tab.js (Phase 17-2)
function _renderVoicePanel() { renderVoicePreview($previewBody); }
function _renderBgmPanel()   { renderBgmPreview($previewBody);   }

/* ──────────────────────────────────────────
   Character Modal
   ────────────────────────────────────────── */
const $charModal = document.getElementById('char-modal');
let _editingCharId = null;

function openCharModal(id) {
  _editingCharId = id || null;
  const c = id ? (AppState.get('characters') || []).find(ch => ch.id === id) : null;

  document.getElementById('char-modal-title').textContent = c ? '編輯角色' : '新增角色';
  document.getElementById('char-input-name').value    = c ? c.displayName : '';
  document.getElementById('char-input-aliases').value = c?.aliases?.join(', ') || '';
  document.getElementById('char-input-color').value   = c?.color || '#C9A86A';
  document.getElementById('char-input-color-hex').value = c?.color || '#C9A86A';
  document.getElementById('char-btn-delete').style.display = c ? '' : 'none';

  $charModal.style.display = '';
  document.getElementById('char-input-name').focus();
}

function closeCharModal() {
  $charModal.style.display = 'none';
  _editingCharId = null;
}

document.getElementById('btn-add-char').addEventListener('click', () => openCharModal());
document.getElementById('char-btn-cancel').addEventListener('click', closeCharModal);

$charModal.addEventListener('click', e => { if (e.target === $charModal) closeCharModal(); });

// Color sync
document.getElementById('char-input-color').addEventListener('input', e => {
  document.getElementById('char-input-color-hex').value = e.target.value;
});
document.getElementById('char-input-color-hex').addEventListener('input', e => {
  if (/^#[0-9a-fA-F]{6}$/.test(e.target.value))
    document.getElementById('char-input-color').value = e.target.value;
});

// Save
document.getElementById('char-btn-save').addEventListener('click', async () => {
  const name = document.getElementById('char-input-name').value.trim();
  if (!name) { toast('請輸入角色名稱'); return; }

  const aliasRaw = document.getElementById('char-input-aliases').value;
  const aliases  = aliasRaw ? aliasRaw.split(/[,，]/).map(s => s.trim()).filter(Boolean) : [];
  const color    = document.getElementById('char-input-color').value;

  const chars = AppState.get('characters') || [];

  if (_editingCharId) {
    const idx = chars.findIndex(c => c.id === _editingCharId);
    if (idx >= 0) {
      chars[idx] = { ...chars[idx], displayName: name, aliases, color };
      await saveCharacter(chars[idx]);
    }
  } else {
    const c = { id: generateId('char'), displayName: name, aliases, color, createdAt: Date.now() };
    chars.push(c);
    await saveCharacter(c);
  }

  AppState.set('characters', [...chars]);
  closeCharModal();
  renderCharList();
  ShortcutManager.autoBind();
  renderShortcutHints();
  toast(_editingCharId ? '角色已更新' : '角色已新增');
});

// Delete
document.getElementById('char-btn-delete').addEventListener('click', async () => {
  if (!_editingCharId) return;
  if (!confirm('確定刪除此角色？此操作無法復原。')) return;

  await deleteCharacter(_editingCharId);
  const chars = (AppState.get('characters') || []).filter(c => c.id !== _editingCharId);
  AppState.set('characters', chars);

  closeCharModal();
  renderCharList();
  ShortcutManager.autoBind();
  renderShortcutHints();
  toast('角色已刪除');
});

/* ──────────────────────────────────────────
   Export
   ────────────────────────────────────────── */
const $exportMenu = document.getElementById('export-menu');
document.getElementById('btn-export').addEventListener('click', () => {
  $exportMenu.classList.toggle('show');
});
document.addEventListener('click', e => {
  if (!e.target.closest('.export-wrap')) $exportMenu.classList.remove('show');
});

$exportMenu.addEventListener('click', async e => {
  const btn = e.target.closest('button[data-fmt]');
  if (!btn) return;
  $exportMenu.classList.remove('show');
  await doExport(btn.dataset.fmt);
});

async function doExport(fmt) {
  const blocks = AppState.get('blocks') || [];
  if (!blocks.length) { toast('沒有可匯出的 blocks'); return; }
  const title = AppState.get('filename').replace(/\.\w+$/, '') || 'script';

  if (fmt === 'table') {
    try {
      const { blocksToTablePayload, MSG_TYPES, STORAGE_KEY } = await import('../../core/export/bridge.js');
      const payload = blocksToTablePayload(blocks, title);
      if (!payload) { toast('無可轉換的對話資料'); return; }
      sessionStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
      window.parent.postMessage({ type: MSG_TYPES.SCRIPT_EDITOR_EXPORT_TO_TABLE }, '*');
      toast('已送往 Table Forge');
    } catch (err) { toast('匯出失敗：' + err.message); }
    return;
  }

  const fmtMap = { 'jsonl':'jsonl', 'ks':'ks', 'avg-json':'avg-json', 'md':'md', 'docx':'docx', 'pdf':'pdf' };
  try {
    const { exportAndDownload } = await import('../../core/export-core.js');
    await exportAndDownload('dialogue', fmtMap[fmt], { blocks }, { title });
    toast(`已匯出 ${fmt.toUpperCase()}`);
  } catch (err) { toast('匯出失敗：' + err.message); }
}

/* ──────────────────────────────────────────
   File I/O
   ────────────────────────────────────────── */
document.getElementById('file-input').addEventListener('change', e => {
  const file = e.target.files[0];
  if (file) openFile(file);
  e.target.value = '';
});

document.getElementById('btn-new').addEventListener('click', newScript);
document.getElementById('btn-save').addEventListener('click', saveScript);

function openFile(file) {
  const reader = new FileReader();
  reader.onload = () => {
    const text = reader.result;
    AppState.set('filename', file.name);
    $filenameDisp.textContent = file.name;

    const imported = importBlocks(text, file.name);
    $formatBadge.textContent = imported.via === 'Plain Script'
      ? 'Plain Script'
      : `Plain Script (← ${imported.via})`;

    $editor.value = blocksToPlainScript(imported.blocks);
    AppState.set('format', 'plain-script');
    _lastSnapshot = $editor.value;
    AppState.get('undoStack').length = 0;
    AppState.get('redoStack').length = 0;
    onContentChange();

    // Notify App Shell
    window.parent.postMessage({
      type: 'akasha-file-opened',
      entry: { name: file.name, type: file.name.split('.').pop(), size: file.size, lastOpened: Date.now() },
    }, '*');

    toast(`已開啟 ${file.name}（${imported.blocks.length} blocks via ${imported.via}）`);
  };
  reader.readAsText(file);
}

function newScript() {
  AppState.merge({ filename: 'untitled.txt', format: 'plain-script', blocks: [], content: '' });
  $filenameDisp.textContent = 'untitled';
  $formatBadge.textContent  = 'Plain Script';
  $editor.value = '';
  _lastSnapshot = '';
  AppState.get('undoStack').length = 0;
  AppState.get('redoStack').length = 0;
  onContentChange();
}

function saveScript() {
  const text = $editor.value;
  downloadFile(AppState.get('filename'), text);
  toast('已下載 ' + AppState.get('filename'));
}

/* ──────────────────────────────────────────
   Shortcut Hints (Status Bar)
   ────────────────────────────────────────── */
function renderShortcutHints() {
  const labels = ShortcutManager.getSlotLabels();
  $shortcutBar.innerHTML = labels
    .filter(Boolean)
    .map((l, i) => `<span>Alt+${i + 1} ${esc(l.replace(/^Alt\+\d\s*/, ''))}</span>`)
    .join('');
}

/* ──────────────────────────────────────────
   PostMessage Bridge
   ────────────────────────────────────────── */
window.addEventListener('message', async e => {
  const d = e.data;
  if (!d || !d.type) return;

  // Receive file from App Shell
  if (d.type === 'akasha-open-file') {
    AppState.set('filename', d.filename || 'untitled.txt');
    $filenameDisp.textContent = AppState.get('filename');

    const text = d.content || '';
    const imported = importBlocks(text, AppState.get('filename'));
    $formatBadge.textContent = imported.via === 'Plain Script'
      ? 'Plain Script'
      : `Plain Script (← ${imported.via})`;

    $editor.value = blocksToPlainScript(imported.blocks);
    _lastSnapshot = $editor.value;
    AppState.get('undoStack').length = 0;
    AppState.get('redoStack').length = 0;
    onContentChange();
  }

  // AI context request
  if (d.type === 'akasha-ai-get-context') {
    const content   = AppState.get('content');
    const blocks    = AppState.get('blocks') || [];
    const chars     = AppState.get('characters') || [];
    const truncated = content.slice(0, 12000);

    window.parent.postMessage({
      type: 'akasha-ai-context-response',
      module: 'script-editor',
      fileName:   AppState.get('filename'),
      fileType:   AppState.get('format'),
      content:    truncated,
      blockCount: blocks.length,
      characters: chars.map(c => c.displayName),
      activeTab:  AppState.get('activeTab'),
    }, '*');
  }

  // Dark/light mode
  if (d.type === 'akasha-mode-change') {
    document.documentElement.dataset.mode = d.mode;
  }
});

/* ──────────────────────────────────────────
   Initialization
   ────────────────────────────────────────── */
async function init() {
  // Load characters from IndexedDB
  try {
    const chars = await loadCharacters();
    AppState.set('characters', chars);
  } catch (e) { console.error('[SE] Failed to load characters:', e); }

  // Init shortcuts
  ShortcutManager.init();
  renderShortcutHints();

  // Render character list
  renderCharList();

  // Restore draft from localStorage
  const savedText = Storage.loadPlainText();
  if (savedText) {
    $editor.value = savedText;
    _lastSnapshot = savedText;
    onContentChange();
  }

  // Init tab modules
  initEditorTab(
    document.getElementById('editor-block-list'),
    document.getElementById('editor-side-panel'),
  );
  initSearchTab(document.getElementById('search-panel'));

  // Tab keyboard navigation: Ctrl+1~4
  document.addEventListener('keydown', e => {
    if (e.ctrlKey && /^[1-4]$/.test(e.key)) {
      e.preventDefault();
      const tabs = ['write', 'editor', 'search', 'reader'];
      switchTab(tabs[parseInt(e.key) - 1]);
    }
  });

  // Toast bridge from sub-modules
  Bus.on('toast', msg => toast(msg));
}

init();
</script>
</body>
</html>
