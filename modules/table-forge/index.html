<!doctype html>
<html lang="zh-Hant" data-mode="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Table Forge — 阿卡夏圖書館</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Noto+Serif+TC:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/styles/shared.css">
  <style>
    /* ── Tabularium 葉綠：module accent for .panel__label / .seg / empty-state stamp etc ── */
    body {
      margin: 0;
      font-family: var(--font-body);
      color: var(--text-primary);
      background: var(--hall-bg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      --zone-ink: var(--ink-tabularium);
      --zone-ink-glow: rgba(90,138,74,.16);
      --zone-ink-line: rgba(90,138,74,.5);
    }

    /* .btn / .btn--gold / .btn--danger / .seg / .mh-menu / .panel / .empty-state come from shared.css.
       Only module-specific pieces below. */

    label.file-label {
      appearance: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 28px;
      min-height: 28px;
      padding: 0 10px;
      border: 1px solid var(--gold-dim);
      background: var(--gold-glow);
      color: var(--gold);
      border-radius: var(--r-soft);
      font-size: 12px;
      font-family: inherit;
      line-height: 1;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }

    label.file-label:hover {
      background: rgba(201,168,106,0.22);
      border-color: var(--gold);
    }

    /* --- Tool panels (匯入 / 匯出) — style guide 06 · .panel 儀器面板 --- */
    .tf-toolpanel {
      margin: 14px 20px 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .tf-toolpanel.hidden { display: none; }
    .tf-toolpanel:last-of-type { margin-bottom: 14px; }

    #import-textarea {
      width: 100%;
      min-height: 120px;
      max-height: 300px;
      resize: vertical;
      background: var(--navy-deep);
      color: var(--text-primary);
      border: 1px solid var(--navy-line);
      border-radius: var(--r-card);
      padding: 10px;
      font-family: var(--font-mono);
      font-size: 13px;
      line-height: 1.5;
      box-sizing: border-box;
    }

    #import-textarea::placeholder { color: var(--text-tertiary); }
    #import-textarea:focus { outline: none; border-color: var(--zone-ink); }

    .import-actions {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .import-actions input[type="file"] { display: none; }

    #import-error {
      color: var(--danger);
      font-size: 12px;
    }

    #import-error:empty { display: none; }

    .tf-panel-foot {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: var(--font-mono);
      font-size: 9.5px;
      color: var(--text-tertiary);
    }
    .tf-panel-foot .dot { color: var(--zone-ink); }

    /* --- Table Area --- */
    #table-area {
      flex: 1;
      overflow: auto;
      padding: 16px 20px;
    }

    /* empty-state uses shared .empty-state / __stamp / __line / __sub */

    /* --- Editable Table --- */
    .tf-table-wrap {
      overflow-x: auto;
      background: var(--navy);
      border: 1px solid var(--navy-line);
      border-radius: var(--r-card);
    }

    .tf-table {
      border-collapse: collapse;
      width: 100%;
      font-size: 13px;
      font-family: var(--font-mono);
    }

    .tf-table th,
    .tf-table td {
      border: 1px solid var(--navy-line);
      padding: 6px 10px;
      text-align: left;
      white-space: pre-wrap;
      min-width: 80px;
      max-width: 400px;
    }

    .tf-table th {
      position: sticky;
      top: 0;
      z-index: 2;
      background: var(--navy-light);
      color: var(--zone-ink);
      font-weight: 500;
      font-size: 12px;
      cursor: text;
    }

    .tf-table td {
      background: var(--navy);
      color: var(--text-primary);
    }

    .tf-table td:focus {
      outline: 2px solid var(--zone-ink);
      outline-offset: -2px;
      background: var(--navy-light);
    }

    .tf-table .row-actions,
    .tf-table .col-actions {
      border: none;
      background: transparent;
      padding: 2px;
      text-align: center;
      min-width: 32px;
      max-width: 32px;
      width: 32px;
    }

    .tf-table .col-actions { vertical-align: bottom; }

    .tf-del-btn {
      appearance: none;
      border: none;
      background: transparent;
      color: var(--text-tertiary);
      cursor: pointer;
      font-size: 14px;
      padding: 2px 4px;
      border-radius: var(--r-sharp);
      line-height: 1;
    }

    .tf-del-btn:hover { color: var(--danger); background: rgba(196,96,79,0.15); }

    .tf-add-row,
    .tf-add-col {
      appearance: none;
      border: 1px dashed var(--navy-line);
      background: transparent;
      color: var(--text-tertiary);
      cursor: pointer;
      font-size: 12px;
      padding: 6px 14px;
      border-radius: var(--r-card);
      margin-top: 8px;
      transition: all 0.15s;
    }

    .tf-add-row:hover,
    .tf-add-col:hover {
      color: var(--zone-ink);
      border-color: var(--zone-ink-line);
    }

    .tf-table-actions {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    /* --- Export panel specifics --- */
    .export-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    #export-preview {
      background: var(--navy-deep);
      border: 1px solid var(--navy-line);
      border-radius: var(--r-card);
      padding: 10px;
      font-family: var(--font-mono);
      font-size: 12px;
      line-height: 1.5;
      color: var(--text-secondary);
      max-height: 260px;
      overflow: auto;
      white-space: pre-wrap;
      word-break: break-all;
    }

    #export-preview:empty { display: none; }

    /* --- Toast (module-local stacking system; namespaced to avoid
       colliding with shared.css's single bottom-right .toast) --- */
    .tf-toast-container {
      position: fixed;
      top: 12px;
      right: 12px;
      z-index: 9999;
      pointer-events: none;
    }
    .tf-toast {
      background: var(--navy-light);
      border: 1px solid var(--gold-dim);
      border-radius: var(--r-card);
      padding: 8px 16px;
      font-size: 12px;
      color: var(--gold);
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
      opacity: 0;
      transform: translateY(-8px);
      transition: opacity 300ms, transform 300ms;
      margin-bottom: 6px;
    }
    .tf-toast.show { opacity: 1; transform: translateY(0); }
    .tf-toast .toast-check { color: var(--success); margin-right: 4px; }

    /* Mobile popover */
    .mobile-popover {
      position: fixed;
      z-index: 9999;
      background: var(--navy-light);
      border: 1px solid var(--gold-dim);
      border-radius: var(--r-card);
      padding: 8px 14px;
      font-size: 12px;
      line-height: 1.6;
      color: var(--text-secondary);
      max-width: 220px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.5);
      pointer-events: none;
      opacity: 0;
      transform: translateY(4px);
      transition: opacity 150ms, transform 150ms;
    }
    .mobile-popover.show { opacity: 1; transform: translateY(0); }
    .mobile-popover .pop-label { color: var(--gold); font-weight: 600; display: block; margin-bottom: 2px; }

    /* Extract panel (Phase 9) */
    .extract-panel { padding-top: 6px; border-top: 1px dashed var(--navy-line); }
    .extract-panel.hidden { display: none; }
    .extract-label { font-size: 11px; color: var(--text-tertiary); margin-bottom: 6px; }
    .extract-buttons { display: flex; gap: 6px; flex-wrap: wrap; }
    .extract-btn {
      appearance: none;
      border: 1px solid var(--navy-line);
      background: var(--navy-light);
      color: var(--text-secondary);
      padding: 5px 10px;
      border-radius: var(--r-card);
      font-size: 11px;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.15s;
    }
    .extract-btn:hover { border-color: var(--zone-ink-line); color: var(--zone-ink); background: var(--zone-ink-glow); }
    .extract-btn .count { color: var(--text-tertiary); font-size: 10px; margin-left: 2px; }
    .extract-btn:hover .count { color: var(--zone-ink); }
    .diff-line { margin: 0; padding: 0; white-space: pre; }
    .diff-del { color: #e06c75; }
    .diff-add { color: #98c379; }
    .diff-same { color: var(--text-tertiary); }

    /* HINTS 聯動系統 */
    .hints-bar {
      padding: 8px 20px;
      border-bottom: 1px solid var(--navy-line);
      background: rgba(24,29,40,0.6);
      font-size: 12px;
      line-height: 1.6;
      max-height: 120px;
      overflow: hidden;
      transition: max-height 200ms, opacity 200ms, padding 200ms;
    }
    .hints-bar.collapsed {
      max-height: 0;
      padding: 0 20px;
      opacity: 0;
      border-bottom-color: transparent;
    }
    :root[data-mode="light"] .hints-bar {
      background: rgba(245,239,225,0.6);
    }
    .hints-info {
      color: var(--text-secondary);
      font-size: 11.5px;
    }
    .hints-info .info-label {
      color: var(--zone-ink);
      font-weight: 500;
    }
    .hints-divider {
      border: none;
      border-top: 1px dashed var(--navy-line);
      margin: 6px 0;
    }
    .hints-op-record {
      font-size: 11.5px;
      line-height: 1.6;
      color: var(--zone-ink);
    }
    .hints-op-record .op-check { color: var(--success); margin-right: 2px; }
    .hints-op-record .op-time { color: var(--text-tertiary); font-size: 10.5px; margin-left: 4px; }
    .hints-hover-desc {
      font-size: 11.5px;
      line-height: 1.6;
      color: var(--text-secondary);
      margin-top: 4px;
    }
    .hints-hover-desc .hover-label {
      color: var(--text-primary);
      font-weight: 600;
    }
    .hints-hover-desc .hover-label::before {
      content: '▸ ';
      color: var(--zone-ink);
    }
  </style>
</head>
<body>
  <!-- Deskbar — 44px 唯一 chrome，左狀態／右動作，禁止出現模組名字 -->
  <header class="deskbar">
    <div class="desk-status">
      <span class="desk-dot" id="deskStatusDot"></span>
      <span id="deskStatusText">尚未載入資料</span>
    </div>
    <div class="desk-actions">
      <button class="btn" id="btn-toggle-import" title="貼上或開啟檔案匯入表格資料">匯入 ▾</button>
      <button class="btn" id="btn-meta" disabled title="加入 source / editedBy 欄位標記資料來源與編輯者">Meta</button>
      <button class="btn" id="btn-hints" title="顯示或隱藏操作提示面板">HINTS</button>
      <button class="btn" id="btn-diff" title="比對原始資料與目前表格的差異">Diff</button>
      <button class="btn" id="btn-toggle-export" disabled title="將表格匯出為 Markdown、JSON 或 CSV">匯出 ▾</button>
      <button class="btn btn--danger" id="btn-clear" disabled title="清除目前表格所有資料">清除</button>
    </div>
  </header>

  <!-- HINTS Bar -->
  <div class="hints-bar collapsed" id="hintsBar">
    <div class="hints-info" id="hintsInfo">尚未載入資料。貼上文字或開啟檔案開始。</div>
    <hr class="hints-divider" id="hintsDivider" style="display:none">
    <div class="hints-op-record" id="hintsOpRecord"></div>
    <div class="hints-hover-desc" id="hintsHoverDesc"></div>
  </div>

  <!-- Import Panel — instrument · style guide 06 -->
  <div id="import-panel" class="panel tf-toolpanel">
    <div class="panel__label">匯入 · IMPORT</div>
    <textarea id="import-textarea" placeholder="貼上 Markdown Table、JSON Array 或 CSV⋯⋯"></textarea>
    <div class="import-actions">
      <button class="btn btn--gold" id="btn-parse" title="解析貼上的文字為表格">貼上解析</button>
      <label class="file-label" for="import-file" title="從本機開啟 CSV / JSON / Markdown 檔案">開啟檔案</label>
      <input type="file" id="import-file" accept=".md,.json,.csv,.txt,.tsv">
      <button class="btn" id="btn-extract" title="分析 Markdown 結構並抽取為表格（章節、大綱、表格清單等）">從 MD 抽取</button>
      <span id="import-error"></span>
    </div>
    <div id="extract-panel" class="extract-panel hidden">
      <div class="extract-label">Markdown 結構可抽取為表格：</div>
      <div id="extract-buttons" class="extract-buttons"></div>
    </div>
    <div class="tf-panel-foot"><span class="dot">◆</span>解析器：CSV FSM · RFC 4180</div>
  </div>

  <!-- Table Area -->
  <div id="table-area">
    <div id="empty-state" class="empty-state">
      <div class="empty-state__stamp">TABULARIUM</div>
      <div class="empty-state__line">鍛台是冷的</div>
      <div class="empty-state__sub">貼上一段 CSV，或從手稿抽一張表過來。</div>
    </div>
    <div id="table-container"></div>
  </div>

  <!-- Export Panel — instrument · style guide 06 -->
  <div id="export-panel" class="panel tf-toolpanel hidden">
    <div class="panel__label">匯出 · EXPORT</div>
    <div class="export-actions">
      <span class="seg">
        <button class="seg__opt" id="btn-export-md" title="預覽 Markdown 表格格式">Markdown</button>
        <button class="seg__opt" id="btn-export-json" title="預覽 JSON 陣列格式">JSON</button>
        <button class="seg__opt" id="btn-export-csv" title="預覽 CSV 純文字格式">CSV</button>
      </span>
      <span style="margin-left:auto"></span>
      <button class="btn" id="btn-copy" title="複製匯出內容到剪貼簿">複製</button>
      <button class="btn btn--gold" id="btn-download" title="下載匯出檔案">下載</button>
    </div>
    <pre id="export-preview"></pre>
  </div>

  <!-- Toast -->
  <div class="tf-toast-container" id="toastContainer"></div>

  <!-- Scripts -->
  <script>
    // Toast system (module-local stacking toasts; namespaced .tf-toast to avoid
    // colliding with shared.css's global single bottom-right .toast)
    function showToast(text, duration) {
      duration = duration || 2500;
      var container = document.getElementById('toastContainer');
      var el = document.createElement('div');
      el.className = 'tf-toast';
      el.innerHTML = '<span class="toast-check">✓</span> ' + text;
      container.appendChild(el);
      requestAnimationFrame(function() {
        requestAnimationFrame(function() { el.classList.add('show'); });
      });
      setTimeout(function() {
        el.classList.remove('show');
        setTimeout(function() { el.remove(); }, 350);
      }, duration);
    }
    window.showToast = showToast;

    // ── HINTS 聯動系統 ────────────────────────────
    var hintsInfo = null;
    var hintsDivider = null;
    var hintsOpRecord = null;
    var hintsHoverDesc = null;
    var deskStatusText = null;
    var lastOpText = '';
    var lastOpTime = 0;
    var opTimerInterval = null;

    function escapeHtml(str) {
      var div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function relativeTime(ts) {
      var diff = Math.floor((Date.now() - ts) / 1000);
      if (diff < 5) return '剛剛';
      if (diff < 60) return diff + ' 秒前';
      if (diff < 3600) return Math.floor(diff / 60) + ' 分鐘前';
      return Math.floor(diff / 3600) + ' 小時前';
    }

    function recordOperation(text) {
      lastOpText = text;
      lastOpTime = Date.now();
      updateOpRecord();
      if (hintsDivider) hintsDivider.style.display = '';
      if (opTimerInterval) clearInterval(opTimerInterval);
      opTimerInterval = setInterval(updateOpRecord, 10000);
      showToast(text);
    }
    window.recordOperation = recordOperation;

    function updateOpRecord() {
      if (!hintsOpRecord) return;
      if (!lastOpTime) { hintsOpRecord.innerHTML = ''; return; }
      hintsOpRecord.innerHTML =
        '<span class="op-check">✓</span> ' +
        escapeHtml(lastOpText) +
        '<span class="op-time">（' + relativeTime(lastOpTime) + '）</span>';
    }

    function updateHintsInfo(label, detail) {
      // Deskbar 左側狀態字：短版
      if (deskStatusText) {
        deskStatusText.textContent = label ? (label + (detail ? ' · ' + detail : '')) : '尚未載入資料';
      }
      if (!hintsInfo) return;
      if (!label) {
        hintsInfo.textContent = '尚未載入資料。貼上文字或開啟檔案開始。';
        return;
      }
      hintsInfo.innerHTML = '<span class="info-label">' + escapeHtml(label) + '</span>' + (detail ? ' · ' + escapeHtml(detail) : '');
    }
    window.updateHintsInfo = updateHintsInfo;

    function showHoverHint(label, desc) {
      if (!hintsHoverDesc) return;
      if (!label) { hintsHoverDesc.innerHTML = ''; return; }
      if (hintsDivider && (lastOpTime || label)) hintsDivider.style.display = '';
      hintsHoverDesc.innerHTML =
        '<span class="hover-label">' + escapeHtml(label) + '</span><br>' +
        escapeHtml(desc);
    }

    function hideHoverHint() {
      if (hintsHoverDesc) hintsHoverDesc.innerHTML = '';
    }

    // Mobile popover (long press)
    var popoverEl = null;
    var longPressTimer = null;
    function showPopover(btn) {
      var title = btn.getAttribute('title');
      if (!title) return;
      if (!popoverEl) {
        popoverEl = document.createElement('div');
        popoverEl.className = 'mobile-popover';
        document.body.appendChild(popoverEl);
      }
      var label = btn.textContent.trim();
      popoverEl.innerHTML = '<span class="pop-label">' + label + '</span>' + title;
      var rect = btn.getBoundingClientRect();
      popoverEl.style.left = Math.max(8, Math.min(rect.left, window.innerWidth - 240)) + 'px';
      popoverEl.style.top = (rect.bottom + 6) + 'px';
      requestAnimationFrame(function() { popoverEl.classList.add('show'); });
    }
    function hidePopover() {
      if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }
      if (popoverEl) popoverEl.classList.remove('show');
    }

    // ── Init ──────────────────────────────────────
    document.addEventListener('DOMContentLoaded', function() {
      // HINTS DOM refs
      hintsInfo = document.getElementById('hintsInfo');
      hintsDivider = document.getElementById('hintsDivider');
      hintsOpRecord = document.getElementById('hintsOpRecord');
      hintsHoverDesc = document.getElementById('hintsHoverDesc');
      deskStatusText = document.getElementById('deskStatusText');

      // HINTS toggle
      var hintsBar = document.getElementById('hintsBar');
      var btnHints = document.getElementById('btn-hints');
      if (btnHints) {
        btnHints.addEventListener('click', function() {
          hintsBar.classList.toggle('collapsed');
          btnHints.classList.toggle('btn--gold', !hintsBar.classList.contains('collapsed'));
        });
      }

      // Wire hover hints + mobile popover on all buttons with titles
      var buttons = document.querySelectorAll('.btn, .file-label, .seg__opt');
      buttons.forEach(function(btn) {
        var title = btn.getAttribute('title');
        if (!title) return;
        var label = btn.textContent.trim();
        // Desktop hover → HINTS lower section
        btn.addEventListener('mouseenter', function() { showHoverHint(label, title); });
        btn.addEventListener('mouseleave', hideHoverHint);
        // Mobile long press → popover
        btn.addEventListener('touchstart', function(e) {
          longPressTimer = setTimeout(function() {
            e.preventDefault();
            showPopover(btn);
          }, 500);
        }, { passive: false });
        btn.addEventListener('touchend', hidePopover);
        btn.addEventListener('touchcancel', hidePopover);
        btn.addEventListener('touchmove', hidePopover);
      });
    });
  </script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5/papaparse.min.js"></script>
  <script type="module">
    import './table-ui.js';
  </script>
</body>
</html>
