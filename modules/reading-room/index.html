<!doctype html>
<html lang="zh-Hant" data-mode="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>談心專區 — 阿卡夏圖書館</title>
  <!-- shared.css 已載入全域字體（含 Sorts Mill Goudy／JetBrains Mono／Noto Serif TC／
       Cormorant Garamond），本檔不重複 <link> Google Fonts。 -->
  <link rel="stylesheet" href="../../assets/styles/shared.css">
  <style>
    * { box-sizing: border-box; margin: 0; }
    html, body { height: 100%; }
    body {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--page-bg);
      /* 廳墨色：本模組全域套用，供 shared.css 內所有 var(--zone-ink, …) 元件自動取色 */
      --zone-ink: var(--ink-intimarium);
    }

    /* ===== Deskbar 狀態 ===== */
    .desk-dot.is-danger { background: var(--danger); }

    /* 李紫 active（不留痕 toggle） */
    .btn.is-active {
      background: rgba(122,88,152,0.14);
      border-color: rgba(122,88,152,0.45);
      color: var(--ink-intimarium);
    }
    .btn.is-active:hover { background: rgba(122,88,152,0.22); }

    /* ===== Room layout：紙頁（左）＋ 手札軌（右）===== */
    .im-page {
      flex: 1;
      min-height: 0;
      display: flex;
      overflow: hidden;
      gap: 24px;
      padding: 20px 32px 24px;
      position: relative;
    }
    .im-page::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 200px;
      background: radial-gradient(ellipse 60% 100% at 50% -20%, rgba(255,248,224,0.5), transparent 72%);
      pointer-events: none;
    }

    .im-paper.page-sheet {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      padding: 30px 40px 20px 76px;
    }
    .im-paper.page-sheet::before { left: 48px; }

    .im-timestamp {
      flex: none;
      font-family: var(--font-mono);
      font-size: 8.5px;
      letter-spacing: 0.2em;
      color: var(--page-pencil);
      margin-bottom: 14px;
    }

    .im-scroll {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 18px;
      padding-right: 4px;
    }
    .im-msg { animation: im-msg-in 0.25s ease-out; }
    @keyframes im-msg-in {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .im-msg--user {
      align-self: flex-end;
      max-width: 78%;
    }
    .im-bubble {
      background: rgba(122,88,152,0.07);
      border: 1px solid rgba(122,88,152,0.18);
      border-radius: 6px 0 0 6px;
      padding: 10px 14px;
      font-family: var(--font-serif-tc);
      font-size: 13.5px;
      line-height: 1.95;
      color: var(--page-ink);
      white-space: pre-wrap;
      word-break: break-word;
      text-align: left;
    }
    .im-msg--assistant {
      align-self: flex-start;
      max-width: 86%;
    }
    .im-text {
      font-family: var(--font-serif-tc);
      font-size: 13.5px;
      line-height: 32px;
      color: var(--page-ink-mid);
      white-space: pre-wrap;
      word-break: break-word;
    }
    .im-signature {
      font-family: var(--font-mono);
      font-size: 8.5px;
      color: var(--page-pencil);
      margin-top: 4px;
    }
    .im-msg--assistant .margin-note {
      margin: 6px 0 4px;
      font-size: 14.5px;
    }

    /* Typewriter cursor */
    .im-cursor {
      display: inline-block;
      width: 2px;
      height: 1em;
      background: var(--ink-intimarium);
      margin-left: 2px;
      animation: im-blink 0.7s step-end infinite;
      vertical-align: text-bottom;
    }
    @keyframes im-blink { 50% { opacity: 0; } }

    /* Thinking indicator */
    .im-thinking::after {
      content: '';
      display: inline-block;
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--ink-intimarium);
      margin-left: 8px;
      animation: im-pulse-dot 1s ease-in-out infinite;
    }
    @keyframes im-pulse-dot { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }

    /* Suggestion actions (under margin-note) */
    .im-suggest-actions {
      display: flex;
      gap: 6px;
      margin: 2px 0 4px;
    }
    .btn--xs {
      height: 22px;
      min-height: 22px;
      padding: 0 8px;
      font-size: 10.5px;
      border-radius: var(--r-sharp);
    }

    /* ===== Composer ===== */
    .im-composer {
      flex: none;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 18px;
      padding-top: 10px;
      border-top: 1px solid var(--page-border);
    }
    .im-input {
      flex: 1;
      min-height: 32px;
      max-height: 120px;
      background: var(--page-bg);
      border: 1px solid var(--page-border);
      border-radius: 4px;
      color: var(--page-ink);
      font-family: var(--font-serif-tc);
      font-size: 12.5px;
      line-height: 1.6;
      padding: 6px 12px;
      resize: none;
      outline: none;
    }
    .im-input:focus { border-color: var(--ink-intimarium); }
    .im-input::placeholder { color: var(--page-pencil); }
    .im-send {
      flex: none;
      height: 32px;
      padding: 0 16px;
      background: rgba(122,88,152,0.1);
      border: 1px solid rgba(122,88,152,0.45);
      border-radius: 4px;
      color: var(--ink-intimarium);
      font-family: inherit;
      font-size: 12px;
      cursor: pointer;
      transition: background 0.15s;
      white-space: nowrap;
    }
    .im-send:hover { background: rgba(122,88,152,0.18); }
    .im-send:disabled { opacity: 0.4; cursor: default; }

    /* ===== Footnote：一行鉛筆小字（原免責聲明橫幅收於此）===== */
    .im-footnote {
      flex: none;
      text-align: center;
      font-family: var(--font-hand);
      font-style: italic;
      font-size: 10.5px;
      color: var(--page-pencil);
      opacity: 0.75;
      line-height: 1.7;
      margin-top: 12px;
    }
    .im-footnote a {
      color: var(--ink-intimarium);
      text-decoration: underline;
      cursor: pointer;
      font-style: normal;
    }

    /* ===== 手札軌（右）===== */
    .im-rail {
      width: 264px;
      flex: none;
      display: flex;
      flex-direction: column;
      gap: 14px;
      overflow-y: auto;
    }
    .im-rail[hidden] { display: none; }

    .im-rail-head {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }
    .im-rail-head .index-card__label { margin-bottom: 0; }

    .im-filter-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 10px;
    }
    .im-filter-bar:empty { display: none; }
    .im-filter-tag {
      appearance: none;
      height: 20px;
      display: inline-flex;
      align-items: center;
      padding: 0 8px;
      white-space: nowrap;
      background: transparent;
      border: 1px solid var(--page-border);
      border-radius: 10px;
      font-family: inherit;
      font-size: 10px;
      color: var(--page-pencil);
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s, background 0.15s;
    }
    .im-filter-tag:hover { border-color: var(--ink-intimarium); color: var(--ink-intimarium); }
    .im-filter-tag.is-active {
      background: rgba(122,88,152,0.1);
      border-color: rgba(122,88,152,0.3);
      color: var(--ink-intimarium);
    }

    .im-notes-scroll {
      max-height: 44vh;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .im-note {
      padding: 9px 11px;
      background: var(--page-bg);
      border: 1px solid var(--page-border);
      border-left: 2px solid transparent;
      cursor: pointer;
      transition: border-color 0.15s;
    }
    .im-note:hover { border-left-color: var(--ink-intimarium); }
    .im-note__title { font-size: 12px; color: var(--page-ink); font-weight: 600; }
    .im-note__body {
      font-size: 11px;
      color: var(--page-ink-mid);
      line-height: 1.6;
      margin-top: 4px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .im-note__meta {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 6px;
      font-family: var(--font-mono);
      font-size: 8.5px;
      color: var(--page-pencil);
    }
    .im-note__actions {
      display: flex;
      gap: 6px;
      margin-top: 7px;
    }
    .im-note__actions .btn { color: var(--page-ink-mid); border-color: var(--page-border); background: var(--page-card); }
    .im-note__actions .btn:hover { border-color: var(--ink-intimarium); color: var(--ink-intimarium); }
    .im-note__actions .btn--danger { color: var(--danger); border-color: rgba(196,96,79,0.35); background: var(--page-card); }
    .im-note__actions .btn--danger:hover { background: rgba(196,96,79,0.1); }

    .im-notes-empty {
      text-align: center;
      padding: 20px 6px;
    }
    .im-notes-empty__line {
      font-family: var(--font-body);
      font-size: 12.5px;
      font-weight: 600;
      color: var(--page-ink);
      margin-bottom: 6px;
    }
    .im-notes-empty__sub {
      font-family: var(--font-body);
      font-size: 11px;
      line-height: 1.7;
      color: var(--page-pencil);
    }

    .im-tea {
      background: var(--postit-lavender);
      box-shadow: 2px 3px 6px rgba(0,0,0,0.07);
      padding: 14px 16px;
      transform: rotate(0.6deg);
      font-family: var(--font-hand);
      font-style: italic;
      font-size: 13px;
      line-height: 1.6;
      color: var(--page-ink-mid);
    }

    /* ===== Dialogs（沿用全域對話框樣式：navy 卡＋金框標題＋.btn 動作列）===== */
    .im-dialog-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }
    .im-dialog-overlay.active { display: flex; }
    .im-dialog {
      background: var(--navy);
      border: 1px solid var(--gold-line);
      border-radius: var(--r-card);
      width: 440px;
      max-width: 92vw;
      max-height: 86vh;
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow-lift);
    }
    .im-dialog__header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      border-bottom: 1px solid var(--navy-line);
      flex: none;
    }
    .im-dialog__header h3 {
      margin: 0;
      font-family: var(--font-serif-tc);
      font-size: 15px;
      font-weight: 600;
      color: var(--gold);
    }
    .im-dialog__close {
      appearance: none;
      background: none;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 15px;
      opacity: 0.7;
      line-height: 1;
      padding: 4px;
    }
    .im-dialog__close:hover { opacity: 1; color: var(--text-primary); }
    .im-dialog__body {
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
    }
    .im-dialog__footer {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      padding: 0 20px 18px;
      flex: none;
    }
    .im-field-label {
      display: block;
      font-size: 11px;
      color: var(--text-tertiary);
      margin-bottom: 4px;
    }
    .im-field input[type="text"],
    .im-field textarea {
      width: 100%;
      background: var(--navy-deep);
      border: 1px solid var(--navy-line);
      border-radius: var(--r-soft);
      color: var(--text-primary);
      font-family: inherit;
      font-size: 13px;
      padding: 8px 12px;
      outline: none;
    }
    .im-field input[type="text"]:focus,
    .im-field textarea:focus { border-color: var(--ink-intimarium); }
    .im-field textarea {
      resize: vertical;
      min-height: 150px;
      max-height: 40vh;
      line-height: 1.7;
    }
    .im-field-hint {
      font-size: 10px;
      color: var(--text-tertiary);
      margin-top: 3px;
    }
    .im-field-meta {
      font-size: 10px;
      color: var(--text-tertiary);
    }

    .im-option {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border: 1px solid var(--navy-line);
      border-radius: var(--r-soft);
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }
    .im-option:hover { border-color: var(--ink-intimarium); background: var(--navy-light); }
    .im-option input[type="radio"] { accent-color: var(--ink-intimarium); }
    .im-option__label { font-size: 13px; color: var(--text-primary); }
    .im-option__desc { font-size: 11px; color: var(--text-tertiary); }

    /* ===== Responsive ===== */
    @media (max-width: 760px) {
      .im-page { padding: 14px 14px 18px; gap: 0; flex-wrap: wrap; }
      .im-paper.page-sheet { padding: 24px 18px 16px 40px; width: 100%; }
      .im-paper.page-sheet::before { left: 18px; }
      .im-rail:not([hidden]) {
        position: fixed;
        inset: var(--deskbar-h) 0 0 0;
        z-index: 50;
        width: 100%;
        background: var(--page-bg);
        padding: 18px;
      }
      .im-msg { max-width: 94%; }
    }
  </style>
</head>
<body>

<!-- Deskbar — 模組唯一 chrome 列；殼負責標題，這裡不放模組名字 -->
<header class="deskbar">
  <span class="desk-status">
    <span class="desk-dot" id="deskDot"></span>
    <span id="deskStatusText">在館</span>
  </span>
  <span class="desk-spacer"></span>
  <div class="desk-actions">
    <button class="btn" id="btnNoTrace" title="開啟後對話不會寫入記憶">不留痕模式</button>
    <button class="btn" id="btnNotes" title="開啟／關閉手札面板">手札</button>
    <button class="btn btn--danger" id="btnClear" title="清除本次對話">清除對話</button>
  </div>
</header>

<!-- Main：紙頁對話面 + 手札軌 -->
<div class="im-page">

  <div class="im-paper page-sheet" id="paperSheet">
    <div class="im-timestamp" id="paperTimestamp"></div>
    <div class="im-scroll" id="chatScroll"></div>

    <div class="im-composer">
      <textarea class="im-input" id="chatInput" rows="1" placeholder="寫給零韻…" maxlength="4000"></textarea>
      <button class="im-send" id="chatSend">送出</button>
    </div>

    <div class="im-footnote">
      ＊零韻不提供醫療、法律、金融判斷；重要的決定，請與人類商量。私密內容預設不同步雲端。你可以<a id="linkNoTrace">開啟不留痕</a>・<a id="linkDeleteAll">刪除紀錄</a>・<a id="linkMemOff">關閉長期記憶</a>。
    </div>
  </div>

  <aside class="im-rail" id="notesPanel" hidden>
    <div class="index-card">
      <div class="im-rail-head">
        <span class="index-card__label">JOURNAL · 手札</span>
        <span class="desk-spacer"></span>
        <button class="btn btn--ghost btn--xs" id="btnNewNote" title="新增一篇手札">＋ 新篇</button>
        <button class="btn btn--ghost btn--xs" id="btnCloseNotes" title="關閉手札">✕</button>
      </div>
      <div class="im-filter-bar" id="filterBar"></div>
      <div class="im-notes-scroll" id="notesScroll">
        <div class="im-notes-empty" id="notesEmpty">
          <div class="im-notes-empty__line">這裡的話不出這張桌子。</div>
          <div class="im-notes-empty__sub">想到什麼，就從第一句開始——對話中零韻會問要不要整理成手札。</div>
        </div>
      </div>
      <div style="display:flex;gap:8px;margin-top:12px">
        <button class="btn" id="btnExportMd" style="flex:1;justify-content:center">匯出 MD</button>
        <button class="btn" id="btnExportJson" style="flex:1;justify-content:center">匯出 JSON</button>
      </div>
    </div>
    <div class="im-tea">tonight's tea: 蜜香紅茶，第二泡。</div>
  </aside>

</div>

<!-- Memory Save Dialog -->
<div class="im-dialog-overlay" id="saveOverlay">
  <div class="im-dialog">
    <div class="im-dialog__header">
      <h3>保存這段對話？</h3>
    </div>
    <div class="im-dialog__body">
      <label class="im-option">
        <input type="radio" name="saveChoice" value="none" checked>
        <div>
          <div class="im-option__label">不保存</div>
          <div class="im-option__desc">關閉後清除</div>
        </div>
      </label>
      <label class="im-option">
        <input type="radio" name="saveChoice" value="today">
        <div>
          <div class="im-option__label">只保留今日</div>
          <div class="im-option__desc">存入 session，關閉瀏覽器後消失</div>
        </div>
      </label>
      <label class="im-option">
        <input type="radio" name="saveChoice" value="local">
        <div>
          <div class="im-option__label">存成本機手札</div>
          <div class="im-option__desc">寫入零韻手札（IndexedDB），可隨時查閱刪除</div>
        </div>
      </label>
      <label class="im-option">
        <input type="radio" name="saveChoice" value="creative">
        <div>
          <div class="im-option__label">轉成創作素材</div>
          <div class="im-option__desc">存為手札並標記「創作」標籤</div>
        </div>
      </label>
      <label class="im-option">
        <input type="radio" name="saveChoice" value="notion">
        <div>
          <div class="im-option__label">同步到 Notion</div>
          <div class="im-option__desc">存入本機手札，並排入 Notion 同步佇列</div>
        </div>
      </label>
    </div>
    <div class="im-dialog__footer">
      <button class="btn" id="saveDlgCancel">取消</button>
      <button class="btn btn--gold" id="saveDlgConfirm">確認</button>
    </div>
  </div>
</div>

<!-- Note Edit / New Modal -->
<div class="im-dialog-overlay" id="editOverlay">
  <div class="im-dialog">
    <div class="im-dialog__header">
      <h3 id="editDialogTitle">編輯手札</h3>
      <button class="im-dialog__close" id="editClose">&times;</button>
    </div>
    <div class="im-dialog__body">
      <div class="im-field">
        <label class="im-field-label">標題</label>
        <input type="text" id="editTitle" maxlength="100">
      </div>
      <div class="im-field">
        <label class="im-field-label">內容</label>
        <textarea id="editContent"></textarea>
      </div>
      <div class="im-field">
        <label class="im-field-label">標籤</label>
        <input type="text" id="editTags" placeholder="以逗號分隔，例：談心, 創作">
        <div class="im-field-hint">以半形或全形逗號分隔</div>
      </div>
      <div class="im-field-meta" id="editMeta"></div>
    </div>
    <div class="im-dialog__footer">
      <button class="btn" id="editCancel">取消</button>
      <button class="btn btn--gold" id="editSave">儲存</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast" style="display:none"></div>

<script type="module">
// postMessage type 對照表（本檔為零 import 的 inline module script；加相對 import 會使 file:// 情境整檔失效，
// 故維持字面值，禁止改為 import；改字串值時必須同步 core/export/bridge.js 的 MSG_TYPES）：
//   'akasha-mode-change'                    = MSG_TYPES.MODE_CHANGE
//   'akasha-reading-room-response'          = MSG_TYPES.READING_ROOM_RESPONSE
//   'akasha-ai-get-context'                 = MSG_TYPES.AI_GET_CONTEXT
//   'akasha-ai-context-response'            = MSG_TYPES.AI_CONTEXT_RESPONSE
//   'akasha-reading-room-send'              = MSG_TYPES.READING_ROOM_SEND
//   'akasha-reading-room-memory'            = MSG_TYPES.READING_ROOM_MEMORY
//   'akasha-reading-room-memory-response'   = MSG_TYPES.READING_ROOM_MEMORY_RESPONSE
// ===== Imports =====
// Memory APIs are in main window (App Shell), accessed via parent
// We communicate with App Shell via PostMessage for AI calls

const MODULE_NAME = 'private-reading-room';

// ===== State =====
const state = {
  noTrace: false,
  notesPanelOpen: false,
  messages: [],        // { role, text, time }
  notes: [],           // cached from IndexedDB
  filterTag: null,     // active tag filter (null = show all)
  sending: false,
  typewriterTimer: null,
};

// ===== DOM refs =====
const $ = id => document.getElementById(id);
const chatScroll = $('chatScroll');
const chatInput = $('chatInput');
const chatSend = $('chatSend');
const notesPanel = $('notesPanel');
const notesScroll = $('notesScroll');
const deskDot = $('deskDot');
const deskStatusText = $('deskStatusText');
const btnNoTrace = $('btnNoTrace');
const btnNotes = $('btnNotes');
const btnClear = $('btnClear');
const btnCloseNotes = $('btnCloseNotes');
const btnNewNote = $('btnNewNote');
const saveOverlay = $('saveOverlay');
const editOverlay = $('editOverlay');
const filterBar = $('filterBar');
const toastEl = $('toast');

// ===== Toast (shared .toast component) =====
let toastTimer = null;
function showToast(msg, ms = 2200) {
  toastEl.textContent = msg;
  toastEl.style.display = '';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { toastEl.style.display = 'none'; }, ms);
}

// ===== Theme Sync =====
(function syncMode() {
  try {
    const parentMode = window.parent?.document?.documentElement?.getAttribute('data-mode');
    if (parentMode) document.documentElement.setAttribute('data-mode', parentMode);
  } catch {}
})();
window.addEventListener('message', (e) => {
  if (e.origin !== location.origin) return;
  if (e.data?.type === 'akasha-mode-change') {
    document.documentElement.setAttribute('data-mode', e.data.mode);
  }
});

// ===== Paper timestamp (decorative — 紙頁語言) =====
(function paperTimestamp() {
  const branches = ['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
  const now = new Date();
  const idx = Math.floor(((now.getHours() + 1) % 24) / 2);
  const ymd = now.toISOString().slice(0, 10);
  $('paperTimestamp').textContent = `${ymd} · ${branches[idx]}時 · 檯燈下`;
})();

// ===== Chat Rendering =====
function escapeHtml(str) {
  return String(str ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function formatClock(d) {
  return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
}

function appendMessage(role, text, animate = true) {
  const wrap = document.createElement('div');
  wrap.className = `im-msg im-msg--${role}`;
  if (!animate) wrap.style.animation = 'none';

  if (role === 'user') {
    const bubble = document.createElement('div');
    bubble.className = 'im-bubble';
    bubble.textContent = text;
    wrap.appendChild(bubble);
    chatScroll.appendChild(wrap);
    chatScroll.scrollTop = chatScroll.scrollHeight;
    return bubble;
  }

  const textEl = document.createElement('div');
  textEl.className = 'im-text';
  textEl.textContent = text;
  const sig = document.createElement('div');
  sig.className = 'im-signature';
  sig.textContent = '談心與手札整理員 · 月上零韻 · ' + formatClock(new Date());
  wrap.appendChild(textEl);
  wrap.appendChild(sig);
  chatScroll.appendChild(wrap);
  chatScroll.scrollTop = chatScroll.scrollHeight;
  return textEl;
}

function showThinking() {
  const wrap = document.createElement('div');
  wrap.className = 'im-msg im-msg--assistant';
  wrap.id = 'thinking-msg';
  const textEl = document.createElement('div');
  textEl.className = 'im-text im-thinking';
  textEl.textContent = '';
  wrap.appendChild(textEl);
  chatScroll.appendChild(wrap);
  chatScroll.scrollTop = chatScroll.scrollHeight;
}

function removeThinking() {
  const el = $('thinking-msg');
  if (el) el.remove();
}

// Typewriter effect
function typewrite(text, target, onDone) {
  let i = 0;
  const cursor = document.createElement('span');
  cursor.className = 'im-cursor';
  target.textContent = '';
  target.appendChild(cursor);

  clearInterval(state.typewriterTimer);
  state.typewriterTimer = setInterval(() => {
    if (i < text.length) {
      cursor.before(document.createTextNode(text[i]));
      i++;
      chatScroll.scrollTop = chatScroll.scrollHeight;
    } else {
      clearInterval(state.typewriterTimer);
      state.typewriterTimer = null;
      cursor.remove();
      if (onDone) onDone();
    }
  }, 28);
}

// ===== AI Communication =====
// The Reading Room talks to App Shell's AI infrastructure via PostMessage

const _pendingAI = new Map();

window.addEventListener('message', (e) => {
  if (e.origin !== location.origin) return;
  const d = e.data;

  if (d?.type === 'akasha-reading-room-response' && d._reqId && _pendingAI.has(d._reqId)) {
    const cb = _pendingAI.get(d._reqId);
    _pendingAI.delete(d._reqId);
    cb(d);
  }

  if (d?.type === 'akasha-ai-get-context') {
    const recentText = state.messages.slice(-6).map(m =>
      `[${m.role === 'user' ? '使用者' : '零韻'}] ${m.text}`
    ).join('\n');
    window.parent.postMessage({
      type: 'akasha-ai-context-response',
      content: recentText || '(談心專區已開啟，尚無對話)',
      fileName: '談心專區',
      fileType: 'chat',
    }, location.origin);
  }
});

async function sendToAI(userText) {
  return new Promise((resolve, reject) => {
    const reqId = crypto.randomUUID();
    _pendingAI.set(reqId, (data) => {
      if (data.error) reject(new Error(data.error));
      else resolve(data.response || '');
    });
    window.parent.postMessage({
      type: 'akasha-reading-room-send',
      text: userText,
      module: MODULE_NAME,
      noTrace: state.noTrace,
      _reqId: reqId,
    }, location.origin);

    setTimeout(() => {
      if (_pendingAI.has(reqId)) {
        _pendingAI.delete(reqId);
        reject(new Error('AI 回應逾時'));
      }
    }, 60000);
  });
}

// ===== Send Message =====
async function handleSend() {
  const text = chatInput.value.trim();
  if (!text || state.sending) return;

  state.sending = true;
  chatSend.disabled = true;
  chatInput.value = '';
  chatInput.style.height = 'auto';

  // Record & render user message
  state.messages.push({ role: 'user', text, time: Date.now() });
  appendMessage('user', text);

  // Show thinking
  showThinking();

  try {
    const response = await sendToAI(text);
    removeThinking();

    // Render with typewriter
    const textEl = appendMessage('assistant', '', true);
    typewrite(response, textEl, () => {
      // After response: check if we should suggest saving as note
      maybeSuggestNote(text, response);
    });

    state.messages.push({ role: 'assistant', text: response, time: Date.now() });
  } catch (err) {
    removeThinking();
    appendMessage('assistant', '連線時發生了問題：' + err.message);
    state.messages.push({ role: 'assistant', text: '(error: ' + err.message + ')', time: Date.now() });
  } finally {
    state.sending = false;
    chatSend.disabled = false;
    chatInput.focus();
  }
}

// ===== Auto-resize textarea =====
chatInput.addEventListener('input', () => {
  chatInput.style.height = 'auto';
  chatInput.style.height = Math.min(chatInput.scrollHeight, 120) + 'px';
});
chatInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    handleSend();
  }
});
chatSend.addEventListener('click', handleSend);

// ===== No-Trace Mode =====
function setNoTrace(on) {
  state.noTrace = on;
  deskDot.classList.toggle('is-danger', on);
  deskStatusText.textContent = on ? '不留痕已開啟 · 對話不寫入記憶' : '在館';
  btnNoTrace.classList.toggle('is-active', on);
  btnNoTrace.textContent = on ? '不留痕：開' : '不留痕模式';
  if (on) showToast('不留痕模式已開啟 — 對話不會寫入記憶');
}

btnNoTrace.addEventListener('click', () => setNoTrace(!state.noTrace));
$('linkNoTrace').addEventListener('click', () => setNoTrace(true));

// ===== Clear Chat =====
btnClear.addEventListener('click', () => {
  if (state.messages.length === 0) return;
  if (!confirm('確定要清除本次所有對話嗎？')) return;
  state.messages = [];
  chatScroll.innerHTML = '';
  clearInterval(state.typewriterTimer);
  showGreeting();
  showToast('對話已清除');
});

// ===== Notes Panel =====
function toggleNotes(open) {
  state.notesPanelOpen = open ?? !state.notesPanelOpen;
  notesPanel.hidden = !state.notesPanelOpen;
  btnNotes.classList.toggle('is-active', state.notesPanelOpen);
  if (state.notesPanelOpen) loadNotes();
}

btnNotes.addEventListener('click', () => toggleNotes());
btnCloseNotes.addEventListener('click', () => toggleNotes(false));

// ===== Notes CRUD (via parent's approved-memory) =====

async function loadNotes() {
  try {
    // Use parent window's memory API
    const memories = await callParentMemory('getAll', MODULE_NAME);
    state.notes = memories || [];
    renderFilterBar();
    renderNotes();
  } catch (err) {
    console.warn('Failed to load notes:', err);
    state.notes = [];
    renderFilterBar();
    renderNotes();
  }
}

function renderFilterBar() {
  const allTags = new Set();
  for (const n of state.notes) {
    for (const t of (n.tags || [])) allTags.add(t);
  }
  if (allTags.size === 0) { filterBar.innerHTML = ''; return; }

  const sorted = [...allTags].sort();
  filterBar.innerHTML =
    `<button class="im-filter-tag ${state.filterTag === null ? 'is-active' : ''}" data-tag="">全部</button>` +
    sorted.map(t =>
      `<button class="im-filter-tag ${state.filterTag === t ? 'is-active' : ''}" data-tag="${escapeHtml(t)}">#${escapeHtml(t)}</button>`
    ).join('');

  filterBar.onclick = (e) => {
    const btn = e.target.closest('.im-filter-tag');
    if (!btn) return;
    state.filterTag = btn.dataset.tag || null;
    renderFilterBar();
    renderNotes();
  };
}

function renderNotes() {
  const container = notesScroll;
  const empty = $('notesEmpty');

  const sorted = state.notes
    .slice()
    .sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));

  const filtered = state.filterTag
    ? sorted.filter(n => (n.tags || []).includes(state.filterTag))
    : sorted;

  if (filtered.length === 0) {
    container.innerHTML = '';
    if (state.notes.length === 0) {
      empty.innerHTML = `
        <div class="im-notes-empty__line">這裡的話不出這張桌子。</div>
        <div class="im-notes-empty__sub">想到什麼，就從第一句開始——對話中零韻會問要不要整理成手札。</div>`;
    } else {
      empty.innerHTML = `
        <div class="im-notes-empty__line">沒有符合的手札</div>
        <div class="im-notes-empty__sub">找不到標記「#${escapeHtml(state.filterTag)}」的篇章。</div>`;
    }
    container.appendChild(empty);
    empty.style.display = '';
    return;
  }

  empty.style.display = 'none';
  container.innerHTML = filtered.map(n => `
    <div class="im-note" data-id="${escapeHtml(n.id)}">
      <div class="im-note__title">${escapeHtml(n.title || '(無標題)')}</div>
      <div class="im-note__body">${escapeHtml(truncate(n.content, 200))}</div>
      <div class="im-note__meta">
        <span>${formatDate(n.createdAt)}</span>
        ${(n.tags || []).map(t => '<span>#' + escapeHtml(t) + '</span>').join('')}
      </div>
      <div class="im-note__actions">
        <button class="btn btn--xs" onclick="window._viewNote('${escapeHtml(n.id)}')">編輯</button>
        <button class="btn btn--xs btn--danger" onclick="window._deleteNote('${escapeHtml(n.id)}')">刪除</button>
      </div>
    </div>
  `).join('');
}

function truncate(s, n) {
  return (s || '').length > n ? s.slice(0, n) + '…' : (s || '');
}

function formatDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return `${d.getMonth() + 1}/${d.getDate()} ${d.getHours()}:${String(d.getMinutes()).padStart(2, '0')}`;
}

// Parent memory bridge — communicate via PostMessage
let memoryReqId = 0;
const memoryCallbacks = new Map();

function callParentMemory(action, ...args) {
  return new Promise((resolve, reject) => {
    const id = ++memoryReqId;
    memoryCallbacks.set(id, { resolve, reject });
    window.parent.postMessage({
      type: 'akasha-reading-room-memory',
      action,
      args,
      reqId: id,
    }, location.origin);
    setTimeout(() => {
      if (memoryCallbacks.has(id)) {
        memoryCallbacks.delete(id);
        reject(new Error('Memory call timeout'));
      }
    }, 5000);
  });
}

window.addEventListener('message', (e) => {
  if (e.origin !== location.origin) return;
  if (e.data?.type === 'akasha-reading-room-memory-response') {
    const cb = memoryCallbacks.get(e.data.reqId);
    if (cb) {
      memoryCallbacks.delete(e.data.reqId);
      if (e.data.error) cb.reject(new Error(e.data.error));
      else cb.resolve(e.data.result);
    }
  }
});

// Global handlers for inline onclick
let editingNoteId = null; // null = 新篇（建立模式）

function openEditDialog(note) {
  editingNoteId = note ? note.id : null;
  $('editDialogTitle').textContent = note ? '編輯手札' : '新篇手札';
  $('editTitle').value = note?.title || '';
  $('editContent').value = note?.content || '';
  $('editTags').value = (note?.tags || []).join(', ');
  $('editMeta').textContent = note
    ? '建立：' + formatDate(note.createdAt) +
      (note.updatedAt && note.updatedAt !== note.createdAt ? '　更新：' + formatDate(note.updatedAt) : '')
    : '';
  editOverlay.classList.add('active');
  $('editTitle').focus();
}

window._viewNote = async (id) => {
  const note = state.notes.find(n => n.id === id);
  if (!note) return;
  openEditDialog(note);
};

btnNewNote.addEventListener('click', () => openEditDialog(null));

function closeEditDialog() {
  editOverlay.classList.remove('active');
  editingNoteId = null;
}
$('editCancel').addEventListener('click', closeEditDialog);
$('editClose').addEventListener('click', closeEditDialog);

$('editSave').addEventListener('click', async () => {
  const title = $('editTitle').value.trim();
  const content = $('editContent').value.trim();
  const tagsRaw = $('editTags').value;
  const tags = tagsRaw
    .split(/[,，]/)
    .map(t => t.trim())
    .filter(Boolean);

  if (!content) { showToast('內容不能為空'); return; }

  try {
    const existing = editingNoteId ? state.notes.find(n => n.id === editingNoteId) : null;
    const record = existing
      ? { ...existing, title: title || autoTitle(content), content, tags }
      : { module: MODULE_NAME, title: title || autoTitle(content), content, tags, source: 'reading-room-manual' };
    await callParentMemory('save', record);
    closeEditDialog();
    showToast(existing ? '手札已更新' : '新篇已建立');
    await loadNotes();
  } catch (err) {
    showToast('儲存失敗：' + err.message);
  }
});

window._deleteNote = async (id) => {
  if (!confirm('確定要刪除這筆手札嗎？')) return;
  try {
    await callParentMemory('delete', id);
    showToast('手札已刪除');
    await loadNotes();
  } catch (err) {
    showToast('刪除失敗：' + err.message);
  }
};

// ===== Memory Save Dialog =====
let pendingSaveContent = '';

function showSaveDialog(content) {
  pendingSaveContent = content;
  saveOverlay.classList.add('active');
}

$('saveDlgCancel').addEventListener('click', () => {
  saveOverlay.classList.remove('active');
  pendingSaveContent = '';
});

$('saveDlgConfirm').addEventListener('click', async () => {
  const choice = document.querySelector('input[name="saveChoice"]:checked')?.value;
  saveOverlay.classList.remove('active');

  if (choice === 'none' || !pendingSaveContent) {
    pendingSaveContent = '';
    return;
  }

  try {
    if (choice === 'today') {
      // Session-only: stored in sessionStorage via parent
      await callParentMemory('saveSession', {
        module: MODULE_NAME,
        title: autoTitle(pendingSaveContent),
        content: pendingSaveContent,
        tags: ['談心'],
      });
      showToast('已保留至本次 session');
    } else if (choice === 'local' || choice === 'creative' || choice === 'notion') {
      const tags = ['談心'];
      if (choice === 'creative') tags.push('創作');
      const record = {
        module: MODULE_NAME,
        title: autoTitle(pendingSaveContent),
        content: pendingSaveContent,
        tags,
        source: 'reading-room',
      };
      const saved = await callParentMemory('save', record);
      if (choice === 'notion') {
        try {
          await callParentMemory('enqueueSync', saved || record);
          showToast('已存入手札並排入 Notion 同步');
        } catch {
          showToast('已存入手札，但 Notion 排隊失敗');
        }
      } else {
        showToast(choice === 'creative' ? '已存為創作素材' : '已存入零韻手札');
      }
      if (state.notesPanelOpen) await loadNotes();
    }
  } catch (err) {
    showToast('保存失敗：' + err.message);
  }

  pendingSaveContent = '';
});

// Auto-generate title from content
function autoTitle(text) {
  const first = text.split('\n').find(l => l.trim()) || '';
  return first.slice(0, 30) + (first.length > 30 ? '…' : '') || '談心記錄';
}

// ===== Suggest Note =====
// After every N assistant messages, or if the response is substantial
let msgCountSinceSave = 0;

function maybeSuggestNote(userText, response) {
  if (state.noTrace) return; // never suggest in no-trace mode
  msgCountSinceSave++;

  // Suggest after every 5 exchanges or if response is long
  const isSubstantial = response.length > 300;
  if (msgCountSinceSave >= 5 || isSubstantial) {
    // Build summary of recent conversation
    const recentPairs = state.messages.slice(-10);
    const summary = recentPairs.map(m =>
      `[${m.role === 'user' ? '使用者' : '零韻'}] ${m.text}`
    ).join('\n\n');

    setTimeout(() => {
      const wrap = document.createElement('div');
      wrap.className = 'im-msg im-msg--assistant';
      const note = document.createElement('div');
      note.className = 'margin-note';
      wrap.appendChild(note);
      chatScroll.appendChild(wrap);
      chatScroll.scrollTop = chatScroll.scrollHeight;

      typewrite('↳ 是否要將這段對話整理成零韻手札？', note, () => {
        const actions = document.createElement('div');
        actions.className = 'im-suggest-actions';
        actions.innerHTML = `
          <button class="btn btn--xs" id="suggestSave" style="color:var(--ink-intimarium);border-color:rgba(122,88,152,.45)">整理成手札</button>
          <button class="btn btn--xs btn--ghost" id="suggestSkip">跳過</button>
        `;
        wrap.appendChild(actions);

        $('suggestSave')?.addEventListener('click', () => {
          actions.remove();
          showSaveDialog(summary);
          msgCountSinceSave = 0;
        });
        $('suggestSkip')?.addEventListener('click', () => {
          actions.remove();
          showToast('已跳過');
          msgCountSinceSave = 0;
        });
      });
    }, 600);
  }
}

// ===== Safety links =====
$('linkDeleteAll').addEventListener('click', () => {
  if (confirm('確定要刪除談心專區的所有手札嗎？此操作無法復原。')) {
    callParentMemory('deleteAll', MODULE_NAME)
      .then(() => {
        showToast('所有談心手札已刪除');
        state.notes = [];
        renderNotes();
      })
      .catch(err => showToast('刪除失敗：' + err.message));
  }
});

$('linkMemOff').addEventListener('click', () => {
  setNoTrace(true);
  showToast('已開啟不留痕模式，長期記憶暫停寫入');
});

// ===== Export（匯出 MD／JSON 兩鍵，直達不經選單）=====
function exportNotes(fmt) {
  if (state.notes.length === 0) { showToast('沒有可匯出的手札'); return; }

  const sorted = state.notes
    .slice()
    .sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));

  const today = new Date().toISOString().slice(0, 10);
  let blob, filename;

  if (fmt === 'md') {
    const md = sorted.map(n => {
      const tags = (n.tags || []).map(t => '#' + t).join(' ');
      const date = n.createdAt ? new Date(n.createdAt).toLocaleString('zh-TW') : '';
      return `## ${n.title || '(無標題)'}\n\n${n.content || ''}\n\n> ${tags}${tags && date ? ' | ' : ''}${date}`;
    }).join('\n\n---\n\n');
    blob = new Blob(['# 零韻手札\n\n' + md], { type: 'text/markdown;charset=utf-8' });
    filename = `零韻手札_${today}.md`;
  } else {
    blob = new Blob([JSON.stringify(sorted, null, 2)], { type: 'application/json;charset=utf-8' });
    filename = `零韻手札_${today}.json`;
  }

  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.click();
  URL.revokeObjectURL(url);
  showToast('已匯出 ' + filename);
}

$('btnExportMd').addEventListener('click', () => exportNotes('md'));
$('btnExportJson').addEventListener('click', () => exportNotes('json'));

// ===== Greeting =====
function showGreeting() {
  const textEl = appendMessage('assistant', '', false);
  typewrite('歡迎來到談心專區。我是零韻，你的談心與手札整理員。\n這裡是你的私人閱覽室 — 可以聊聊近況、整理思緒，或讓我幫你整理手札。', textEl);
}

// ===== Init =====
showGreeting();
chatInput.focus();
