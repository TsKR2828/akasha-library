<!DOCTYPE html>
<html lang="zh-Hant" data-mode="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 設定 — 阿卡夏圖書館</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Noto+Serif+TC:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/styles/shared.css">
<style>

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Noto Serif TC', system-ui, sans-serif;
  background: var(--navy);
  color: var(--text-primary);
  min-height: 100vh;
  padding: 24px;
  max-width: 640px;
  margin: 0 auto;
}

h1 {
  color: var(--gold);
  font-size: 20px;
  margin-bottom: 6px;
}

.subtitle {
  color: var(--text-secondary);
  font-size: 12px;
  margin-bottom: 24px;
}

.section {
  background: var(--navy-light);
  border: 1px solid var(--navy-hover);
  border-radius: 10px;
  padding: 20px;
  margin-bottom: 16px;
}

.section-title {
  font-size: 14px;
  font-weight: 600;
  margin-bottom: 4px;
  color: var(--gold);
}

.section-desc {
  font-size: 11px;
  color: var(--text-secondary);
  margin-bottom: 14px;
}

.field {
  margin-bottom: 12px;
}

.field label {
  display: block;
  font-size: 11px;
  color: var(--text-secondary);
  text-transform: uppercase;
  letter-spacing: 0.1em;
  margin-bottom: 4px;
}

.field input, .field select {
  width: 100%;
  padding: 8px 12px;
  background: var(--navy);
  border: 1px solid var(--navy-hover);
  border-radius: 6px;
  color: var(--text-primary);
  font-size: 13px;
  font-family: inherit;
  outline: none;
  transition: border-color 0.2s;
}

.field input:focus, .field select:focus {
  border-color: var(--gold-dim);
}

.field select option {
  background: var(--navy);
}

.field .hint {
  font-size: 10px;
  color: var(--text-secondary);
  margin-top: 4px;
}

.btn {
  padding: 9px 18px;
  border: 1px solid var(--navy-hover);
  border-radius: 6px;
  background: var(--navy-light);
  color: var(--text-primary);
  font-size: 12px;
  font-family: inherit;
  cursor: pointer;
  transition: all 0.15s;
}

.btn:hover { border-color: var(--gold-dim); }
.btn-gold { background: var(--gold); color: var(--navy); border-color: var(--gold); font-weight: 600; }
.btn-gold:hover { background: var(--gold-dim); }
.btn-danger { border-color: var(--danger); color: var(--danger); }
.btn-danger:hover { background: var(--danger); color: var(--cream); }

.actions {
  display: flex;
  gap: 8px;
  margin-top: 14px;
}

/* Mode toggle */
.mode-toggle {
  display: flex;
  border: 1px solid var(--navy-hover);
  border-radius: 6px;
  overflow: hidden;
  margin-bottom: 16px;
}

.mode-toggle__btn {
  flex: 1;
  padding: 10px;
  background: var(--navy);
  border: none;
  color: var(--text-secondary);
  font-size: 12px;
  font-family: inherit;
  cursor: pointer;
  transition: all 0.15s;
  text-align: center;
}

.mode-toggle__btn--active {
  background: var(--gold-glow);
  color: var(--gold);
  font-weight: 600;
}

/* Coin balance */
.coin-display {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 16px;
  background: var(--navy);
  border: 1px solid var(--navy-hover);
  border-radius: 8px;
  margin-bottom: 14px;
}

.coin-display__icon {
  font-size: 28px;
}

.coin-display__info {
  flex: 1;
}

.coin-display__balance {
  font-size: 20px;
  font-weight: 600;
  color: var(--gold);
}

.coin-display__label {
  font-size: 11px;
  color: var(--text-secondary);
}

/* Usage log */
.usage-log {
  margin-top: 12px;
  max-height: 200px;
  overflow-y: auto;
}

.usage-log__item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 0;
  border-bottom: 1px solid var(--navy-hover);
  font-size: 11px;
}

.usage-log__item:last-child {
  border-bottom: none;
}

.usage-log__desc {
  color: var(--text-secondary);
}

.usage-log__cost {
  color: var(--danger);
  font-weight: 600;
}

.usage-log__cost--credit {
  color: var(--success);
}

/* Status indicator */
.status {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  padding: 4px 10px;
  border-radius: 10px;
  margin-top: 8px;
}

.status--ok {
  background: rgba(106,174,127,0.15);
  color: var(--success);
}

.status--none {
  background: rgba(199,91,91,0.15);
  color: var(--danger);
}

.toast {
  position: fixed;
  bottom: 20px;
  right: 20px;
  padding: 10px 16px;
  background: var(--success);
  color: var(--navy);
  border-radius: 6px;
  font-size: 12px;
  font-weight: 600;
  transform: translateY(60px);
  opacity: 0;
  transition: all 0.3s;
}

.toast.visible {
  transform: translateY(0);
  opacity: 1;
}
</style>
</head>
<body>

<h1>AI 圖書館員設定</h1>
<p class="subtitle">設定 AI 服務模式與用量管理</p>

<!-- Mode Toggle -->
<div class="mode-toggle">
  <button class="mode-toggle__btn mode-toggle__btn--active" id="modeByok" onclick="setMode('byok')">BYOK 自帶金鑰</button>
  <button class="mode-toggle__btn" id="modeCoin" onclick="setMode('coin')">月幣制</button>
</div>

<!-- BYOK Section -->
<div class="section" id="sectionByok">
  <div class="section-title">自帶 API Key（BYOK）</div>
  <div class="section-desc">使用您自己的 API Key 直接連線，不經過第三方，用量由您的帳號計費。</div>

  <div class="field">
    <label>AI 服務提供商</label>
    <select id="byokProvider" onchange="onProviderChange()">
      <option value="openai">OpenAI</option>
      <option value="anthropic">Anthropic (Claude)</option>
      <option value="google">Google (Gemini)</option>
      <option value="custom">自訂端點</option>
    </select>
  </div>

  <div class="field">
    <label>API Key</label>
    <input type="password" id="byokKey" placeholder="sk-... 或 您的 API Key">
    <div class="hint">金鑰僅儲存在您的瀏覽器本地端（localStorage），不會傳送至任何伺服器</div>
  </div>

  <div class="field" id="fieldCustomEndpoint" style="display:none;">
    <label>自訂 API 端點</label>
    <input type="text" id="byokEndpoint" placeholder="https://your-api.example.com/v1/chat">
  </div>

  <div class="field">
    <label>模型</label>
    <select id="byokModel">
      <option value="gpt-4o">GPT-4o</option>
      <option value="gpt-4o-mini">GPT-4o Mini</option>
      <option value="claude-sonnet-4-6">Claude Sonnet 4.6</option>
      <option value="claude-haiku-4-5-20251001">Claude Haiku 4.5</option>
      <option value="gemini-2.0-flash">Gemini 2.0 Flash</option>
    </select>
  </div>

  <div class="actions">
    <button class="btn btn-gold" onclick="saveByok()">儲存設定</button>
    <button class="btn" onclick="testByok()">測試連線</button>
    <button class="btn btn-danger" onclick="clearByok()">清除金鑰</button>
  </div>

  <div id="byokStatus"></div>
</div>

<!-- Coin Section -->
<div class="section" id="sectionCoin" style="display:none;">
  <div class="section-title">月幣系統</div>
  <div class="section-desc">使用平台提供的 AI 服務，以月幣計費。每月自動補充免費額度。</div>

  <div class="coin-display">
    <div class="coin-display__icon">&#127942;</div>
    <div class="coin-display__info">
      <div class="coin-display__balance" id="coinBalance">100</div>
      <div class="coin-display__label">月幣餘額</div>
    </div>
  </div>

  <div class="field">
    <label>費率參考</label>
    <div style="font-size:11px;color:var(--text-secondary);line-height:1.8;">
      &#8226; 一般對話：1 月幣 / 則<br>
      &#8226; 長文分析（>2000字）：3 月幣 / 則<br>
      &#8226; PDF 全文摘要：5 月幣<br>
      &#8226; 每月免費額度：100 月幣（每月 1 日重置）
    </div>
  </div>

  <div class="section-title" style="margin-top:16px;">使用紀錄</div>
  <div class="usage-log" id="usageLog">
    <div class="usage-log__item">
      <span class="usage-log__desc">尚無使用紀錄</span>
    </div>
  </div>

  <div class="actions">
    <button class="btn" onclick="resetCoins()">重置為免費額度</button>
  </div>
</div>

<!-- Estimate Section -->
<div class="section">
  <div class="section-title">用量預估器</div>
  <div class="section-desc">根據文字長度預估 token 數與費用</div>

  <div class="field">
    <label>輸入文字長度（字數）</label>
    <input type="number" id="estimateChars" placeholder="2000" value="2000" oninput="updateEstimate()">
  </div>

  <div id="estimateResult" style="font-size:12px;color:var(--text-secondary);margin-top:8px;"></div>
</div>

<div class="toast" id="toast"></div>

<script>
const STORAGE_KEY = 'akasha-ai-settings';
const COIN_KEY = 'akasha-coin-balance';
const USAGE_KEY = 'akasha-coin-usage';

let currentMode = 'byok';

function loadSettings() {
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
    if (saved.mode) {
      currentMode = saved.mode;
      setMode(saved.mode);
    }
    if (saved.provider) document.getElementById('byokProvider').value = saved.provider;
    if (saved.apiKey) document.getElementById('byokKey').value = saved.apiKey;
    if (saved.endpoint) document.getElementById('byokEndpoint').value = saved.endpoint;
    if (saved.model) document.getElementById('byokModel').value = saved.model;
    onProviderChange();
    updateByokStatus();
  } catch {}
  loadCoinBalance();
  loadUsageLog();
  updateEstimate();
}

function setMode(mode) {
  currentMode = mode;
  document.getElementById('modeByok').classList.toggle('mode-toggle__btn--active', mode === 'byok');
  document.getElementById('modeCoin').classList.toggle('mode-toggle__btn--active', mode === 'coin');
  document.getElementById('sectionByok').style.display = mode === 'byok' ? '' : 'none';
  document.getElementById('sectionCoin').style.display = mode === 'coin' ? '' : 'none';

  const settings = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
  settings.mode = mode;
  localStorage.setItem(STORAGE_KEY, JSON.stringify(settings));
}

function onProviderChange() {
  const provider = document.getElementById('byokProvider').value;
  document.getElementById('fieldCustomEndpoint').style.display = provider === 'custom' ? '' : 'none';

  const modelSelect = document.getElementById('byokModel');
  const models = {
    openai: [['gpt-4o', 'GPT-4o'], ['gpt-4o-mini', 'GPT-4o Mini']],
    anthropic: [['claude-sonnet-4-6', 'Claude Sonnet 4.6'], ['claude-haiku-4-5-20251001', 'Claude Haiku 4.5']],
    google: [['gemini-2.0-flash', 'Gemini 2.0 Flash'], ['gemini-2.5-pro', 'Gemini 2.5 Pro']],
    custom: [['custom', '自訂模型']],
  };

  modelSelect.innerHTML = (models[provider] || models.custom)
    .map(([val, label]) => `<option value="${val}">${label}</option>`)
    .join('');
}

function saveByok() {
  const settings = {
    mode: currentMode,
    provider: document.getElementById('byokProvider').value,
    apiKey: document.getElementById('byokKey').value.trim(),
    endpoint: document.getElementById('byokEndpoint').value.trim(),
    model: document.getElementById('byokModel').value,
  };
  localStorage.setItem(STORAGE_KEY, JSON.stringify(settings));
  updateByokStatus();
  showToast('設定已儲存');
}

function clearByok() {
  if (!confirm('確定要清除 API Key 嗎？')) return;
  document.getElementById('byokKey').value = '';
  document.getElementById('byokEndpoint').value = '';
  const settings = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
  delete settings.apiKey;
  delete settings.endpoint;
  localStorage.setItem(STORAGE_KEY, JSON.stringify(settings));
  updateByokStatus();
  showToast('已清除金鑰');
}

function updateByokStatus() {
  const key = document.getElementById('byokKey').value.trim();
  const el = document.getElementById('byokStatus');
  if (key) {
    const masked = key.slice(0, 7) + '...' + key.slice(-4);
    el.innerHTML = `<div class="status status--ok">&#9679; 已設定（${masked}）</div>`;
  } else {
    el.innerHTML = `<div class="status status--none">&#9679; 尚未設定 API Key</div>`;
  }
}

async function testByok() {
  const key = document.getElementById('byokKey').value.trim();
  if (!key) { showToast('請先輸入 API Key'); return; }

  const provider = document.getElementById('byokProvider').value;
  showToast('測試連線中...');

  try {
    let ok = false;
    if (provider === 'openai') {
      const res = await fetch('https://api.openai.com/v1/models', {
        headers: { 'Authorization': `Bearer ${key}` }
      });
      ok = res.ok;
    } else if (provider === 'anthropic') {
      const res = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: {
          'x-api-key': key,
          'content-type': 'application/json',
          'anthropic-version': '2023-06-01',
          'anthropic-dangerous-direct-browser-access': 'true'
        },
        body: JSON.stringify({ model: 'claude-haiku-4-5-20251001', max_tokens: 1, messages: [{ role: 'user', content: 'hi' }] })
      });
      ok = res.ok;
    } else if (provider === 'google') {
      const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${key}`);
      ok = res.ok;
    } else {
      const endpoint = document.getElementById('byokEndpoint').value.trim();
      if (!endpoint) { showToast('請輸入自訂端點'); return; }
      const res = await fetch(endpoint, { method: 'OPTIONS' });
      ok = res.ok || res.status === 405;
    }

    showToast(ok ? '連線成功 ✓' : '連線失敗 — 請檢查 Key');
  } catch (err) {
    showToast('連線錯誤: ' + err.message);
  }
}

// === 月幣系統 ===
function loadCoinBalance() {
  const data = getCoinData();
  document.getElementById('coinBalance').textContent = data.balance;
}

function getCoinData() {
  const defaultData = { balance: 100, lastReset: new Date().toISOString().slice(0, 7) };
  try {
    const saved = JSON.parse(localStorage.getItem(COIN_KEY));
    if (!saved) return defaultData;

    const currentMonth = new Date().toISOString().slice(0, 7);
    if (saved.lastReset !== currentMonth) {
      saved.balance = 100;
      saved.lastReset = currentMonth;
      localStorage.setItem(COIN_KEY, JSON.stringify(saved));
    }
    return saved;
  } catch { return defaultData; }
}

function deductCoins(amount, description) {
  const data = getCoinData();
  if (data.balance < amount) return false;

  data.balance -= amount;
  localStorage.setItem(COIN_KEY, JSON.stringify(data));

  const usage = JSON.parse(localStorage.getItem(USAGE_KEY) || '[]');
  usage.unshift({ desc: description, cost: amount, time: Date.now() });
  if (usage.length > 50) usage.length = 50;
  localStorage.setItem(USAGE_KEY, JSON.stringify(usage));

  loadCoinBalance();
  loadUsageLog();
  return true;
}

function resetCoins() {
  const data = { balance: 100, lastReset: new Date().toISOString().slice(0, 7) };
  localStorage.setItem(COIN_KEY, JSON.stringify(data));
  loadCoinBalance();
  showToast('已重置為 100 月幣');
}

function loadUsageLog() {
  const usage = JSON.parse(localStorage.getItem(USAGE_KEY) || '[]');
  const container = document.getElementById('usageLog');

  if (usage.length === 0) {
    container.innerHTML = '<div class="usage-log__item"><span class="usage-log__desc">尚無使用紀錄</span></div>';
    return;
  }

  container.innerHTML = usage.slice(0, 20).map(item => {
    const date = new Date(item.time).toLocaleDateString('zh-TW');
    return `<div class="usage-log__item">
      <span class="usage-log__desc">${date} — ${item.desc}</span>
      <span class="usage-log__cost">-${item.cost} 幣</span>
    </div>`;
  }).join('');
}

// === 預估器 ===
function updateEstimate() {
  const chars = parseInt(document.getElementById('estimateChars').value) || 0;
  const tokens = Math.ceil(chars * 0.6);
  const coins = tokens <= 500 ? 1 : tokens <= 2000 ? 3 : 5;

  document.getElementById('estimateResult').innerHTML =
    `約 <strong>${tokens}</strong> tokens → 消耗 <strong style="color:var(--gold)">${coins} 月幣</strong>`;
}

// === Utils ===
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('visible');
  setTimeout(() => t.classList.remove('visible'), 2500);
}

// Export for parent frame communication
window.akashaAI = {
  getSettings: () => JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'),
  getBalance: () => getCoinData().balance,
  deductCoins,
};

loadSettings();
</script>
</body>
</html>
