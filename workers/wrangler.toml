name = "akasha-ai-proxy"
main = "src/index.js"
compatibility_date = "2024-12-01"

# Deploy: wrangler deploy
# Secrets (set via `wrangler secret put`):
#   OPENAI_API_KEY
#   ANTHROPIC_API_KEY
#   GOOGLE_API_KEY
#   COIN_SECRET          — HMAC key for session tokens (enables auth)

# Environment variables:
# [vars]
# GOOGLE_CLIENT_ID = "YOUR_CLIENT_ID.apps.googleusercontent.com"
# ALLOWED_ORIGINS  = "https://your-app.pages.dev,https://your-domain.com"

# KV Namespaces — create first, then fill in the IDs:
#   wrangler kv namespace create COIN_KV
#   wrangler kv namespace create SYNC_KV

# [[kv_namespaces]]
# binding = "COIN_KV"
# id = "<your-coin-kv-namespace-id>"

# [[kv_namespaces]]
# binding = "SYNC_KV"
# id = "<your-sync-kv-namespace-id>"
